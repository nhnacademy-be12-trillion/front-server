<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<head>
  <title>Trillion-Shop | 위시리스트</title>
</head>

<body>
<div layout:fragment="content">

  <div class="container-fluid bg-secondary mb-5">
    <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 200px">
      <h1 class="font-weight-semi-bold text-uppercase mb-3">나의 위시리스트</h1>
      <div class="d-inline-flex">
        <p class="m-0"><a th:href="@{/static}">Home</a></p>
        <p class="m-0 px-2">-</p>
        <p class="m-0">Wishlist</p>
      </div>
    </div>
  </div>

  <div class="container-fluid pt-5">
    <div class="row px-xl-5">
      <div class="col-12 table-responsive mb-5">
        <table class="table table-light table-borderless table-hover text-center mb-0">
          <thead class="thead-dark">
          <tr>
            <th>상품 이미지</th>
            <th>상품명</th>
            <th>가격</th>
            <th>장바구니</th>
            <th>삭제</th>
          </tr>
          </thead>
          <tbody class="align-middle" id="wishlist-body">

          <tr th:if="${#lists.isEmpty(books)}">
            <td colspan="5" class="py-5">찜한 도서가 없습니다.</td>
          </tr>

          <tr th:each="book : ${books}"
              th:unless="${book.bookState.name() == 'SALE_END'}"
              class="wishlist-item">

            <td class="align-middle">
              <img th:src="${!#strings.isEmpty(book.bookImage) ? '/trillion-bucket/' + book.bookImage : '/img/default-book.png'}"
                   alt="" style="width: 50px;">
            </td>

            <td class="align-middle text-left pl-5">
              <a th:href="@{/books/{id}(id=${book.bookId})}"
                 class="text-dark font-weight-bold">
                <span th:text="${book.bookName}">책 제목</span>
                <span th:if="${book.bookState.name() == 'SOLD_OUT'}"
                      class="badge badge-danger ml-2" style="font-size: 0.75rem;">품절</span>
              </a>
            </td>

            <td class="align-middle"
                th:text="${#numbers.formatInteger(book.bookSalePrice, 0, 'COMMA')} + '원'">10,000원</td>

            <td class="align-middle">
              <button th:if="${book.bookState.name() != 'SOLD_OUT'}"
                      class="btn btn-sm btn-primary"
                      th:onclick="'addToCart(' + ${book.bookId} + ')'">
                <i class="fa fa-shopping-cart mr-1"></i> 담기
              </button>

              <button th:if="${book.bookState.name() == 'SOLD_OUT'}"
                      class="btn btn-sm btn-primary"
                      disabled>
                <i class="fa fa-shopping-cart mr-1"></i> 담기
              </button>
            </td>

            <td class="align-middle">
              <button class="btn btn-sm btn-danger"
                      th:onclick="'removeWishlist(' + ${book.bookId} + ')'">
                <i class="fa fa-times"></i>
              </button>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<th:block layout:fragment="script">
  <script>
    $(document).ready(function() {
      // [추가] 페이지 로드 시 실제 보이는 아이템 개수로 헤더 배지 수량 동기화
      // SALE_END로 인해 숨겨진 아이템이 있을 경우 헤더 숫자와 다를 수 있으므로 보정
      updateVisibleBadgeCount();
    });

    function updateVisibleBadgeCount() {
      // wishlist-item 클래스를 가진 행의 개수를 셈
      var visibleItems = $('.wishlist-item').length;
      var $badge = $('#wishlist-badge');

      if ($badge.length > 0) {
        $badge.text(visibleItems);
      }
    }

    // 삭제 버튼
    function removeWishlist(bookId) {
      if(!confirm('정말 삭제하시겠습니까?')) return;

      fetch('/wishlists/toggle?bookId=' + bookId)
              .then(response => response.json())
              .then(data => {
                alert('삭제되었습니다.');
                location.reload(); // 목록 갱신 및 수량 재계산을 위해 새로고침
              })
              .catch(error => {
                console.error('Error:', error);
                alert('삭제 중 오류가 발생했습니다.');
              });
    }

    // 장바구니 담기
    function addToCart(bookId) {
      const data = { bookId: bookId, cartQuantity: 1 };

      fetch('/carts/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
              .then(response => {
                if (response.ok) {
                  // 공통 헤더 배지 업데이트 (낙관적 업데이트)
                  if (typeof incrementCartBadge === 'function') {
                    incrementCartBadge();
                  }
                  if (typeof updateCartBadge === 'function') {
                    updateCartBadge();
                  }

                  if (confirm('장바구니에 담겼습니다. 장바구니로 이동하시겠습니까?')) {
                    location.href = '/carts';
                  }
                } else if (response.status === 401) {
                  if(confirm('로그인이 필요한 서비스입니다. 로그인 페이지로 이동하시겠습니까?')) {
                    location.href = '/login';
                  }
                } else {
                  response.text().then(msg => alert('장바구니 담기 실패: ' + msg));
                }
              })
              .catch(error => {
                console.error('Error:', error);
                alert('오류가 발생했습니다.');
              });
    }
  </script>
</th:block>
</body>
</html>
