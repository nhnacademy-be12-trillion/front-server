<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<head>
    <title>Trillion-Shop | 위시리스트</title>
</head>

<body>
<div layout:fragment="content">
    <style>
        /* [마이페이지와 동일한 사이드바 스타일] */
        .mypage-menu .nav-link {
            border-radius: 5px;
            padding: 12px 20px;
            color: #333;
            transition: all 0.2s;
        }
        .mypage-menu .nav-link:hover {
            background-color: #f1f3f5;
        }
        /* 활성화 상태: 하늘색 배경, 흰색 글씨 */
        .mypage-menu .nav-link.active {
            background-color: #87CEEB;
            color: #ffffff;
            font-weight: 700;
        }

        /* 테이블 텍스트 스타일 통일 */
        .table-text-title {
            color: #333;
            font-weight: 700;
            text-decoration: none;
        }
        .table-text-title:hover {
            color: var(--primary-brown);
            text-decoration: none;
        }
    </style>

    <div class="container">
        <div class="row px-xl-5">
            <div class="col-12">
                <nav class="breadcrumb bg-light mb-30">
                    <a class="breadcrumb-item text-dark" href="/">Home</a>
                    <a class="breadcrumb-item text-dark" href="/members/my-page">마이페이지</a>
                    <span class="breadcrumb-item active">찜한 상품</span>
                </nav>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row px-xl-5">

            <div class="col-lg-3 col-md-4 mb-5">
                <h5 class="section-title position-relative text-uppercase mb-3">
                    <span class="bg-secondary pr-3">MY 메뉴</span>
                </h5>
                <div class="bg-light p-30 rounded shadow-sm border">
                    <div class="nav flex-column nav-pills mypage-menu" aria-orientation="vertical">
                        <a class="nav-link text-dark mb-2" th:href="@{/members/my-page}">
                            <i class="fa fa-user-circle mr-2"></i>내 정보 / 배송지
                        </a>
                        <a class="nav-link text-dark mb-2" th:href="@{/my-page/points}">
                            <i class="fas fa-coins mr-2"></i>포인트 내역
                        </a>
                        <a class="nav-link text-dark mb-2" th:href="@{/my-page/orders}">
                            <i class="fa fa-shopping-bag mr-2"></i>주문/배송 조회
                        </a>
                        <a class="nav-link text-dark mb-2" th:href="@{/my-page/history}">
                            <i class="fa fa-undo mr-2"></i>취소/반품 내역
                        </a>
                        <a class="nav-link active mb-2" th:href="@{/wishlists}">
                            <i class="fa fa-heart mr-2"></i>찜한 상품
                        </a>
                        <a class="nav-link text-dark  mb-2" th:href="@{/my-coupons}">
                            <i class="fa fa-ticket mr-2"></i>쿠폰 조회
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-lg-9 col-md-8">
                <h2 class="section-title position-relative text-uppercase mb-4">
                    <span class="bg-secondary pr-3">찜한 상품</span>
                </h2>

                <div class="bg-light p-30 mb-5 rounded shadow-sm border">
                    <div class="table-responsive">
                        <table class="table table-hover text-center mb-0">
                            <thead class="thead-light">
                            <tr>
                                <th style="width: 15%;">이미지</th>
                                <th style="width: 40%;" class="text-left pl-4">상품정보</th>
                                <th style="width: 15%;">가격</th>
                                <th style="width: 15%;">담기</th>
                                <th style="width: 15%;">관리</th>
                            </tr>
                            </thead>
                            <tbody id="wishlist-body">

                            <tr th:if="${#lists.isEmpty(books)}">
                                <td colspan="5" class="py-5 text-center text-muted">
                                    <i class="far fa-heart fa-2x mb-3 d-block text-secondary"></i>
                                    <p class="mb-0">찜한 도서가 없습니다.</p>
                                </td>
                            </tr>

                            <tr th:each="book : ${books}"
                                th:unless="${book.bookState.name() == 'SALE_END'}"
                                class="wishlist-item">

                                <td class="align-middle">
                                    <a th:href="@{/books/{id}(id=${book.bookId})}">
                                        <img th:src="${!#strings.isEmpty(book.bookImage) ? '/trillion-bucket/' + book.bookImage : '/img/default-book.png'}"
                                             alt="표지" class="img-fluid rounded border"
                                             style="width: 50px; height: 75px; object-fit: cover;">
                                    </a>
                                </td>

                                <td class="align-middle text-left pl-4">
                                    <a th:href="@{/books/{id}(id=${book.bookId})}" class="table-text-title d-block mb-1">
                                        <span th:text="${book.bookName}">책 제목</span>
                                    </a>
                                    <small class="text-muted" th:text="${book.bookAuthor}">저자</small>

                                    <div th:if="${book.bookState.name() == 'SOLD_OUT'}" class="mt-1">
                                        <span class="badge badge-secondary" style="font-size: 0.75rem;">일시품절</span>
                                    </div>
                                </td>

                                <td class="align-middle font-weight-bold text-dark"
                                    th:text="${#numbers.formatInteger(book.bookSalePrice, 0, 'COMMA')} + '원'">
                                    10,000원
                                </td>

                                <td class="align-middle">
                                    <button th:if="${book.bookState.name() != 'SOLD_OUT'}"
                                            class="btn btn-sm btn-outline-brown shadow-sm text-nowrap"
                                            th:onclick="'addToCart(' + ${book.bookId} + ')'"
                                            style="border-radius: 5px;">
                                        <i class="fa fa-shopping-cart"></i>
                                    </button>

                                    <button th:if="${book.bookState.name() == 'SOLD_OUT'}"
                                            class="btn btn-sm btn-secondary text-nowrap"
                                            style="border-radius: 5px;"
                                            disabled>
                                        <i class="fa fa-ban"></i>
                                    </button>
                                </td>

                                <td class="align-middle">
                                    <button class="btn btn-sm btn-outline-danger"
                                            style="border-radius: 5px;"
                                            th:onclick="'removeWishlist(' + ${book.bookId} + ')'"
                                            title="삭제">
                                        <i class="fa fa-times"></i>
                                    </button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script>
        $(document).ready(function() {
            updateVisibleBadgeCount();
        });

        function updateVisibleBadgeCount() {
            var visibleItems = $('.wishlist-item').length;
            var $badge = $('#wishlist-badge');
            if ($badge.length > 0) {
                $badge.text(visibleItems);
            }
        }

        // 삭제 버튼
        function removeWishlist(bookId) {
            if(!confirm('찜 목록에서 삭제하시겠습니까?')) return;

            fetch('/wishlists/toggle?bookId=' + bookId)
                .then(response => response.json())
                .then(data => {
                    location.reload();
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('오류가 발생했습니다.');
                });
        }

        // 장바구니 담기
        function addToCart(bookId) {
            const data = { bookId: bookId, cartQuantity: 1 };

            fetch('/carts/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
                .then(response => {
                    if (response.ok) {
                        if (typeof incrementCartBadge === 'function') incrementCartBadge();
                        if (typeof updateCartBadge === 'function') updateCartBadge();

                        if (confirm('장바구니에 담겼습니다. 장바구니로 이동하시겠습니까?')) {
                            location.href = '/carts';
                        }
                    } else if (response.status === 401) {
                        if(confirm('로그인이 필요한 서비스입니다. 로그인 페이지로 이동하시겠습니까?')) {
                            location.href = '/login';
                        }
                    } else {
                        response.text().then(msg => alert('실패: ' + msg));
                    }
                })
                .catch(error => alert('오류가 발생했습니다.'));
        }
    </script>
</th:block>
</body>
</html>
