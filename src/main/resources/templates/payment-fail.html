<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<head>
  <meta charset="UTF-8">
  <title>Trillion-Shop | 결제 실패</title>
</head>

<body>
<div layout:fragment="content">
  <div class="container pt-5 pb-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 text-center">

        <div class="mb-4">
          <i class="fa fa-times-circle text-danger" style="font-size: 80px;"></i>
        </div>

        <h2 class="mb-3">결제 요청이 실패하였습니다.</h2>
        <p class="mb-4 text-muted">결제 과정에서 오류가 발생했습니다. 다시 시도해 주세요.</p>

        <div class="card border-danger shadow-sm mb-5 text-left">
          <div class="card-body text-danger">
            <h5 class="card-title border-bottom border-danger pb-2">오류 내용</h5>

            <div class="d-flex justify-content-between mb-2">
              <span class="font-weight-bold">에러 코드</span>
              <span th:text="${code}">UNKNOWN_ERROR</span>
            </div>

            <div class="d-flex justify-content-between">
              <span class="font-weight-bold">에러 메시지</span>
              <span th:text="${message}">알 수 없는 오류가 발생했습니다.</span>
            </div>
          </div>
        </div>

        <div>
          <a href="/payments" class="btn btn-primary px-4 py-2 mr-2">다시 결제하기</a>
          <a href="/" class="btn btn-outline-dark px-4 py-2">홈으로 가기</a>
        </div>

      </div>
    </div>
  </div>
</div>
</body>
</html>
