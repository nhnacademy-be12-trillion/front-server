<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="sidebar(activeMenu)" class="col-lg-3 col-md-4 mb-4">
    <h5 class="section-title position-relative text-uppercase mb-4">
        <span class="pr-3" style="background:var(--warm-bg); font-weight: 800;">관리 메뉴</span>
    </h5>

    <div class="bg-white p-30 rounded shadow-sm border">
        <div class="nav flex-column nav-pills admin-menu" id="admin-tab" role="tablist" aria-orientation="vertical">
            <a class="nav-link" th:classappend="${activeMenu == 'orders'} ? 'active' : ''" th:href="@{/admin/orders}">
                <i class="fas fa-shopping-bag mr-2"></i>주문 관리
            </a>

            <a class="nav-link" th:classappend="${activeMenu == 'book-management'} ? 'active' : ''" th:href="@{/admin/books/management}">
                <i class="fas fa-book-open mr-2"></i>도서 관리 (수정/삭제)
            </a>

            <a class="nav-link" th:classappend="${activeMenu == 'book-register'} ? 'active' : ''" th:href="@{/admin/books/register}">
                <i class="fas fa-plus-circle mr-2"></i>신규 도서 등록
            </a>

            <a class="nav-link" th:classappend="${activeMenu == 'policies'} ? 'active' : ''" th:href="@{/admin/policies}">
                <i class="fas fa-cog mr-2"></i>정책 설정
            </a>

            <a class="nav-link" th:classappend="${activeMenu == 'coupons'} ? 'active' : ''" th:href="@{/admin/coupons}">
                <i class="fas fa-ticket-alt mr-2"></i>쿠폰 관리
            </a>

            <a class="nav-link" th:classappend="${activeMenu == 'members'} ? 'active' : ''" th:href="@{/admin/members}">
                <i class="fas fa-users mr-2"></i>회원 관리
            </a>
        </div>
    </div>
</div>
</html>
