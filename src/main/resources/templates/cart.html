<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<head>
    <meta charset="utf-8">
    <title>Trillion-Shop | 장바구니</title>
</head>

<body>
<div layout:fragment="content">

    <div class="container-fluid">
        <div class="row px-xl-5">
            <div class="col-lg-8 mb-5">
                <h5 class="section-title position-relative text-uppercase mb-3">
                    <span class="bg-secondary pr-3">장바구니</span>
                </h5>
                <div class="bg-light p-30 table-responsive">
                    <table class="table table-light table-borderless table-hover text-center mb-0">
                        <thead class="thead-dark">
                        <tr>
                            <th class="text-left">상품정보</th>
                            <th>가격</th>
                            <th>수량</th>
                            <th>합계</th>
                            <th>삭제</th>
                        </tr>
                        </thead>
                        <tbody class="align-middle">

                        <tr th:if="${cartItems != null and !cartItems.empty}"
                            th:each="item : ${cartItems}">

                            <td class="align-middle text-left">
                                <img th:src="${item.book.bookImage != null ? item.book.bookImage : '/img/product-1.jpg'}"
                                     alt="" style="width: 50px; aspect-ratio: 1/1.4; object-fit: cover;">
                                <a th:href="@{/books/{id}(id=${item.book.bookId})}"
                                   class="text-dark ml-2" th:text="${item.book.bookName}">도서 제목</a>
                            </td>
                            <td class="align-middle"
                                th:text="${#numbers.formatInteger(item.book.bookSalePrice, 0, 'COMMA')} + '원'">0원</td>

                            <td class="align-middle">
                                <div class="input-group quantity mx-auto" style="width: 100px;">
                                    <div class="input-group-btn">
                                        <form th:action="@{/carts/update}" method="post" style="display:inline;">
                                            <input type="hidden" name="bookId" th:value="${item.id}">
                                            <input type="hidden" name="quantity" th:value="${item.quantity - 1}">
                                            <button type="submit" class="btn btn-sm btn-primary btn-minus">
                                                <i class="fa fa-minus"></i>
                                            </button>
                                        </form>
                                    </div>
                                    <input type="text" class="form-control form-control-sm bg-secondary border-0 text-center"
                                           th:value="${item.quantity}" readonly>
                                    <div class="input-group-btn">
                                        <form th:action="@{/carts/update}" method="post" style="display:inline;">
                                            <input type="hidden" name="bookId" th:value="${item.id}">
                                            <input type="hidden" name="quantity" th:value="${item.quantity + 1}">
                                            <button type="submit" class="btn btn-sm btn-primary btn-plus">
                                                <i class="fa fa-plus"></i>
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </td>

                            <td class="align-middle" th:text="${#numbers.formatInteger(item.subtotal, 0, 'COMMA')} + '원'">0원</td>
                            <td class="align-middle">
                                <form th:action="@{/carts/delete/{id}(id=${item.id})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-sm btn-danger"><i class="fa fa-times"></i></button>
                                </form>
                            </td>
                        </tr>

                        <tr th:if="${cartItems == null or cartItems.empty}">
                            <td colspan="5" class="align-middle py-5 text-center">
                                <h5 class="m-0 text-muted">장바구니가 비어있습니다.</h5>
                                <a th:href="@{/books}" class="btn btn-sm btn-primary mt-3">쇼핑 계속하기</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="col-lg-4">
                <h5 class="section-title position-relative text-uppercase mb-3">
                    <span class="bg-secondary pr-3">장바구니 요약</span>
                </h5>
                <div class="bg-light p-30 mb-5">
                    <div class="border-bottom pb-2">
                        <div class="d-flex justify-content-between mb-3">
                            <h6>상품 금액</h6>
                            <h6 th:text="${#numbers.formatInteger(cart.subTotal, 0, 'COMMA')} + '원'">0원</h6>
                        </div>
                        <div class="d-flex justify-content-between">
                            <h6 class="font-weight-medium">배송비</h6>
                            <h6 class="font-weight-medium"
                                th:text="${cart.shippingFee > 0 ? #numbers.formatInteger(cart.shippingFee, 0, 'COMMA') + '원' : '무료'}">0원</h6>
                        </div>
                    </div>
                    <div class="pt-2">
                        <div class="d-flex justify-content-between mt-2">
                            <h5>총 결제 예정 금액</h5>
                            <h5 th:text="${#numbers.formatInteger(cart.totalPrice, 0, 'COMMA')} + '원'">0원</h5>
                        </div>

                        <a th:href="@{/checkout}"
                           class="btn btn-block btn-primary font-weight-bold my-3 py-3"
                           th:classappend="${cartItems == null or cartItems.empty} ? 'disabled' : ''">
                            주문서 작성하기
                        </a>

                        <form th:action="@{/carts/clear}" method="post" th:if="${cartItems != null and !cartItems.empty}">
                            <button type="submit" class="btn btn-block btn-outline-danger font-weight-bold my-2 py-2">
                                장바구니 비우기
                            </button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
