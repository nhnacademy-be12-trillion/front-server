<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<head>
    <meta charset="utf-8">
    <title>Trillion-Shop | 장바구니</title>
</head>

<body>
<div layout:fragment="content">

    <div class="container">
        <div class="row px-xl-5">
            <div class="col-lg-8 mb-5">
                <h5 class="section-title position-relative text-uppercase mb-3">
                    <span class="bg-secondary pr-3">장바구니</span>
                </h5>
                <div class="bg-light p-30 table-responsive">
                    <table class="table table-light table-borderless table-hover text-center mb-0">
                        <thead class="thead-dark">
                        <tr>
                            <th class="text-left">상품정보</th>
                            <th>가격</th>
                            <th>수량</th>
                            <th>합계</th>
                            <th>삭제</th>
                        </tr>
                        </thead>
                        <tbody class="align-middle">

                        <tr th:if="${cartItems != null and !cartItems.empty}"
                            th:each="item : ${cartItems}">

                            <td class="align-middle text-left">
                                <img th:src="${!#strings.isEmpty(item.book.bookImage) ? '/trillion-bucket/' + item.book.bookImage : '/img/default-book.png'}"
                                     alt="" style="width: 50px; aspect-ratio: 1/1.4; object-fit: cover;">
                                <a th:href="@{/books/{id}(id=${item.book.bookId})}"
                                   class="text-dark ml-2" th:text="${item.book.bookName}">도서 제목</a>
                            </td>

                            <td class="align-middle"
                                th:text="${#numbers.formatInteger(item.book.bookSalePrice, 0, 'COMMA')} + '원'">0원</td>

                            <td class="align-middle">
                                <div class="input-group mx-auto" style="width: 100px;">
                                    <div class="input-group-btn">
                                        <form th:action="@{/carts/update}" method="post" style="display:inline;"
                                              th:onsubmit="'if(' + ${item.quantity} + ' <= 1) { alert(\'최소 수량은 1개입니다.\'); return false; }'">
                                            <input type="hidden" name="bookId" th:value="${item.book.bookId}">
                                            <input type="hidden" name="quantity" th:value="${item.quantity - 1}">
                                            <button type="submit" class="btn btn-sm btn-primary">
                                                <i class="fa fa-minus"></i>
                                            </button>
                                        </form>
                                    </div>

                                    <input type="text" class="form-control form-control-sm bg-secondary border-0 text-center"
                                           th:value="${item.quantity}" readonly>

                                    <div class="input-group-btn">
                                        <form th:action="@{/carts/update}" method="post" style="display:inline;">
                                            <input type="hidden" name="bookId" th:value="${item.book.bookId}">
                                            <input type="hidden" name="quantity" th:value="${item.quantity + 1}">
                                            <button type="submit" class="btn btn-sm btn-primary">
                                                <i class="fa fa-plus"></i>
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </td>

                            <td class="align-middle font-weight-bold" th:text="${#numbers.formatInteger(item.subtotal, 0, 'COMMA')} + '원'">0원</td>

                            <td class="align-middle">
                                <form th:action="@{/carts/delete/{id}(id=${item.book.bookId})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-sm btn-danger"><i class="fa fa-times"></i></button>
                                </form>
                            </td>
                        </tr>

                        <tr th:if="${cartItems == null or cartItems.empty}">
                            <td colspan="5" class="align-middle py-5 text-center">
                                <h5 class="m-0 text-muted">장바구니가 비어있습니다.</h5>
                                <a th:href="@{/books}" class="btn btn-sm btn-primary mt-3">쇼핑 계속하기</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="col-lg-4">
                <h5 class="section-title position-relative text-uppercase mb-3">
                    <span class="bg-secondary pr-3">결제 예상 금액</span>
                </h5>
                <div class="bg-light p-4 mb-5 shadow-sm"> <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="font-weight-bold m-0 text-dark">총 상품 금액</h5>
                    <h3 class="font-weight-bold m-0 text-primary"
                        th:text="${#numbers.formatInteger(cart.subTotal, 0, 'COMMA')} + '원'">
                        0원
                    </h3>
                </div>

                    <div class="alert alert-secondary p-2 mb-4 text-center small" role="alert">
                        <i class="fa fa-info-circle mr-1"></i>
                        배송비는 <strong>주문서 작성</strong> 단계에서<br>최종 결제 금액에 포함됩니다.
                    </div>

                    <div>
                        <a th:href="@{/checkout}"
                           class="btn btn-block btn-primary font-weight-bold py-3 mb-3"
                           style="font-size: 1.1rem;"
                           th:classappend="${cartItems == null or cartItems.empty} ? 'disabled' : ''">
                            주문서 작성하기
                        </a>

                        <form th:action="@{/carts/clear}" method="post" th:if="${cartItems != null and !cartItems.empty}">
                            <button type="submit" class="btn btn-block btn-outline-secondary font-weight-bold py-2">
                                장바구니 비우기
                            </button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
