<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<div layout:fragment="content">
    <div class="container mb-5" style="max-width: 550px;">
        <h2 class="section-title position-relative text-uppercase text-center mb-4">
            <span class="bg-secondary px-3">비밀번호 재설정</span>
        </h2>

        <div class="bg-light p-4 p-md-5 rounded shadow-sm">

            <div th:if="${error}" class="alert alert-danger mb-4" role="alert" th:text="${error}"></div>

            <form action="/members/password/reset" method="post" onsubmit="return validateResetForm()">

                <div class="form-group">
                    <label>이메일</label>
                    <div class="input-group">
                        <input type="email" name="memberEmail" id="memberEmail" class="form-control" placeholder="가입한 이메일 입력" required style="height: 50px;">
                        <div class="input-group-append">
                            <button class="btn btn-primary font-weight-bold" type="button" onclick="sendResetEmail()">인증번호 받기</button>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>인증번호</label>
                    <div class="input-group">
                        <input type="text" name="verificationCode" id="verificationCode" class="form-control" placeholder="인증번호 입력" required style="height: 50px;">
                        <div class="input-group-append">
                            <button class="btn btn-outline-primary font-weight-bold" type="button" onclick="verifyCode()">확인</button>
                        </div>
                    </div>
                    <small id="verifyMsg" class="mt-1 d-block"></small>
                </div>

                <div class="form-group">
                    <label>새 비밀번호</label>
                    <input type="password" name="newPassword" id="newPassword" class="form-control" placeholder="8자 이상 입력해주세요" required style="height: 50px;">
                </div>

                <button type="submit" class="btn btn-primary btn-block py-2 font-weight-bold mt-4" style="height: 50px;">비밀번호 변경하기</button>
            </form>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script>
        let isCodeSent = false;     // 이메일 발송 여부
        let isVerified = false;     // 인증 완료 여부

        // 이메일 발송
        function sendResetEmail() {
            const emailInput = document.getElementById('memberEmail');
            const emailVal = emailInput.value;

            if(!emailVal) {
                alert("이메일을 입력해주세요.");
                emailInput.focus();
                return;
            }

            fetch('/members/api/password/email', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ memberEmail: emailVal })
            })
                .then(async res => {
                    const msg = await res.text();
                    if(res.ok) {
                        alert(msg);
                        emailInput.readOnly = true;
                        document.getElementById('verificationCode').focus();
                        isCodeSent = true;
                    } else {
                        alert(msg);
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert("서버 통신 중 오류가 발생했습니다.");
                });
        }

        // 인증번호 확인
        function verifyCode() {
            const memberEmail = document.getElementById('memberEmail').value;
            const verificationCode = document.getElementById('verificationCode').value;
            const msgBox = document.getElementById('verifyMsg');

            if (!memberEmail || !verificationCode) {
                alert("입력값을 확인해주세요.");
                return;
            }

            fetch('/members/api/email/verify', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({memberEmail, verificationCode})
            }).then(res => {
                if(res.ok) {
                    alert("인증 성공!");
                    msgBox.innerText = "인증 성공";
                    msgBox.className = "text-success font-weight-bold mt-1 d-block";
                    document.getElementById('verificationCode').readOnly = true;
                    isVerified = true; // 인증 완료 상태로 변경
                } else {
                    alert("인증 실패");
                    msgBox.innerText = "인증 실패";
                    msgBox.className = "text-danger font-weight-bold mt-1 d-block";
                    isVerified = false;
                }
            }).catch(err => {
                console.error(err);
                alert("서버 연결 실패");
            });
        }

        // 폼 제출 전 유효성 검사
        function validateResetForm() {
            const pw = document.getElementById('newPassword').value;

            if (!isCodeSent) {
                alert("먼저 이메일 인증번호를 발송해주세요.");
                return false;
            }

            if (!isVerified) {
                alert("이메일 인증 확인이 필요합니다.");
                return false;
            }

            if (pw.length < 8) {
                alert("비밀번호는 8자 이상이어야 합니다.");
                document.getElementById('newPassword').focus();
                return false;
            }

            return true;
        }
    </script>
</th:block>
</html>
