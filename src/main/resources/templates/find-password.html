<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<div layout:fragment="content">

    <div class="container-fluid">
        <div class="row px-xl-5">
            <div class="col-12">
                <nav class="breadcrumb bg-light mb-30">
                    <a class="breadcrumb-item text-dark" href="/">Home</a>
                    <span class="breadcrumb-item active">비밀번호 찾기</span>
                </nav>
            </div>
        </div>
    </div>

    <div class="container mb-5" style="max-width: 550px;">

        <h2 class="section-title position-relative text-uppercase text-center mb-4">
            <span class="bg-secondary px-3">비밀번호 재설정</span>
        </h2>

        <div class="bg-light p-4 p-md-5 rounded shadow-sm">

            <div th:if="${error}" class="alert alert-danger mb-4" role="alert" th:text="${error}"></div>
            <div th:if="${message}" class="alert alert-success mb-4" role="alert" th:text="${message}"></div>

            <form action="/members/password/reset" method="post">

                <div class="form-group">
                    <label>이메일</label>
                    <div class="input-group">
                        <input type="email" name="memberEmail" id="memberEmail" class="form-control" placeholder="가입한 이메일 입력" required style="height: 50px;">
                        <div class="input-group-append">
                            <button class="btn btn-primary font-weight-bold" type="button" onclick="sendResetEmail()">인증번호 받기</button>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>인증번호</label>
                    <input type="text" name="verificationCode" id="verificationCode" class="form-control" placeholder="인증번호 입력" required style="height: 50px;">
                </div>

                <div class="form-group">
                    <label>새 비밀번호</label>
                    <input type="password" name="newPassword" class="form-control" placeholder="8자 이상 입력해주세요" required style="height: 50px;">
                </div>

                <button type="submit" class="btn btn-primary btn-block py-2 font-weight-bold mt-4" style="height: 50px;">비밀번호 변경하기</button>
            </form>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script>
        function sendResetEmail() {
            const emailInput = document.getElementById('memberEmail');
            const emailVal = emailInput.value;

            if(!emailVal) {
                alert("이메일을 입력해주세요.");
                emailInput.focus();
                return;
            }

            // AJAX 요청 (인증번호 발송)
            fetch('/members/emails/password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ memberEmail: emailVal })
            })
                .then(async res => {
                    const msg = await res.text();
                    if(res.ok) {
                        alert(msg);
                        emailInput.readOnly = true; // 성공 시 이메일 수정 방지
                        document.getElementById('verificationCode').focus();
                    } else {
                        alert(msg);
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert("서버 통신 중 오류가 발생했습니다.");
                });
        }
    </script>
</th:block>
</html>
