<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<head>
    <meta charset="utf-8">
    <title>Trillion-Shop | 주문 상세 정보</title>

    <th:block layout:fragment="head">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <meta content="주문, 상세, 내역" name="keywords">
        <meta content="온라인 도서 판매 사이트 주문 상세 정보" name="description">

        <style>
            .table-secondary {
                background-color: #f4f4f4;
            }
        </style>
    </th:block>
</head>

<body>

<div layout:fragment="content">

    <div class="container-fluid">
        <div class="row px-xl-5">
            <div class="col-12">
                <nav class="breadcrumb bg-light mb-30">
                    <a class="breadcrumb-item text-dark" th:href="@{/}">홈</a>
                    <a class="breadcrumb-item text-dark" th:if="${isMember}" th:href="@{/api/members/my-page}">마이페이지</a>
                    <a class="breadcrumb-item text-dark" th:if="${!isMember}" th:href="@{/orders/non-members-form}">비회원 주문 조회</a>
                    <span class="breadcrumb-item active">주문 상세 정보</span>
                </nav>
            </div>
        </div>
    </div>

    <div class="container-fluid pb-5">
        <div class="row px-xl-5">

            <div class="col-lg-8">

                <div class="card mb-4">
                    <div class="card-header bg-light">
                        <h5 class="m-0">주문 상품 목록</h5>
                    </div>

                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered text-center mb-0">
                                <thead class="bg-secondary text-dark">
                                <tr>
                                    <th>상품 정보</th>
                                    <th style="width: 15%;">단가</th>
                                    <th style="width: 10%;">수량</th>
                                    <th style="width: 15%;">포장비</th>
                                    <th style="width: 15%;">합계</th>
                                    <th style="width: 15%;" th:text="${isMember} ? '관리' : '상태'">관리</th>
                                </tr>
                                </thead>

                                <tbody class="align-middle">
                                <tr th:each="item : ${order.orderItems}"
                                    th:classappend="${#lists.contains({'CANCELED','RETURNED'}, item.orderItemStatus.name())} ? 'table-secondary' : ''">

                                    <td class="align-middle text-left">
                                        <div class="d-flex align-items-center">
                                            <img th:src="${!#strings.isEmpty(item.bookImage) ? '/trillion-bucket/' + item.bookImage : '/img/default-book.png'}"
                                                 alt="Book"
                                                 style="width: 50px; aspect-ratio: 1/1.4; object-fit: cover; margin-right: 15px;">
                                            <span th:text="${item.bookName}">책 제목</span>
                                        </div>
                                    </td>

                                    <td th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')} + '원'"></td>

                                    <td th:text="${item.quantity}"></td>

                                    <td th:text="${item.packagingPrice > 0 ?
                                                  #numbers.formatDecimal(item.packagingPrice, 0, 'COMMA', 0, 'POINT') + '원'
                                                  : '-'}"></td>

                                    <td th:text="${#numbers.formatDecimal((item.unitPrice * item.quantity) + item.packagingPrice,
                                                0, 'COMMA', 0, 'POINT') + '원'}"></td>

                                    <td th:if="${isMember}">
                                        <!-- 공통 상태 이름 출력 -->
                                        <span class="d-block font-weight-bold mb-2" th:text="${item.orderItemStatus.title}">상태</span>

                                        <!-- 버튼이 필요한 특수 상태들 -->
                                        <div th:if="${item.orderItemStatus.name() == 'SHIPPED'}">
                                            <button class="btn btn-sm btn-info w-100">배송 조회</button>
                                        </div>

                                        <div th:if="${item.orderItemStatus.name() == 'DELIVERED'}">
                                            <form th:action="@{/orders/{orderId}/items/{itemId}/confirm(orderId=${order.orderId}, itemId=${item.orderItemId})}"
                                                  method="post" class="mb-1">
                                                <button type="submit" class="btn btn-sm btn-primary w-100">구매 확정</button>
                                            </form>
                                            <button class="btn btn-sm btn-outline-danger w-100"
                                                    th:onclick="openReturnModal([[${order.orderId}]], [[${item.orderItemId}]], false)">
                                                반품하기
                                            </button>
                                        </div>

                                        <div th:if="${item.orderItemStatus.name() == 'CONFIRMED'}">
                                            <button class="btn btn-sm btn-success w-100">리뷰 작성</button>
                                        </div>
                                    </td>

                                    <td th:if="${!isMember}">
                                        <span class="d-block font-weight-bold mb-2" th:text="${item.orderItemStatus.title}">상태</span>
                                        <div th:if="${item.orderItemStatus.name() == 'DELIVERED'}">
                                            <button class="btn btn-sm btn-outline-danger w-100"
                                                    th:onclick="openReturnModal([[${order.orderId}]], [[${item.orderItemId}]], true, [[${order.orderNumber}]], [[${password}]])">
                                                반품하기
                                            </button>
                                        </div>
                                    </td>

                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header bg-light">
                        <h5 class="m-0">최종 결제 정보</h5>
                    </div>

                    <div class="card-body">
                        <!-- ... (기존 결제 정보 내용 유지) ... -->
                        <div class="border-bottom pt-3 pb-2">
                            <div class="d-flex justify-content-between mb-3">
                                <h6 class="text-dark">상품 금액</h6>
                                <h6 th:text="${#numbers.formatDecimal(order.originPrice,0,'COMMA',0,'POINT')} + '원'"></h6>
                            </div>

                            <div class="d-flex justify-content-between mb-3 text-danger"
                                 th:if="${order.totalCouponDiscount > 0}">
                                <h6 class="font-weight-medium">쿠폰 할인</h6>
                                <h6 class="font-weight-medium"
                                    th:text="'-' + ${#numbers.formatDecimal(order.totalCouponDiscount,0,'COMMA',0,'POINT')} + '원'"></h6>
                            </div>

                            <div class="d-flex justify-content-between mb-3 text-danger"
                                 th:if="${order.pointUsage > 0}">
                                <h6 class="font-weight-medium">포인트 사용</h6>
                                <h6 class="font-weight-medium"
                                    th:text="'-' + ${#numbers.formatDecimal(order.pointUsage,0,'COMMA',0,'POINT')} + '원'"></h6>
                            </div>

                            <div class="d-flex justify-content-between">
                                <h6 class="font-weight-medium text-dark">배송비</h6>
                                <h6 th:text="${#numbers.formatDecimal(order.deliveryFee,0,'COMMA',0,'POINT')} + '원'"></h6>
                            </div>
                        </div>

                        <div class="pt-2">
                            <div class="d-flex justify-content-between mt-2">
                                <h5>총 결제 금액</h5>
                                <h5 th:text="${#numbers.formatDecimal(order.totalPrice,0,'COMMA',0,'POINT')} + '원'"></h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ... (우측 주문 요약 정보 및 취소 버튼 영역 유지) ... -->
            <div class="col-lg-4">

                <div class="card mb-4">
                    <div class="card-header bg-light">
                        <h5 class="m-0">주문 요약 정보</h5>
                    </div>

                    <div class="card-body">

                        <div class="mb-4">
                            <h6 class="mb-3">주문 정보</h6>
                            <table class="table table-bordered table-sm text-dark">
                                <tbody>
                                <tr>
                                    <th class="bg-light w-25">주문번호</th>
                                    <td th:text="${order.orderNumber}"></td>
                                </tr>

                                <tr>
                                    <th class="bg-light w-25">주문일시</th>
                                    <td th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}"></td>
                                </tr>

                                <tr>
                                    <th class="bg-light w-25">주문상태</th>
                                    <td th:text="${order.orderStatus.title}">결제 완료</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                        <hr>

                        <div class="mb-4">
                            <h6 class="mb-3">주문자 정보</h6>
                            <table class="table table-bordered table-sm text-dark">
                                <tbody>
                                <tr>
                                    <th class="bg-light w-25">이름</th>
                                    <td th:text="${order.ordererInfo.ordererName()}"></td>
                                </tr>

                                <tr>
                                    <th class="bg-light w-25">연락처</th>
                                    <td th:text="${order.ordererInfo.ordererContact()}"></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                        <hr>

                        <div>
                            <h6 class="mb-3">받는 사람 정보</h6>
                            <table class="table table-bordered table-sm text-dark">
                                <tbody>
                                <tr>
                                    <th class="bg-light w-25">이름</th>
                                    <td th:text="${order.receiverInfo.receiverName()}"></td>
                                </tr>

                                <tr>
                                    <th class="bg-light w-25">연락처</th>
                                    <td th:text="${order.receiverInfo.receiverContact()}"></td>
                                </tr>

                                <tr>
                                    <th class="bg-light w-25">주소</th>
                                    <td th:text="${order.receiverInfo().receiverAddress()}">
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>

                <div th:if="${isMember and order.orderItems != null
                             and !#lists.isEmpty(order.orderItems)
                             and order.orderStatus.name() == 'COMPLETED'
                             and #lists.size(order.orderItems.?[orderItemStatus.name() != 'PREPARING']) == 0}"
                     class="mb-3">
                    <form th:action="@{/orders/{orderId}/cancel(orderId=${order.orderId})}"
                          method="post"
                          onsubmit="return confirm('정말 주문 전체를 취소하시겠습니까?');">
                        <button type="submit" class="btn btn-danger btn-block py-3 font-weight-bold">
                            주문 전체 취소
                        </button>
                    </form>
                </div>

                <div th:if="${!isMember and order.orderItems != null
                             and !#lists.isEmpty(order.orderItems)
                             and #lists.size(order.orderItems.?[orderItemStatus.name() != 'PREPARING']) == 0}"
                     class="mb-3">
                    <form th:action="@{/orders/non-members/{orderId}/cancel(orderId=${order.orderId})}"
                          method="post"
                          onsubmit="return confirm('정말 주문 전체를 취소하시겠습니까?');">
                        <input type="hidden" name="password" th:value="${password}">
                        <button type="submit" class="btn btn-danger btn-block py-3 font-weight-bold">
                            주문 전체 취소
                        </button>
                    </form>
                </div>

                <a th:href="${isMember} ? @{/my-page/orders} : @{/orders/non-members-order-form}"
                   class="btn btn-primary btn-block py-3 font-weight-bold">목록으로</a>

            </div>
        </div>
    </div>

    <!-- 반품 사유 선택 모달 -->
    <div class="modal fade" id="returnModal" tabindex="-1" role="dialog" aria-labelledby="returnModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="returnModalLabel">반품 사유 선택</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <form id="returnForm" method="post">
                    <div class="modal-body">
                        <p>반품 사유를 선택해주세요.</p>
                        <!-- 비회원용 필드 (동적으로 추가/제거 또는 hidden으로 유지) -->
                        <div id="nonMemberFields"></div>

                        <div class="form-group">
                            <select class="form-control" name="reason" required>
                                <option value="CHANGE_OF_MIND">단순 변심</option>
                                <option value="DAMAGED">상품 파손</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-danger">반품 신청</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>

<th:block layout:fragment="script">
    <script>
        function openReturnModal(orderId, itemId, isNonMember, orderNumber, password) {
            var form = document.getElementById('returnForm');
            var nonMemberDiv = document.getElementById('nonMemberFields');
            nonMemberDiv.innerHTML = ''; // 초기화

            if (isNonMember) {
                // 비회원 경로
                form.action = '/orders/non-members/' + orderId + '/items/' + itemId + '/return';

                // 비회원 인증 정보 추가
                var inputOrdNum = document.createElement('input');
                inputOrdNum.type = 'hidden';
                inputOrdNum.name = 'orderNumber';
                inputOrdNum.value = orderNumber;

                var inputPwd = document.createElement('input');
                inputPwd.type = 'hidden';
                inputPwd.name = 'password';
                inputPwd.value = password;

                nonMemberDiv.appendChild(inputOrdNum);
                nonMemberDiv.appendChild(inputPwd);
            } else {
                // 회원 경로
                form.action = '/orders/' + orderId + '/items/' + itemId + '/return';
            }

            $('#returnModal').modal('show');
        }
    </script>
</th:block>

</body>
</html>
