<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<div layout:fragment="content">

  <div class="container-fluid">
    <div class="row px-xl-5">
      <div class="col-12">
        <nav class="breadcrumb bg-light mb-30">
          <a class="breadcrumb-item text-dark" href="/">Home</a>
          <span class="breadcrumb-item active">추가 정보 입력</span>
        </nav>
      </div>
    </div>
  </div>

  <div class="container mb-5" style="max-width: 600px;"> <h2 class="section-title position-relative text-uppercase text-center mb-4">
    <span class="bg-secondary px-3">회원가입 마무리</span>
  </h2>

    <div class="bg-light p-4 p-md-5 rounded shadow-sm">
      <div class="text-center mb-4">
        <p class="text-muted">배송과 쿠폰 발급을 위해<br>나머지 정보를 입력해주세요.</p>
      </div>

      <form action="/members/social-signup" method="post" onsubmit="return validateForm()">

        <div class="form-group">
          <label>생년월일 <span class="text-danger">*</span></label>
          <input type="date" id="memberBirth" name="memberBirth" class="form-control" required style="height: 50px;">
          <small class="text-muted">생일 쿠폰 발급 기준이 되며, 가입 후 변경이 불가능할 수 있습니다.</small>
        </div>

        <div class="form-group">
          <label>연락처</label>
          <input type="text" name="memberContact" class="form-control" placeholder="010-0000-0000" style="height: 50px;">
        </div>

        <hr class="my-4">

        <h5 class="font-weight-bold mb-3">기본 배송지</h5>

        <div class="form-group">
          <label>우편번호</label>
          <div class="input-group">
            <input type="text" id="zipcode" name="memberAddress.addressPostCode" class="form-control" placeholder="우편번호" readonly onclick="execDaumPostcode()" style="height: 50px;">
            <div class="input-group-append">
              <button class="btn btn-primary font-weight-bold" type="button" onclick="execDaumPostcode()">주소 찾기</button>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>기본 주소</label>
          <input type="text" id="addressBase" name="memberAddress.addressBase" class="form-control" placeholder="주소 찾기를 이용해주세요" readonly style="height: 50px;">
        </div>

        <div class="form-group">
          <label>상세 주소</label>
          <input type="text" id="addressDetail" name="memberAddress.addressDetail" class="form-control" placeholder="상세 주소를 입력해주세요" style="height: 50px;">
        </div>

        <input type="hidden" name="memberAddress.addressAlias" value="우리집">

        <button type="submit" class="btn btn-primary btn-block py-2 font-weight-bold mt-4" style="height: 50px;">가입 완료</button>
      </form>

    </div>
  </div>
</div>

<th:block layout:fragment="script">
  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script>
    function validateForm() {
      // 생년월일 검증
      const birthInput = document.getElementById('memberBirth').value;
      if (!birthInput) return false;

      const memberBirth = new Date(birthInput);
      const today = new Date();
      const oneYearAgo = new Date();
      oneYearAgo.setFullYear(today.getFullYear() - 1);

      if (memberBirth > oneYearAgo) {
        alert("생년월일을 정확히 입력해주세요. (최근 1년 이내 날짜 선택 불가)");
        return false;
      }

      // 주소 입력 확인
      const zipcode = document.getElementById('zipcode').value;
      if (!zipcode) {
        alert("배송지 주소를 입력해주세요.");
        return false;
      }

      return true;
    }

    function execDaumPostcode() {
      new daum.Postcode({
        oncomplete: function(data) {
          var addr = data.userSelectedType === 'R' ? data.roadAddress : data.jibunAddress;
          if(data.userSelectedType === 'R'){
            var extraAddr = '';
            if(data.bname !== '' && /[동|로|가]$/g.test(data.bname)) extraAddr += data.bname;
            if(data.buildingName !== '' && data.apartment === 'Y') extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
            if(extraAddr !== '') addr += ' (' + extraAddr + ')';
          }
          document.getElementById('zipcode').value = data.zonecode;
          document.getElementById('addressBase').value = addr;
          document.getElementById('addressDetail').focus();
        }
      }).open();
    }
  </script>
</th:block>
</html>
