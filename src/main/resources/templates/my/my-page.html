<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<div layout:fragment="content">
    <!-- 브레드크럼 -->
    <div class="container-fluid">
        <div class="row px-xl-5">
            <div class="col-12">
                <nav class="breadcrumb bg-light mb-30">
                    <a class="breadcrumb-item text-dark" href="/">Home</a>
                    <span class="breadcrumb-item active">마이페이지</span>
                </nav>
            </div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row px-xl-5">
            <!-- 좌측 사이드바 -->
            <div class="col-lg-3 col-md-4 mb-5">
                <h5 class="section-title position-relative text-uppercase mb-3">
                    <span class="bg-secondary pr-3">MY 메뉴</span>
                </h5>
                <div class="bg-light p-30">
                    <div class="nav flex-column nav-pills mypage-menu" aria-orientation="vertical">
                        <a class="nav-link active mb-2" th:href="@{/members/my-page}">
                            <i class="fa fa-user-circle mr-2"></i>내 정보 / 배송지
                        </a>
                        <a class="nav-link text-dark mb-2" th:href="@{/my-page/orders}">
                            <i class="fa fa-shopping-bag mr-2"></i>주문/배송 조회
                        </a>
                        <a class="nav-link text-dark mb-2" th:href="@{/my-page/history}">
                            <i class="fa fa-undo mr-2"></i>취소/반품 내역
                        </a>
                        <a class="nav-link text-dark mb-2" th:href="@{/wishlists}">
                            <i class="fa fa-heart mr-2"></i>찜한 상품
                        </a>
                        <a class="nav-link text-dark" th:href="@{/members/reviews}">
                            <i class="fa fa-edit mr-2"></i>내 리뷰
                        </a>
                    </div>
                </div>
            </div>

            <!-- 우측 컨텐츠 영역 -->
            <div class="col-lg-9 col-md-8">
                
                <!-- 1. 내 정보 섹션 -->
                <h2 class="section-title position-relative text-uppercase mb-4">
                    <span class="bg-secondary pr-3">내 정보</span>
                </h2>
                <div class="bg-light p-30 mb-5">
                    <div class="row align-items-center">
                        <div class="col-md-6">
                            <p class="mb-2"><strong class="mr-2">이름:</strong> <span th:text="${member.memberName}"></span></p>
                            <p class="mb-2"><strong class="mr-2">등급:</strong>
                                <span class="badge badge-primary" th:text="${member.gradeName}"></span>
                            </p>
                            <p class="mb-2"><strong class="mr-2">이메일:</strong> <span th:text="${member.memberEmail}"></span></p>
                            <p class="mb-0"><strong class="mr-2">포인트:</strong>
                                <span class="text-primary font-weight-bold" th:text="${member.memberPoint} + ' P'"></span>
                            </p>
                        </div>
                        <div class="col-md-6 text-md-right mt-3 mt-md-0">
                            <a href="/members/grades" class="btn btn-sm btn-info mr-2">등급 혜택 보기</a>
                            <form th:action="@{/members/withdraw}" method="post" class="d-inline" onsubmit="return confirm('정말 탈퇴하시겠습니까? 탈퇴 시 모든 정보가 삭제됩니다.');">
                                <button class="btn btn-sm btn-danger">회원 탈퇴</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- 2. 배송지 관리 섹션 -->
                <h2 class="section-title position-relative text-uppercase mb-4">
                    <span class="bg-secondary pr-3">배송지 관리</span>
                </h2>
                <div class="bg-light p-30 mb-5">
                    <div class="table-responsive">
                        <table class="table table-hover text-center mb-0">
                            <thead class="thead-dark">
                            <tr>
                                <th>별칭</th>
                                <th>주소</th>
                                <th>관리</th>
                            </tr>
                            </thead>
                            <tbody class="align-middle">
                            <tr th:each="addr : ${addresses}">
                                <td class="align-middle font-weight-bold" th:text="${addr.addressAlias}">우리집</td>
                                <td class="align-middle" th:text="'(' + ${addr.addressPostCode} + ') ' + ${addr.addressBase} + ' ' + ${addr.addressDetail}">
                                    (12345) 서울시 강남구 테헤란로 123
                                </td>
                                <td class="align-middle">
                                    <button class="btn btn-sm btn-primary"
                                            type="button"
                                            data-toggle="modal"
                                            th:data-target="'#editModal-' + ${addr.addressId}">
                                        <i class="fa fa-edit"></i> 수정
                                    </button>

                                    <form th:action="@{'/members/addresses/' + ${addr.addressId} + '/delete'}" method="post" class="d-inline" onsubmit="return confirm('삭제하시겠습니까?');">
                                        <button class="btn btn-sm btn-danger"><i class="fa fa-times"></i> 삭제</button>
                                    </form>

                                    <!-- 수정 모달 -->
                                    <div class="modal fade" th:id="'editModal-' + ${addr.addressId}" tabindex="-1" role="dialog" aria-hidden="true">
                                        <div class="modal-dialog modal-dialog-centered" role="document">
                                            <div class="modal-content">
                                                <div class="modal-header bg-primary text-dark">
                                                    <h5 class="modal-title font-weight-bold">주소 수정</h5>
                                                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                                        <span aria-hidden="true">&times;</span>
                                                    </button>
                                                </div>
                                                <form th:action="@{'/members/addresses/' + ${addr.addressId} + '/update'}" method="post">
                                                    <div class="modal-body text-left">
                                                        <div class="form-group">
                                                            <label>별칭</label>
                                                            <input type="text" name="addressAlias" class="form-control" th:value="${addr.addressAlias}" required>
                                                        </div>
                                                        <div class="form-group">
                                                            <label>우편번호</label>
                                                            <input type="text" name="addressPostCode" class="form-control" th:value="${addr.addressPostCode}" readonly required>
                                                        </div>
                                                        <div class="form-group">
                                                            <label>기본 주소</label>
                                                            <input type="text" name="addressBase" class="form-control" th:value="${addr.addressBase}" readonly required>
                                                        </div>
                                                        <div class="form-group">
                                                            <label>상세 주소</label>
                                                            <input type="text" name="addressDetail" class="form-control" th:value="${addr.addressDetail}" required>
                                                        </div>
                                                    </div>
                                                    <div class="modal-footer">
                                                        <button type="button" class="btn btn-secondary" data-dismiss="modal">취소</button>
                                                        <button type="submit" class="btn btn-primary">수정 완료</button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(addresses)}">
                                <td colspan="3" class="py-4">등록된 배송지가 없습니다.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 3. 새 주소 추가 섹션 -->
                <h2 class="section-title position-relative text-uppercase mb-4">
                    <span class="bg-secondary pr-3">새 주소 추가</span>
                </h2>
                <div class="bg-light p-30 mb-5">
                    <form th:action="@{/members/addresses}" method="post" th:object="${addressRequest}">
                        <div class="row">
                            <div class="col-md-2 form-group">
                                <input type="text" class="form-control" th:field="*{addressAlias}" placeholder="별칭" required>
                            </div>
                            <div class="col-md-3 form-group">
                                <div class="input-group">
                                    <input type="text" class="form-control" id="newZipcode" th:field="*{addressPostCode}" placeholder="우편번호" readonly required onclick="execDaumPostcode()">
                                    <div class="input-group-append">
                                        <button type="button" class="btn btn-primary" onclick="execDaumPostcode()">찾기</button>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4 form-group">
                                <input type="text" class="form-control" id="newAddressBase" th:field="*{addressBase}" placeholder="기본 주소" readonly required>
                            </div>
                            <div class="col-md-3 form-group">
                                <input type="text" class="form-control" id="newAddressDetail" th:field="*{addressDetail}" placeholder="상세 주소" required>
                            </div>
                            <div class="col-md-12 text-right">
                                <button type="submit" class="btn btn-success py-2 px-4">주소 추가하기</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script>
        function execDaumPostcode() {
            new daum.Postcode({
                oncomplete: function(data) {
                    var addr = '';
                    var extraAddr = '';

                    if (data.userSelectedType === 'R') {
                        addr = data.roadAddress;
                    } else {
                        addr = data.jibunAddress;
                    }

                    if(data.userSelectedType === 'R'){
                        if(data.bname !== '' && /[동|로|가]$/g.test(data.bname)){
                            extraAddr += data.bname;
                        }
                        if(data.buildingName !== '' && data.apartment === 'Y'){
                            extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                        }
                        if(extraAddr !== ''){
                            addr += ' (' + extraAddr + ')';
                        }
                    }

                    document.getElementById('newZipcode').value = data.zonecode;
                    document.getElementById('newAddressBase').value = addr;
                    document.getElementById('newAddressDetail').focus();
                }
            }).open();
        }
    </script>
</th:block>
</html>
