<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<div layout:fragment="content">
    <!-- 브레드크럼 (my-page.html 스타일 참고) -->
    <div class="container-fluid">
        <div class="row px-xl-5">
            <div class="col-12">
                <nav class="breadcrumb bg-light mb-30">
                    <a class="breadcrumb-item text-dark" href="/">Home</a>
                    <a class="breadcrumb-item text-dark" href="/members/my-page">마이페이지</a>
                    <span class="breadcrumb-item active">주문 내역</span>
                </nav>
            </div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row px-xl-5">
            <!-- 좌측 사이드바 (기존 my-orders.html 구조 유지하되 디자인 개선) -->
            <div class="col-lg-3 col-md-4 mb-5">
                <h5 class="section-title position-relative text-uppercase mb-3">
                    <span class="bg-secondary pr-3">MY 메뉴</span>
                </h5>
                <div class="bg-light p-30">
                    <div class="nav flex-column nav-pills mypage-menu" aria-orientation="vertical">
                        <a class="nav-link text-dark mb-2" th:href="@{/members/my-page}">
                            <i class="fa fa-user-circle mr-2"></i>내 정보 / 배송지
                        </a>
                        <a class="nav-link active mb-2" th:href="@{/my-page/orders}">
                            <i class="fa fa-shopping-bag mr-2"></i>주문/배송 조회
                        </a>
                        <a class="nav-link text-dark mb-2" th:href="@{/my-page/history}">
                            <i class="fa fa-undo mr-2"></i>취소/반품 내역
                        </a>
                        <a class="nav-link text-dark mb-2" th:href="@{/wishlists}">
                            <i class="fa fa-heart mr-2"></i>찜한 상품
                        </a>
                        <a class="nav-link text-dark" th:href="@{/members/reviews}">
                            <i class="fa fa-edit mr-2"></i>내 리뷰
                        </a>
                    </div>
                </div>
            </div>

            <!-- 우측 컨텐츠 영역 -->
            <div class="col-lg-9 col-md-8">
                <h2 class="section-title position-relative text-uppercase mb-4">
                    <span class="bg-secondary pr-3">주문 내역</span>
                </h2>

                <div class="bg-light p-30 mb-5">
                    <!-- 주문 내역이 있을 때 -->
                    <div th:if="${orders != null and !#lists.isEmpty(orders.content)}">
                        <div th:each="order : ${orders.content}" class="card border-0 mb-4 shadow-sm">
                            <div class="card-header bg-secondary border-0 d-flex justify-content-between align-items-center py-3">
                                <div>
                                    <span class="font-weight-bold mr-2 text-dark">주문일자:</span>
                                    <span class="text-dark" th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd')}">2025-12-25</span>
                                    <span class="mx-2 text-muted">|</span>
                                    <span class="font-weight-bold mr-2 text-dark">주문번호:</span>
                                    <span class="text-dark" th:text="${order.orderId}">ORD-001</span>
                                </div>
                                <a th:href="@{'/orders/' + ${order.orderId}}" class="btn btn-sm btn-primary">
                                    상세보기 <i class="fa fa-angle-right ml-1"></i>
                                </a>
                            </div>
                            <div class="card-body bg-white">
                                <div class="table-responsive">
                                    <table class="table table-borderless mb-0">
                                        <tbody>
                                        <tr th:each="item : ${order.orderItems}" class="border-bottom">
                                            <td style="width: 100px;">
                                                <img th:src="${item.bookImage != null ? '/trillion-bucket/' + item.bookImage : '/img/default-book.png'}"
                                                     alt="Product" class="img-fluid border" style="width: 80px; height: 100px; object-fit: cover;">
                                            </td>
                                            <td class="align-middle">
                                                <h6 class="mb-1" th:text="${item.bookName}">책 제목</h6>
                                                <small class="text-muted" th:text="${#numbers.formatInteger(item.unitPrice, 0, 'COMMA')} + '원 x ' + ${item.quantity} + '개'"></small>
                                            </td>
                                            <td class="align-middle text-center" style="width: 150px;">
                                                <span class="badge badge-info px-3 py-2" style="font-size: 0.9em;" th:text="${item.orderItemStatus.title}">배송준비중</span>
                                            </td>
                                            <td class="align-middle text-right" style="width: 150px;">
                                                <span class="font-weight-bold text-dark"
                                                      th:text="${#numbers.formatInteger(item.unitPrice * item.quantity, 0, 'COMMA')} + '원'">
                                                    15,000원
                                                </span>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <div class="text-right mt-3">
                                    <h5 class="mb-0">총 결제금액: <span class="text-primary font-weight-bold" th:text="${#numbers.formatInteger(order.totalPrice, 0, 'COMMA')} + '원'"></span></h5>
                                </div>
                            </div>
                        </div>

                        <!-- 페이지네이션 (필요시 활성화) -->
                        <div class="col-12" th:if="${orders.totalPages > 1}">
                            <nav>
                                <ul class="pagination justify-content-center">
                                    <!-- 페이지네이션 로직 구현 가능 -->
                                </ul>
                            </nav>
                        </div>
                    </div>

                    <!-- 주문 내역이 없을 때 -->
                    <div th:if="${orders == null or #lists.isEmpty(orders.content)}" class="text-center py-5">
                        <div class="mb-4">
                            <i class="fa fa-shopping-cart fa-4x text-muted"></i>
                        </div>
                        <h4 class="text-dark">주문 내역이 없습니다.</h4>
                        <p class="text-muted">다양한 상품을 구경해보세요!</p>
                        <a href="/" class="btn btn-primary px-4 py-2 mt-3">쇼핑하러 가기</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
