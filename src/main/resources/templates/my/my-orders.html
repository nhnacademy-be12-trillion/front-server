<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<head>
    <meta charset="utf-8">
    <title>Trillion-Shop | My Page - 주문/배송 조회</title>

    <th:block layout:fragment="head">
        <style>
            .mypage-menu .list-group-item {
                border-radius: 6px;
                margin-bottom: 6px;
            }
            .mypage-menu .list-group-item.active {
                font-weight: 600;
            }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">

    <div class="container-fluid">
        <div class="row px-xl-5">
            <!-- 왼쪽 MY 메뉴 -->
            <div class="col-lg-3 col-md-4">
                <h5 class="section-title position-relative text-uppercase mb-3">
                    <span class="bg-secondary pr-3">MY 메뉴</span>
                </h5>

                <div class="nav flex-column nav-pills mypage-menu" aria-orientation="vertical">
                    <!-- 회원 정보 관리 -->
                    <h6 class="text-dark mb-2">👤 회원 정보 관리</h6>
                    <a class="list-group-item list-group-item-action"
                       th:classappend="${activeTab == 'profile'} ? ' active'"
                       th:href="@{/my-page/profile}">
                        개인정보 수정
                    </a>
                    <a class="list-group-item list-group-item-action"
                       th:classappend="${activeTab == 'reviews'} ? ' active'"
                       th:href="@{/my-page/reviews}">
                        마이 리뷰
                    </a>
                    <a class="list-group-item list-group-item-action"
                       th:classappend="${activeTab == 'addresses'} ? ' active'"
                       th:href="@{/my-page/addresses}">
                        배송 주소록 관리
                    </a>
                    <hr class="my-3">

                    <!-- 주문 내역 -->
                    <h6 class="text-dark mb-2 mt-4">📦 주문 내역</h6>
                    <a class="list-group-item list-group-item-action"
                       th:classappend="${activeTab == 'orders'} ? ' active'"
                       th:href="@{/my-page/orders}">
                        주문/배송 조회
                    </a>
                    <a class="list-group-item list-group-item-action"
                       th:classappend="${activeTab == 'history'} ? ' active'"
                       th:href="@{/my-page/history}">
                        취소/반품 내역
                    </a>

                    <hr class="my-3">

                    <!-- 회원 탈퇴 -->
                    <a th:href="@{/my-page/withdraw}"
                       class="list-group-item list-group-item-action text-danger">
                        회원 탈퇴
                    </a>
                </div>
            </div>

            <!-- 오른쪽: 주문/배송 조회 콘텐츠 -->
            <div class="col-lg-9 col-md-8">
                <h5 class="section-title position-relative text-uppercase mb-3">
                    <span class="bg-secondary pr-3">주문/배송 조회</span>
                </h5>

                <div class="table-responsive mb-5">
                    <table class="table table-bordered text-center mb-0">
                        <thead class="bg-secondary text-dark">
                        <tr>
                            <th>주문 ID</th>
                            <th>주문 날짜</th>
                            <th>총 금액</th>
                            <th>주문 상태</th>
                            <th>상세 보기</th>
                        </tr>
                        </thead>
                        <tbody class="align-middle">
                        <tr th:each="order : ${responses.content}">
                            <td class="align-middle" th:text="${order.orderId}">1</td>
                            <td class="align-middle" th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}">2023-01-01 10:00</td>
                            <td class="align-middle" th:text="${#numbers.formatCurrency(order.totalPrice)}">₩100,000</td>
                            <td class="align-middle" th:text="${order.orderStatus.displayName}">결제 완료</td>
                            <td class="align-middle">
                                <a th:href="@{/my-page/orders/{orderId}(orderId=${order.orderId})}" class="btn btn-sm btn-primary">상세</a>
                            </td>
                        </tr>
                        <tr th:if="${responses.content.isEmpty()}">
                            <td colspan="5" class="align-middle">주문 내역이 없습니다.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <nav aria-label="Page navigation" th:if="${responses.totalPages > 1}" class="mt-4">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${responses.number == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/my-page/orders(page=${responses.number - 1}, size=${responses.size}, sort=${responses.sort.toString()})}" aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, responses.totalPages - 1)}" th:classappend="${i == responses.number} ? 'active'">
                            <a class="page-link" th:href="@{/my-page/orders(page=${i}, size=${responses.size}, sort=${responses.sort.toString()})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${responses.number == responses.totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/my-page/orders(page=${responses.number + 1}, size=${responses.size}, sort=${responses.sort.toString()})}" aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
</body>
</html>
