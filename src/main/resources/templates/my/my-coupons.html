<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<div layout:fragment="content">
    <style>
        /* 사이드바 활성화 스타일 [통일됨] */
        .mypage-menu .nav-link.active {
            background-color: #87CEEB; /* 하늘색 */
            color: #ffffff;            /* 텍스트 흰색 */
            font-weight: 700;
        }
        .mypage-menu .nav-link {
            border-radius: 5px;
            padding: 12px 20px;
        }
        .mypage-menu .nav-link:hover {
            background-color: #f1f3f5;
        }
    </style>

    <div class="container-fluid">
        <div class="row px-xl-5">
            <div class="col-12">
                <nav class="breadcrumb bg-light mb-30">
                    <a class="breadcrumb-item text-dark" href="/">Home</a>
                    <a class="breadcrumb-item text-dark" href="/members/my-page">마이페이지</a>
                    <span class="breadcrumb-item active">쿠폰 조회</span>
                </nav>
            </div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row px-xl-5">
            <div class="col-lg-3 col-md-4 mb-5">
                <h5 class="section-title position-relative text-uppercase mb-3">
                    <span class="bg-secondary pr-3">MY 메뉴</span>
                </h5>
                <div class="bg-light p-30 rounded shadow-sm border">
                    <div class="nav flex-column nav-pills mypage-menu" aria-orientation="vertical">
                        <a class="nav-link text-dark mb-2" th:href="@{/members/my-page}">
                            <i class="fa fa-user-circle mr-2"></i>내 정보 / 배송지
                        </a>
                        <a class="nav-link text-dark mb-2" th:href="@{/my-page/points}">
                            <i class="fas fa-coins mr-2"></i>포인트 내역
                        </a>
                        <a class="nav-link text-dark mb-2" th:href="@{/my-page/orders}">
                            <i class="fa fa-shopping-bag mr-2"></i>주문/배송 조회
                        </a>
                        <a class="nav-link text-dark mb-2" th:href="@{/my-page/history}">
                            <i class="fa fa-undo mr-2"></i>취소/반품 내역
                        </a>
                        <a class="nav-link text-dark mb-2" th:href="@{/wishlists}">
                            <i class="fa fa-heart mr-2"></i>찜한 상품
                        </a>
                        <a class="nav-link active mb-2" th:href="@{/my-coupons}">
                            <i class="fa fa-ticket mr-2"></i>쿠폰 조회
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-lg-9 col-md-8">
                <h2 class="section-title position-relative text-uppercase mb-4">
                    <span class="bg-secondary pr-3">쿠폰 발급내역</span>
                </h2>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="btn-group coupon-filter" role="group">
                        <a th:href="@{/my-coupons(status='unused')}"
                           class="btn btn-outline-primary"
                           th:classappend="${param.status == null || param.status[0] == 'unused'} ? 'active' : ''">
                            미사용 쿠폰
                        </a>
                        <a th:href="@{/my-coupons(status='used')}"
                           class="btn btn-outline-primary"
                           th:classappend="${param.status != null && param.status[0] == 'used'} ? 'active' : ''">
                            사용한 쿠폰
                        </a>
                    </div>
                </div>

                <div class="bg-light p-30 rounded shadow-sm border">
                    <!-- 쿠폰 목록이 비어있을 때 -->
                    <div th:if="${contents == null || contents.empty}" class="text-center py-5">
                        <p class="mb-0 text-muted">조회된 쿠폰 내역이 없습니다.</p>
                    </div>

                    <!-- 쿠폰 목록 테이블 -->
                    <div class="table-responsive" th:unless="${contents == null || contents.empty}">
                        <table class="table table-hover text-center mb-0">
                            <thead class="thead-light">
                            <tr>
                                <th>쿠폰이름</th>
                                <th>시작일</th>
                                <th>만료일</th>
                                <th>최소주문</th>
                                <th>혜택</th>
                                <th>종류</th>
                            </tr>
                            </thead>
                            <tbody class="align-middle">
                            <tr th:each="content : ${contents}">
                                <td class="align-middle font-weight-bold text-left" th:text="${content.name}">쿠폰이름</td>
                                <td class="align-middle small" th:text="${#temporals.format(content.issueStartDate, 'yyyy-MM-dd')}">2024-01-01</td>
                                <td class="align-middle small" th:text="${#temporals.format(content.issueEndDate, 'yyyy-MM-dd')}">2024-12-31</td>
                                <td class="align-middle" th:text="${content.minOrderPrice == null ? '-' : #numbers.formatInteger(content.minOrderPrice, 0, 'COMMA') + '원'}">10,000원</td>
                                <td class="align-middle text-primary font-weight-bold">
                                    <span th:if="${content.couponDiscountType == 'FIXED_AMOUNT'}"
                                          th:text="${#numbers.formatInteger(content.discountValue, 0, 'COMMA') + '원 할인'}"></span>
                                    <span th:if="${content.couponDiscountType == 'RATE'}">
                                        <span th:text="${content.discountValue + '% 할인'}"></span>
                                        <div th:if="${content.maxDiscountPrice != null}" class="small text-muted"
                                              th:text="'(최대 ' + ${#numbers.formatInteger(content.maxDiscountPrice, 0, 'COMMA')} + '원)'"></div>
                                    </span>
                                </td>
                                <td class="align-middle">
                                    <span class="badge badge-secondary" th:text="${content.couponDiscountType == 'FIXED_AMOUNT' ? '정액' : '정률'}">타입</span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- 페이지네이션 (필요하다면 추가, 현재는 데이터만 표시) -->
                </div>
            </div>
        </div>
    </div>
</div>
</html>
