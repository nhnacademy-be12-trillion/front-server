<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<head>
  <meta charset="UTF-8">
  <title>Trillion-Shop | 결제 완료</title>
</head>

<body>
<div layout:fragment="content">
  <div class="container-fluid pt-5 pb-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 text-center">

        <div class="mb-4">
          <i class="fa fa-check-circle text-success" style="font-size: 80px;"></i>
        </div>

        <h2 class="mb-3">결제가 정상적으로 완료되었습니다!</h2>
        <p class="mb-4 text-muted">주문하신 상품의 배송 준비가 곧 시작됩니다.</p>

        <div class="card border-0 shadow-sm mb-5 text-left" th:if="${payment != null}">
          <div class="card-body">
            <h5 class="card-title border-bottom pb-2">결제 상세 정보</h5>

            <div class="d-flex justify-content-between mb-2">
              <span class="font-weight-bold">주문 번호</span>
              <span th:text="${payment.orderNumber}"></span>
            </div>

            <div class="d-flex justify-content-between mb-2">
              <span class="font-weight-bold">결제 금액</span>
              <span class="text-primary font-weight-bold"
                    th:text="${payment.totalAmount != null ? #numbers.formatInteger(payment.totalAmount, 0, 'COMMA') : '0'} + '원'">
                            </span>
            </div>

            <div class="d-flex justify-content-between mb-2">
              <span class="font-weight-bold">결제 수단</span>
              <span th:text="${payment.provider}"></span>
            </div>

            <div class="d-flex justify-content-between">
              <span class="font-weight-bold">승인 일시</span>
              <span th:text="${payment.approvedAt}"></span>
            </div>
          </div>
        </div>

        <div th:unless="${payment != null}" class="alert alert-warning">
          결제는 완료되었으나 상세 정보를 불러오는 데 실패했습니다.<br>
          (마이페이지 주문 내역을 확인해주세요.)
        </div>

        <div>
          <a href="/" class="btn btn-primary px-4 py-2 mr-2">쇼핑 계속하기</a>
          <a href="/mypage/orders" class="btn btn-outline-dark px-4 py-2">주문 내역 보기</a>
        </div>

      </div>
    </div>
  </div>
</div>
</body>
</html>
