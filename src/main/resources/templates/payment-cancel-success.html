<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<head>
  <meta charset="UTF-8">
  <title>취소 완료</title>
</head>

<body>
<div layout:fragment="content">
  <div class="container pt-5 pb-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 text-center">

        <div class="mb-4">
          <i class="fa fa-check-circle text-primary" style="font-size: 80px;"></i>
        </div>

        <h2 class="mb-3">주문 취소가 완료되었습니다.</h2>
        <p class="mb-4 text-muted">결제 취소 및 환불 처리가 요청되었습니다.</p>

        <div class="card border-0 shadow-sm mb-5 text-left">
          <div class="card-body">
            <h5 class="card-title border-bottom pb-2">취소 상세 내역</h5>

            <div class="d-flex justify-content-between" th:if="${canceledAmount != null}">
              <span class="font-weight-bold">환불 예정 금액</span>
              <span class="text-danger font-weight-bold"
                    th:text="${#numbers.formatInteger(canceledAmount, 0, 'COMMA') + '원'}"></span>
            </div>
          </div>
        </div>

        <div>
          <a href="/" class="btn btn-dark px-5 py-2">홈으로</a>
        </div>

      </div>
    </div>
  </div>
</div>
</body>
</html>
