<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <title>Trillion-Shop | 관리자 페이지</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="관리자, 주문, 정책, 회원" name="keywords">
  <meta content="Trillion-Shop 관리자 시스템" name="description">

  <link th:href="@{/img/favicon.ico}" rel="icon">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
  <link th:href="@{/lib/animate/animate.min.css}" rel="stylesheet">
  <link th:href="@{/lib/owlcarousel/assets/owl.carousel.min.css}" rel="stylesheet">

  <link th:href="@{/css/style.min.css}" rel="stylesheet">

  <style>
    body { background-color: #f5f5f5; }
    .admin-container { padding-top: 50px; padding-bottom: 50px; }
    .nav-pills .nav-link { border-radius: 0.25rem; margin-bottom: 5px; background-color: #e9ecef; color: #3D464D; }
    .nav-pills .nav-link.active, .nav-pills .nav-link:hover { background-color: #5BADE9; color: #fff; }
    .policy-group { border: 1px solid #dee2e6; padding: 20px; margin-bottom: 30px; background-color: #fff; }
    .search-result-item { cursor: pointer; }
    .search-result-item:hover { background-color: #f8f9fa; }
  </style>
</head>

<body>
<div class="container-fluid admin-container">
  <h1 class="text-dark mb-4 text-center">Trillion-Shop 관리 시스템</h1>

  <div class="row px-xl-5">
    <div class="col-lg-3 col-md-4">
      <h5 class="section-title position-relative text-uppercase mb-4">
        <span class="bg-secondary pr-3">관리 메뉴</span>
      </h5>
      <div class="nav flex-column nav-pills" id="admin-tab" role="tablist" aria-orientation="vertical">
        <a class="nav-link active" id="orders-tab" data-toggle="pill" href="#orders-content" role="tab">최근 주문 관리 (200건)</a>
        <a class="nav-link" id="policy-tab" data-toggle="pill" href="#policy-content" role="tab">정책 설정</a>
        <a class="nav-link" id="member-tab" data-toggle="pill" href="#member-content" role="tab">회원 관리</a>
        <a class="nav-link" id="book-register-tab" data-toggle="pill" href="#book-register-content" role="tab">도서 등록</a>
      </div>
    </div>

    <div class="col-lg-9 col-md-8">
      <div class="tab-content" id="admin-tabContent">

        <div class="tab-pane fade show active" id="orders-content" role="tabpanel">
          <h4 class="mb-4 text-primary">최근 주문 조회 (기존 코드 유지)</h4>
        </div>

        <div class="tab-pane fade" id="policy-content" role="tabpanel">
          <h4 class="mb-4 text-primary">정책 설정 (기존 코드 유지)</h4>
        </div>

        <div class="tab-pane fade" id="member-content" role="tabpanel">
          <h4 class="mb-4 text-primary">회원 관리 (기존 코드 유지)</h4>
        </div>

        <div class="tab-pane fade" id="book-register-content" role="tabpanel">
          <h4 class="mb-4 text-primary">신규 도서 등록 (AI 지원)</h4>
          <div class="policy-group">

            <form th:action="@{/admin/books}" method="post" enctype="multipart/form-data">

              <div class="form-group row">
                <label class="col-sm-3 col-form-label">ISBN</label>
                <div class="col-sm-9">
                  <div class="input-group">
                    <input type="text" class="form-control" id="isbnInput" name="bookIsbn" placeholder="ISBN 13자리를 입력하세요" required>
                    <div class="input-group-append">
                      <button class="btn btn-info" type="button" id="btn-ai-search">
                        <i class="fas fa-magic"></i> AI 검색
                      </button>
                    </div>
                  </div>
                  <small class="text-muted">ISBN 입력 후 검색 버튼을 누르면 알라딘과 AI가 정보를 채워줍니다.</small>
                </div>
              </div>

              <div class="form-group row">
                <label class="col-sm-3 col-form-label">도서명</label>
                <div class="col-sm-9"><input type="text" class="form-control" name="bookName" required></div>
              </div>
              <div class="form-group row">
                <label class="col-sm-3 col-form-label">저자</label>
                <div class="col-sm-9"><input type="text" class="form-control" name="bookAuthor" required></div>
              </div>
              <div class="form-group row">
                <label class="col-sm-3 col-form-label">출판사</label>
                <div class="col-sm-9"><input type="text" class="form-control" name="bookPublisher" required></div>
              </div>
              <div class="form-group row">
                <label class="col-sm-3 col-form-label">출판일</label>
                <div class="col-sm-9"><input type="date" class="form-control" name="bookDate" required></div>
              </div>
              <div class="form-group row">
                <label class="col-sm-3 col-form-label">정가 (원)</label>
                <div class="col-sm-9"><input type="number" class="form-control" name="bookRegularPrice" required></div>
              </div>
              <div class="form-group row">
                <label class="col-sm-3 col-form-label">판매가 (원)</label>
                <div class="col-sm-9"><input type="number" class="form-control" name="bookSalePrice" required></div>
              </div>
              <div class="form-group row">
                <label class="col-sm-3 col-form-label">재고 수량</label>
                <div class="col-sm-9"><input type="number" class="form-control" name="bookStock" required></div>
              </div>

              <div class="form-group row">
                <label class="col-sm-3 col-form-label">카테고리</label>
                <div class="col-sm-9">
                  <div class="input-group">
                    <input type="number" class="form-control" name="categoryId" id="categoryIdInput" placeholder="ID" required readonly style="max-width: 100px;">
                    <input type="text" class="form-control" id="categoryNameDisplay" placeholder="검색하여 선택" readonly style="background-color: #fff;">
                    <div class="input-group-append">
                      <button class="btn btn-secondary" type="button" data-toggle="modal" data-target="#categorySearchModal">
                        <i class="fas fa-search"></i> 검색
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="form-group row">
                <label class="col-sm-3 col-form-label">도서 설명 (AI)</label>
                <div class="col-sm-9"><textarea class="form-control" name="bookDescription" rows="8"></textarea></div>
              </div>
              <div class="form-group row">
                <label class="col-sm-3 col-form-label">목차 (AI)</label>
                <div class="col-sm-9"><textarea class="form-control" name="bookIndex" rows="5"></textarea></div>
              </div>
              <div class="form-group row">
                <label class="col-sm-3 col-form-label">태그</label>
                <div class="col-sm-9"><input type="text" class="form-control" name="tags" placeholder="태그1, 태그2"></div>
              </div>

              <div class="form-group row">
                <label class="col-sm-3 col-form-label">도서 이미지</label>
                <div class="col-sm-9">
                  <input type="hidden" name="bookImage" id="hiddenBookImageUrl">
                  <input type="file" class="form-control-file mb-2" name="bookImageFile" onchange="previewFile(this)">
                  <div id="imagePreviewContainer" style="display: none;">
                    <p class="text-muted small mb-1">미리보기:</p>
                    <img id="imagePreview" src="" alt="미리보기" style="max-height: 200px; border: 1px solid #ddd; padding: 5px;">
                  </div>
                </div>
              </div>

              <div class="text-right">
                <button type="submit" class="btn btn-primary">도서 등록</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="categorySearchModal" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">카테고리 검색</h5>
        <button type="button" class="close" data-dismiss="modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="input-group mb-3">
          <input type="text" class="form-control" id="categoryKeyword" placeholder="검색어 (예: 소설)">
          <div class="input-group-append">
            <button class="btn btn-primary" type="button" id="btn-search-category">찾기</button>
          </div>
        </div>
        <div class="list-group" id="categoryResultList" style="max-height: 300px; overflow-y: auto;">
          <a href="#" class="list-group-item list-group-item-action text-center text-muted">검색어를 입력하세요.</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/lib/easing/easing.min.js}"></script>
<script th:src="@{/lib/owlcarousel/owl.carousel.min.js}"></script>
<script th:src="@{/js/main.js}"></script>

<script th:inline="javascript">
  $(function () {

    // 1. [핵심 수정] AI 검색 버튼 클릭 (타임리프 경로 사용)
    $('#btn-ai-search').on('click', function () {
      const isbn = $('#isbnInput').val().trim();
      if (!isbn) { alert("ISBN을 입력해주세요."); return; }

      const $btn = $(this);
      const originalText = $btn.html();
      $btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> 검색 중...');

      // [중요] /api/admin/books/... 대신 프론트 컨트롤러 /admin/books/... 호출
      const searchUrl = [[@{/admin/books/isbn/}]] + isbn;

      fetch(searchUrl)
              .then(response => {
                if (!response.ok) throw new Error("검색 결과가 없거나 서버 응답이 없습니다.");
                return response.json();
              })
              .then(data => {
                // 데이터 매핑
                $('input[name="bookName"]').val(data.bookName);
                $('input[name="bookAuthor"]').val(data.bookAuthor);
                $('input[name="bookPublisher"]').val(data.bookPublisher);
                $('input[name="bookDate"]').val(data.bookPublicationDate);
                $('input[name="bookRegularPrice"]').val(data.bookRegularPrice);
                $('input[name="bookSalePrice"]').val(data.bookSalePrice);
                $('textarea[name="bookDescription"]').val(data.bookDescription);
                $('textarea[name="bookIndex"]').val(data.bookIndex);
                $('input[name="tags"]').val(data.tags);

                if (data.categoryIdList && data.categoryIdList.length > 0) {
                  $('#categoryIdInput').val(data.categoryIdList[0]);
                  $('#categoryNameDisplay').val("추천 ID: " + data.categoryIdList[0]);
                }

                if (data.bookImage) {
                  $('#hiddenBookImageUrl').val(data.bookImage);
                  $('#imagePreview').attr('src', data.bookImage);
                  $('#imagePreviewContainer').show();
                }
                alert("성공적으로 불러왔습니다.");
              })
              .catch(error => {
                console.error(error);
                alert("오류 발생: " + error.message);
              })
              .finally(() => {
                $btn.prop('disabled', false).html(originalText);
              });
    });

    // 2. [핵심 수정] 카테고리 검색 (타임리프 경로 사용)
    $('#btn-search-category').on('click', function() {
      const keyword = $('#categoryKeyword').val().trim();
      if (!keyword) { alert("검색어를 입력하세요."); return; }

      const $list = $('#categoryResultList');
      $list.html('<div class="text-center p-3"><i class="fas fa-spinner fa-spin"></i> 검색 중...</div>');

      // [중요] /admin/categories/search 호출
      const categoryUrl = [[@{/admin/categories/search}]] + '?keyword=' + encodeURIComponent(keyword);

      fetch(categoryUrl)
              .then(res => res.json())
              .then(data => {
                $list.empty();
                if (!data || data.length === 0) {
                  $list.html('<div class="text-center p-3 text-muted">결과 없음</div>');
                  return;
                }
                data.forEach(cat => {
                  const item = $(`<a href="#" class="list-group-item list-group-item-action search-result-item">
                                    <span class="font-weight-bold">${cat.categoryName}</span>
                                    <small class="text-muted">(ID: ${cat.categoryId})</small>
                                  </a>`);
                  item.on('click', function(e) {
                    e.preventDefault();
                    $('#categoryIdInput').val(cat.categoryId);
                    $('#categoryNameDisplay').val(cat.categoryName);
                    $('#categorySearchModal').modal('hide');
                  });
                  $list.append(item);
                });
              })
              .catch(err => {
                $list.html('<div class="text-center p-3 text-danger">오류 발생</div>');
              });
    });

    // 엔터키 지원
    $('#categoryKeyword').on('keypress', function(e) {
      if (e.which == 13) $('#btn-search-category').click();
    });

    // 이미지 미리보기
    window.previewFile = function(input) {
      if (input.files && input.files[0]) {
        var reader = new FileReader();
        reader.onload = function(e) {
          $('#imagePreview').attr('src', e.target.result);
          $('#imagePreviewContainer').show();
          $('#hiddenBookImageUrl').val('');
        }
        reader.readAsDataURL(input.files[0]);
      }
    };
  });
</script>
</body>
</html>
