<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{base}"
      xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
  <title>Trillion-Shop | 리뷰 작성</title>
</head>
<body>
<div layout:fragment="content" class="container-fluid pt-5">
  <div class="row px-xl-5 justify-content-center">
    <div class="col-lg-8 bg-light p-30 border rounded">
      <h3 class="mb-4">리뷰 작성 (<span th:text="${book.bookName}">도서명</span>)</h3>

      <form th:action="@{/reviews/add}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="bookId" th:value="${book.bookId}">
        <input type="hidden" name="orderId" th:value="${orderId}" />

        <div class="form-group mb-4">
          <label class="font-weight-bold">별점</label>
          <select name="reviewRate" class="form-control" style="width: 150px;">
            <option value="5">⭐⭐⭐⭐⭐ </option>
            <option value="4">⭐⭐⭐⭐ </option>
            <option value="3">⭐⭐⭐ </option>
            <option value="2">⭐⭐ </option>
            <option value="1">⭐ </option>
          </select>
        </div>

        <div class="form-group mb-4">
          <label class="font-weight-bold">리뷰 내용</label>
          <textarea name="reviewContents" class="form-control" rows="8"
                    placeholder="도서에 대한 솔직한 평을 남겨주시면 포인트가 적립됩니다." required></textarea>
        </div>

        <div class="form-group mb-4">
          <label class="font-weight-bold">사진 첨부 (최대 5장)</label>
          <input type="file" name="images" class="form-control-file" multiple accept="image/*">
        </div>

        <div class="text-right">
          <button type="submit" class="btn btn-primary px-5 py-3">리뷰 등록 및 포인트 받기</button>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
