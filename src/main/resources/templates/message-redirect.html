<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>알림</title>
</head>
<body>
<script th:inline="javascript">
  /*<![CDATA[*/
  var message = [[${message}]];
  var redirectUrl = [[${redirectUrl}]];

  if (message) {
    alert(message);
  }
  if (redirectUrl) {
    location.href = redirectUrl;
  } else {
    history.back(); // url이 없으면 뒤로가기
  }
  /*]]>*/
</script>
</body>
</html>
