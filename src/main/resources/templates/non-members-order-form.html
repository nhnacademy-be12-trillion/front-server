<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<head>
    <meta charset="UTF-8">
    <title>비회원 주문 조회</title>
    <th:block layout:fragment="head">
        <style>
            .form-container { max-width: 600px; margin: 5rem auto; }
            .card-header { font-size: 1.5rem; font-weight: 500; }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">
    <div class="container form-container">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-light text-center border-0 pt-4">
                <h4>비회원 주문 조회</h4>
            </div>
            <div class="card-body p-4 p-md-5">
                <p class="text-center text-muted mb-4">주문 시 발급받은 주문번호와 비밀번호를 입력해주세요.</p>

                <div th:if="${errorMessage}" class="alert alert-danger text-center" role="alert">
                    <span th:text="${errorMessage}"></span>
                </div>

                <form th:action="@{/orders/non-members}" method="post">
                    <div class="form-group mb-3">
                        <label for="orderNumber">주문 번호</label>
                        <input type="text" class="form-control" id="orderNumber" name="orderNumber" placeholder="예: ORD-..." required>
                    </div>
                    <div class="form-group mb-4">
                        <label for="password">주문 비밀번호</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="주문 비밀번호" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block py-2">주문 조회</button>
                </form>

                <hr>
                <div class="text-center mt-4">
                    <a th:href="@{/auth/login}" class="small">로그인 페이지로 돌아가기</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
