<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<head>
    <meta charset="UTF-8">
    <title th:text="${book.bookName} + ' | Trillion-Shop'">도서 상세</title>

    <th:block layout:fragment="head">
        <style>
            .detail-img { width: 100%; max-height: 500px; object-fit: contain; background: #f8f9fa; }

            /* 리뷰 이미지 썸네일 스타일 */
            .review-img-thumb {
                width: 100px;
                height: 100px;
                object-fit: cover;
                border-radius: 5px;
                cursor: pointer;
                border: 1px solid #ddd;
                margin-right: 10px;
                margin-bottom: 10px;
                transition: 0.2s;
            }
            .review-img-thumb:hover {
                opacity: 0.8;
                border-color: #007bff;
            }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">

    <div class="container-fluid">
        <div class="row px-xl-5">
            <div class="col-12">
                <nav class="breadcrumb bg-light mb-30">
                    <a class="breadcrumb-item text-dark" href="/">Home</a>
                    <a class="breadcrumb-item text-dark" href="/api/books">Books</a>
                    <span class="breadcrumb-item active" th:text="${book.bookName}">책 제목</span>
                </nav>
            </div>
        </div>
    </div>

    <div class="container-fluid pb-5">
        <div class="row px-xl-5">

            <div class="col-lg-5 mb-30">
                <div class="carousel slide" data-ride="carousel">
                    <div class="carousel-inner bg-light">
                        <div class="carousel-item active">
                            <img class="detail-img"
                                 th:src="${book.bookImage != null ? '/trillion-bucket/' + book.bookImage : '/img/default-book.png'}"
                                 alt="Image">
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-7 h-auto mb-30">
                <div class="h-100 bg-light p-30">
                    <h3 th:text="${book.bookName}">도서 제목</h3>

                    <div class="d-flex mb-3">
                        <div class="text-primary mr-2">
                            <small class="fas fa-star" th:each="i : ${#numbers.sequence(1, 5)}"
                                   th:classappend="${book.bookReviewRate >= i} ? 'text-primary' : 'text-secondary'"></small>
                        </div>
                        <small class="pt-1" th:text="'(' + ${book.viewCount} + ' Views)'">(99 Views)</small>
                    </div>

                    <h5 class="font-weight-semi-bold mb-4">
                        <span th:text="${#numbers.formatInteger(book.bookSalePrice, 0, 'COMMA')} + '원'">12,000원</span>
                        <del class="text-muted ml-2" th:if="${book.bookSalePrice < book.bookRegularPrice}"
                             th:text="${#numbers.formatInteger(book.bookRegularPrice, 0, 'COMMA')} + '원'">15,000원</del>
                    </h5>

                    <p class="mb-4" th:text="${book.bookDescription}">도서 상세 설명</p>

                    <ul class="list-unstyled mb-4">
                        <li><strong>저자:</strong> <span th:text="${book.bookAuthor}">홍길동</span></li>
                        <li><strong>출판사:</strong> <span th:text="${book.bookPublisher}">출판사</span></li>
                        <li><strong>출판일:</strong> <span th:text="${book.bookPublicationDate}">2025-01-01</span></li>
                        <li><strong>ISBN:</strong> <span th:text="${book.isbn}">123456789</span></li>
                    </ul>

                    <div class="d-flex align-items-center mb-4 pt-2">
                        <div class="input-group quantity mr-3" style="width: 130px;">
                            <div class="input-group-btn">
                                <button class="btn btn-primary btn-minus"><i class="fa fa-minus"></i></button>
                            </div>
                            <input type="text" class="form-control bg-secondary border-0 text-center" id="cartQuantity" value="1">
                            <div class="input-group-btn">
                                <button class="btn btn-primary btn-plus"><i class="fa fa-plus"></i></button>
                            </div>
                        </div>
                        <button class="btn btn-primary px-3 mr-2" id="btn-add-cart" th:data-book-id="${book.bookId}">
                            <i class="fa fa-shopping-cart mr-1"></i> 장바구니
                        </button>
                        <button class="btn btn-dark px-3" onclick="alert('바로 구매 기능 구현 필요')">
                            <i class="fa fa-credit-card mr-1"></i> 바로구매
                        </button>
                    </div>

                    <div class="d-flex pt-2">
                        <strong class="text-dark mr-2">Share on:</strong>
                        <div class="d-inline-flex">
                            <a class="text-dark px-2" href=""><i class="fab fa-facebook-f"></i></a>
                            <a class="text-dark px-2" href=""><i class="fab fa-twitter"></i></a>
                            <a class="text-dark px-2" href=""><i class="fab fa-linkedin-in"></i></a>
                            <a class="text-dark px-2" href=""><i class="fab fa-pinterest"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row px-xl-5">
            <div class="col">
                <div class="bg-light p-30">
                    <div class="nav nav-tabs mb-4">
                        <a class="nav-item nav-link active" data-toggle="tab" href="#tab-pane-1">상세 설명</a>
                        <a class="nav-item nav-link" data-toggle="tab" href="#tab-pane-2">정보</a>
                        <a class="nav-item nav-link" data-toggle="tab" href="#tab-pane-3"
                           th:text="'리뷰 (' + (${reviews != null ? reviews.totalElements : 0}) + ')'">리뷰 (0)</a>
                    </div>
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="tab-pane-1">
                            <h4 class="mb-3">도서 소개</h4>
                            <p th:text="${book.bookDescription}">상세 내용</p>
                        </div>
                        <div class="tab-pane fade" id="tab-pane-2">
                            <h4 class="mb-3">목차</h4>
                            <p th:text="${book.bookIndex}">목차 내용이 없습니다.</p>
                        </div>

                        <div class="tab-pane fade" id="tab-pane-3">
                            <div class="row">
                                <div class="col-md-6">
                                    <h4 class="mb-4" th:text="${reviews != null ? reviews.totalElements + '개의 리뷰가 있습니다.' : '리뷰가 없습니다.'}"></h4>

                                    <div class="media mb-4" th:if="${reviews != null}" th:each="review : ${reviews.content}">
                                        <img src="/img/user.jpg" alt="Image" class="img-fluid mr-3 mt-1" style="width: 45px;">
                                        <div class="media-body">
                                            <h6 th:text="${review.writerName != null ? review.writerName : '익명'}">
                                                User Name<small> - <i th:text="${review.createdAt}">01 Jan 2025</i></small>
                                            </h6>

                                            <div class="text-primary mb-2">
                                                <i class="fas fa-star" th:each="i : ${#numbers.sequence(1, 5)}"
                                                   th:classappend="${review.reviewRate >= i} ? 'text-primary' : 'text-secondary'"></i>
                                            </div>

                                            <p th:text="${review.reviewContents}">리뷰 내용</p>

                                            <div th:if="${!#lists.isEmpty(review.imageUrls)}" class="d-flex flex-wrap mt-2">
                                                <div th:each="imgUrl : ${review.imageUrls}">
                                                    <img th:src="@{'/trillion-bucket/' + ${imgUrl}}"
                                                         class="review-img-thumb"
                                                         alt="리뷰 이미지"
                                                         onclick="window.open(this.src, '_blank')">
                                                </div>
                                            </div>

                                        </div>
                                    </div>

                                    <div th:if="${reviews == null or reviews.content.isEmpty()}">
                                        <p>작성된 리뷰가 없습니다.</p>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <h4 class="mb-4">리뷰 작성</h4>
                                    <small>상품을 구매하신 후 리뷰를 작성할 수 있습니다.</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script>
        $(document).ready(function () {
            // 수량 조절 버튼 로직
            $('.quantity button').on('click', function () {
                var button = $(this);
                var oldValue = button.parent().parent().find('input').val();
                var newVal;
                if (button.hasClass('btn-plus')) {
                    newVal = parseFloat(oldValue) + 1;
                } else {
                    if (oldValue > 1) {
                        newVal = parseFloat(oldValue) - 1;
                    } else {
                        newVal = 1;
                    }
                }
                button.parent().parent().find('input').val(newVal);
            });

            // 장바구니 담기 AJAX
            $('#btn-add-cart').on('click', function () {
                const bookId = $(this).data('book-id');
                const quantity = $('#cartQuantity').val();

                $.ajax({
                    url: '/carts/add',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        bookId: bookId,
                        cartQuantity: parseInt(quantity)
                    }),
                    success: function (res) {
                        alert('장바구니에 담겼습니다.');
                    },
                    error: function (xhr) {
                        if (xhr.status === 401) {
                            alert('로그인이 필요합니다.');
                            location.href = '/login';
                        } else {
                            alert('오류가 발생했습니다: ' + xhr.responseText);
                        }
                    }
                });
            });
        });
    </script>
</th:block>

</body>
</html>
