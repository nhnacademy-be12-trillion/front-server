<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<head>
    <meta charset="UTF-8">
    <title th:text="${book.bookName} + ' | Trillion-Shop'">도서 상세</title>

    <th:block layout:fragment="head">
        <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor-viewer.min.css" />

        <style>
            .detail-img { width: 100%; max-height: 500px; object-fit: contain; background: #f8f9fa; }

            .review-img-thumb {
                width: 100px;
                height: 100px;
                object-fit: cover;
                border-radius: 5px;
                cursor: pointer;
                border: 1px solid #ddd;
                transition: 0.2s;
            }
            .review-img-thumb:hover {
                opacity: 0.8;
                border-color: #007bff;
                transform: scale(1.05);
            }

            .review-img-bg {
                background-color: #f0f0f0;
                padding: 5px;
                border-radius: 5px;
                display: inline-block;
                margin-right: 10px;
                margin-bottom: 10px;
            }

            .star-rating .star-icon {
                font-size: 1.5rem;
                cursor: pointer;
                color: #FFD333;
                margin-right: 2px;
            }

            hr.my-4 {
                border-top: 1px solid #eaeaea;
            }

            .custom-breadcrumb {
                background-color: transparent !important;
                padding: 15px 0;
                margin-bottom: 0;
                font-size: 14px;
            }

            .custom-breadcrumb .breadcrumb-item + .breadcrumb-item::before {
                content: ">";
                color: #999;
                font-family: sans-serif;
            }

            .custom-breadcrumb .breadcrumb-item a {
                color: #666;
                text-decoration: none;
                transition: color 0.2s;
            }

            .custom-breadcrumb .breadcrumb-item a:hover {
                color: #333;
                text-decoration: underline;
            }

            .custom-breadcrumb .breadcrumb-item.active {
                color: #111;
                font-weight: 700;
            }

            .home-icon {
                font-size: 16px;
                color: #555;
            }

            /* TUI Viewer 내부 폰트 조정 */
            .toastui-editor-contents {
                font-size: 16px;
                font-family: inherit;
            }

            /* ===== 리뷰 요약 타이핑(추가) ===== */
            #reviewSummaryTyping {
                white-space: pre-wrap;
                line-height: 1.7;
            }
            .tw-cursor {
                display: inline-block;
                margin-left: 2px;
                animation: tw-blink 1s step-end infinite;
            }
            @keyframes tw-blink { 50% { opacity: 0; } }
            @media (prefers-reduced-motion: reduce) {
                .tw-cursor { animation: none; }
            }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">

    <div class="container-fluid bg-white">
        <div class="row px-xl-5">
            <div class="col-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb custom-breadcrumb">
                        <li class="breadcrumb-item">
                            <a href="/"><i class="fa fa-home home-icon"></i></a>
                        </li>
                        <th:block th:if="${book.categoryPath != null}" th:each="cat : ${book.categoryPath}">
                            <li class="breadcrumb-item">
                                <a th:href="@{/books(categoryId=${cat.categoryId})}"
                                   th:text="${cat.categoryName}">카테고리</a>
                            </li>
                        </th:block>
                    </ol>
                </nav>
            </div>
        </div>
    </div>

    <div class="container-fluid pb-5 pt-3">
        <div class="row px-xl-5">

            <div class="col-lg-5 mb-30">
                <div class="carousel slide" data-ride="carousel">
                    <div class="carousel-inner bg-light border">
                        <div class="carousel-item active">
                            <img class="detail-img"
                                 th:src="${book.bookImage != null ? '/trillion-bucket/' + book.bookImage : '/img/default-book.png'}"
                                 alt="Image">
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-7 h-auto mb-30">
                <div class="h-100 bg-white p-30">
                    <h3 th:text="${book.bookName}" style="letter-spacing: -1px; word-break: keep-all;">도서 제목</h3>

                    <div class="d-flex mb-3 align-items-center">
                        <div class="text-primary mr-2">
                            <small class="fas fa-star" th:each="i : ${#numbers.sequence(1, 5)}"
                                   th:classappend="${book.bookReviewRate >= i} ? 'text-primary' : 'text-secondary'"></small>
                        </div>
                        <small class="pt-1 text-muted" th:text="'(' + ${book.viewCount} + ' Views)'">(99 Views)</small>
                    </div>

                    <h5 class="font-weight-semi-bold mb-4">
                        <span class="text-danger font-weight-bold" style="font-size: 1.5rem;" th:text="${#numbers.formatInteger(book.bookSalePrice, 0, 'COMMA')} + '원'">12,000원</span>

                        <span class="text-muted ml-2" style="font-size: 1rem; text-decoration: line-through;"
                              th:if="${book.bookSalePrice < book.bookRegularPrice}"
                              th:text="${#numbers.formatInteger(book.bookRegularPrice, 0, 'COMMA')} + '원'">15,000원</span>

                        <span class="badge badge-danger ml-2" style="font-size: 0.9rem;"
                              th:if="${book.bookSalePrice < book.bookRegularPrice}"
                              th:text="${book.discountRate} + '%'">10%</span>

                        <span class="badge badge-dark ml-2" style="font-size: 0.9rem;"
                              th:if="${book.bookState.name() == 'SOLD_OUT'}">품절</span>

                        <span class="badge badge-dark ml-2"
                              style="font-size: 0.9rem; background-color: #000000; color: #ffffff; cursor: pointer; padding: 0.4em 0.6em;"
                              th:onclick="'issueCoupon(\'' + ${book.bookId} + '\', this)'">
                            쿠폰발급
                        </span>
                    </h5>

                    <hr class="my-4">

                    <ul class="list-unstyled mb-4 text-dark">
                        <li class="mb-2 row">
                            <strong class="col-3 col-md-2">저자</strong>
                            <span class="col-9 col-md-10" th:text="${book.bookAuthor}">홍길동</span>
                        </li>
                        <li class="mb-2 row">
                            <strong class="col-3 col-md-2">출판사</strong>
                            <span class="col-9 col-md-10" th:text="${book.bookPublisher}">출판사</span>
                        </li>
                        <li class="mb-2 row">
                            <strong class="col-3 col-md-2">출판일</strong>
                            <span class="col-9 col-md-10" th:text="${book.bookPublicationDate}">2025-01-01</span>
                        </li>
                        <li class="mb-2 row">
                            <strong class="col-3 col-md-2">ISBN</strong>
                            <span class="col-9 col-md-10" th:text="${book.isbn}">123456789</span>
                        </li>
                        <li class="mb-2 row">
                            <strong class="col-3 col-md-2">포장</strong>
                            <span class="col-9 col-md-10">
                                <span th:text="${book.bookPackaging ? '선물포장 가능' : '포장 불가'}"
                                      class="badge"
                                      th:classappend="${book.bookPackaging ? 'badge-primary' : 'badge-secondary'}">
                                    가능
                                </span>
                            </span>
                        </li>
                    </ul>

                    <hr class="my-4">

                    <div class="d-flex align-items-center mb-4 pt-2">
                        <div class="input-group quantity mr-3" style="width: 130px;">
                            <div class="input-group-btn">
                                <button class="btn btn-outline-secondary btn-minus"
                                        th:disabled="${book.bookState.name() == 'SOLD_OUT'}"><i class="fa fa-minus"></i></button>
                            </div>
                            <input type="text" class="form-control border-secondary text-center" id="cartQuantity" value="1"
                                   th:disabled="${book.bookState.name() == 'SOLD_OUT'}">
                            <div class="input-group-btn">
                                <button class="btn btn-outline-secondary btn-plus"
                                        th:disabled="${book.bookState.name() == 'SOLD_OUT'}"><i class="fa fa-plus"></i></button>
                            </div>
                        </div>

                        <button class="btn btn-primary px-4 py-2 mr-2 font-weight-bold"
                                id="btn-add-cart"
                                th:data-book-id="${book.bookId}"
                                th:disabled="${book.bookState.name() == 'SOLD_OUT'}">
                            <i class="fa fa-shopping-cart mr-1"></i> 장바구니
                        </button>

                        <form th:action="@{/checkout}" method="get" class="mr-2">
                            <input type="hidden" name="bookId" th:value="${book.bookId}" />
                            <input type="hidden" name="quantity" id="buyNowQuantity" value="1" />
                            <button type="submit" class="btn btn-dark px-3 py-2 font-weight-bold"
                                    th:disabled="${book.bookState.name() == 'SOLD_OUT'}">
                                <i class="fa fa-credit-card mr-1"></i> 바로 구매
                            </button>
                        </form>

                        <button class="btn btn-outline-danger px-3 py-2 font-weight-bold" id="btn-add-like" th:data-book-id="${book.bookId}" type="button">
                            <i class="mr-1" th:classappend="${isLiked} ? 'fas fa-heart' : 'far fa-heart'"></i> 찜하기
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row px-xl-5">
            <div class="col">
                <div class="bg-white p-30 border">
                    <div class="nav nav-tabs mb-4">
                        <a class="nav-item nav-link active" data-toggle="tab" href="#tab-pane-1">상세 설명</a>
                        <a class="nav-item nav-link" data-toggle="tab" href="#tab-pane-2">정보</a>
                        <a class="nav-item nav-link" data-toggle="tab" href="#tab-pane-3"
                           th:text="'리뷰 (' + (${reviews != null ? reviews.totalElements : 0}) + ')'">리뷰 (0)</a>
                    </div>
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="tab-pane-1">
                            <h4 class="mb-3 border-bottom pb-2">도서 소개</h4>

                            <div id="viewer"></div>

                            <textarea id="bookDescriptionContent" style="display:none;" th:text="${book.bookDescription}"></textarea>
                        </div>

                        <div class="tab-pane fade" id="tab-pane-2">
                            <h4 class="mb-3 border-bottom pb-2">목차</h4>
                            <p th:text="${book.bookIndex}" style="line-height: 1.8;">목차 내용이 없습니다.</p>
                        </div>

                        <div class="tab-pane fade" id="tab-pane-3">
                            <div class="row">
                                <div class="col-md-12">

                                    <!-- ===== AI 리뷰 요약(타이핑) 추가 ===== -->
                                    <div class="bg-light p-3 rounded mb-4"
                                         th:if="${reviewSummary != null && reviewSummary.reviewSummary() != null}">
                                        <div class="d-flex align-items-center mb-2">
                                            <i class="fa fa-robot text-primary mr-2"></i>
                                            <strong>AI 리뷰 요약</strong>
                                        </div>

                                        <!-- 타이핑 표시 영역 -->
                                        <div id="reviewSummaryTyping" class="text-dark"></div>

                                        <!-- 실제 요약 텍스트 보관(숨김) -->
                                        <textarea id="reviewSummaryContent" style="display:none;"
                                                  th:text="${reviewSummary.reviewSummary()}"></textarea>
                                    </div>
                                    <!-- ===== /AI 리뷰 요약(타이핑) ===== -->

                                    <h4 class="mb-4 border-bottom pb-2"
                                        th:text="${reviews != null ? reviews.totalElements + '개의 리뷰가 있습니다.' : '리뷰가 없습니다.'}">
                                    </h4>

                                    <div class="media mb-4 pb-4 border-bottom"
                                         th:if="${reviews != null}"
                                         th:each="review, reviewStat : ${reviews.content}">

                                        <div class="media-body">
                                            <div class="d-flex justify-content-between">
                                                <div class="d-flex align-items-center">
                                                    <h6 class="mb-0" th:text="${(currentMemberId != null && review.memberId != null && review.memberId == currentMemberId) ? currentMemberName : (review.userName != null ? review.userName : (review.writerName != null ? review.writerName : '익명'))}">
                                                        User Name
                                                    </h6>
                                                    <span th:if="${currentMemberId != null && review.memberId != null && review.memberId == currentMemberId}"
                                                          class="badge badge-info ml-2" style="font-size: 0.75rem;">내 리뷰</span>
                                                </div>

                                                <div class="text-right">
                                                    <small class="text-muted d-block"
                                                           th:text="${review.updatedAt != null ? review.updatedAt : review.createdAt}">
                                                        01 Jan 2025
                                                    </small>

                                                    <th:block th:if="${currentMemberId != null && review.memberId != null && review.memberId == currentMemberId}">
                                                        <button type="button" class="btn btn-sm btn-outline-secondary mt-1"
                                                                style="font-size: 0.8rem; padding: 2px 8px;"
                                                                th:onclick="openReviewEditModal([[${review.reviewId}]], [[${book.bookId}]], [[${review.reviewContents}]], [[${review.reviewRate}]])">
                                                            수정
                                                        </button>
                                                    </th:block>
                                                </div>
                                            </div>

                                            <div class="text-primary mb-2 mt-1">
                                                <i class="fas fa-star" th:each="i : ${#numbers.sequence(1, 5)}"
                                                   th:classappend="${review.reviewRate >= i} ? 'text-primary' : 'text-secondary'"></i>
                                            </div>

                                            <p th:text="${review.reviewContents}" class="text-dark mt-2 mb-3" style="line-height: 1.6;">리뷰 내용</p>

                                            <div th:if="${!#lists.isEmpty(review.imageUrls)}" class="d-flex flex-wrap mt-2">
                                                <div th:each="imgUrl, imgStat : ${review.imageUrls}" class="review-img-bg">
                                                    <img th:src="@{'/trillion-bucket/' + ${imgUrl}}"
                                                         class="review-img-thumb m-0"
                                                         alt="리뷰 이미지"
                                                         data-toggle="modal"
                                                         th:data-target="'#reviewModal-' + ${reviewStat.index}"
                                                         th:onclick="'$(\'#reviewCarousel-' + ${reviewStat.index} + '\').carousel(' + ${imgStat.index} + ')'">
                                                </div>
                                            </div>

                                            <div th:if="${!#lists.isEmpty(review.imageUrls)}"
                                                 class="modal fade"
                                                 th:id="'reviewModal-' + ${reviewStat.index}"
                                                 tabindex="-1" role="dialog" aria-hidden="true">
                                                <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
                                                    <div class="modal-content bg-transparent border-0">
                                                        <div class="modal-body p-0 position-relative">
                                                            <button type="button" class="close position-absolute text-white" data-dismiss="modal" aria-label="Close"
                                                                    style="top: -30px; right: 0; z-index: 1050; opacity: 1;">
                                                                <span aria-hidden="true">&times;</span>
                                                            </button>

                                                            <div th:id="'reviewCarousel-' + ${reviewStat.index}" class="carousel slide" data-ride="carousel" data-interval="false">
                                                                <div class="carousel-inner">
                                                                    <div th:each="modalImg, modalStat : ${review.imageUrls}"
                                                                         class="carousel-item"
                                                                         th:classappend="${modalStat.first} ? 'active'">
                                                                        <img th:src="@{'/trillion-bucket/' + ${modalImg}}"
                                                                             class="d-block w-100 rounded"
                                                                             style="max-height: 80vh; object-fit: contain;"
                                                                             alt="크게 보기">
                                                                    </div>
                                                                </div>

                                                                <th:block th:if="${#lists.size(review.imageUrls) > 1}">
                                                                    <a class="carousel-control-prev" th:href="'#reviewCarousel-' + ${reviewStat.index}" role="button" data-slide="prev">
                                                                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                                                        <span class="sr-only">Previous</span>
                                                                    </a>
                                                                    <a class="carousel-control-next" th:href="'#reviewCarousel-' + ${reviewStat.index}" role="button" data-slide="next">
                                                                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                                                        <span class="sr-only">Next</span>
                                                                    </a>
                                                                </th:block>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div th:if="${reviews == null or reviews.content.isEmpty()}">
                                        <p class="text-muted text-center py-5">아직 작성된 리뷰가 없습니다.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="reviewEditModal" tabindex="-1" role="dialog" aria-labelledby="reviewEditModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered" role="document">
                <div class="modal-content">
                    <form action="/reviews/update" method="post">
                        <div class="modal-header">
                            <h5 class="modal-title" id="reviewEditModalLabel">리뷰 수정</h5>
                            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" name="reviewId" id="editReviewId">
                            <input type="hidden" name="bookId" id="editBookId">

                            <div class="form-group">
                                <label>별점</label>
                                <div class="d-flex align-items-center">
                                    <div id="editStarDisplay" class="mr-3" style="cursor: pointer;">
                                        <i class="far fa-star text-warning" data-value="1" style="font-size: 1.5rem;"></i>
                                        <i class="far fa-star text-warning" data-value="2" style="font-size: 1.5rem;"></i>
                                        <i class="far fa-star text-warning" data-value="3" style="font-size: 1.5rem;"></i>
                                        <i class="far fa-star text-warning" data-value="4" style="font-size: 1.5rem;"></i>
                                        <i class="far fa-star text-warning" data-value="5" style="font-size: 1.5rem;"></i>
                                    </div>
                                    <input type="hidden" name="reviewRate" id="editReviewRate" required>
                                    <span id="editStarText" class="font-weight-bold ml-2">0점</span>
                                </div>
                                <small class="text-muted mt-1 d-block">사진은 수정할 수 없습니다.</small>
                            </div>

                            <div class="form-group">
                                <label for="editReviewContents">내용</label>
                                <textarea class="form-control" name="reviewContents" id="editReviewContents" rows="5" required></textarea>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-dismiss="modal">취소</button>
                            <button type="submit" class="btn btn-primary">수정 완료</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<input type="hidden" id="isLoggedIn" th:value="${#authorization.expression('isAuthenticated()')}" />

<th:block layout:fragment="script">
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-viewer.min.js"></script>

    <script>
        // [추가] 리뷰 수정 모달 열기 함수
        function openReviewEditModal(reviewId, bookId, contents, rate) {
            // 값 주입
            $('#editReviewId').val(reviewId);
            $('#editBookId').val(bookId);
            $('#editReviewContents').val(contents);

            // 별점 초기화
            setEditStar(rate);

            // 모달 표시
            $('#reviewEditModal').modal('show');
        }

        // [추가] 모달 내부 별점 UI 처리
        function setEditStar(rate) {
            $('#editReviewRate').val(rate);
            $('#editStarText').text(rate + '점');

            $('#editStarDisplay i').each(function(index) {
                // index는 0부터 시작하므로 +1 해서 비교
                if ((index + 1) <= rate) {
                    $(this).removeClass('far').addClass('fas'); // 채워진 별
                } else {
                    $(this).removeClass('fas').addClass('far'); // 빈 별
                }
            });
        }

        $(document).ready(function () {
            // [추가] 모달 내 별점 클릭 이벤트
            $('#editStarDisplay i').on('click', function() {
                var selectedRate = $(this).data('value');
                setEditStar(selectedRate);
            });

            // [기존] TUI Viewer 초기화
            const $contentArea = $('#bookDescriptionContent');
            if ($contentArea.length > 0) {
                const content = $contentArea.val();
                try {
                    const viewer = new toastui.Editor({
                        el: document.querySelector('#viewer'),
                        initialValue: content || ''
                    });
                } catch (e) {
                    console.error("Toast UI Viewer Init Error:", e);
                }
            }

            // 기존 기능: 수량 조절 버튼 이벤트
            $('.quantity button').off('click').on('click', function () {
                var button = $(this);
                var $input = button.parent().parent().find('input#cartQuantity');
                var oldValue = $input.val();
                var newVal;

                if (button.hasClass('btn-plus')) {
                    newVal = parseFloat(oldValue) + 1;
                } else {
                    if (oldValue > 1) {
                        newVal = parseFloat(oldValue) - 1;
                    } else {
                        newVal = 1;
                    }
                }

                $input.val(newVal);
                $('#buyNowQuantity').val(newVal);
            });

            // 장바구니 담기
            $('#btn-add-cart').off('click').on('click', function () {
                const bookId = $(this).data('book-id');
                const quantity = $('#cartQuantity').val();

                $.ajax({
                    url: '/carts/add',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        bookId: bookId,
                        cartQuantity: parseInt(quantity)
                    }),
                    success: function (res) {
                        if (typeof incrementCartBadge === 'function') incrementCartBadge();
                        else {
                            var $badge = $('#cart-badge');
                            if ($badge.length) $badge.text((parseInt($badge.text().trim()) || 0) + 1);
                        }
                        if (typeof updateCartBadge === 'function') updateCartBadge();

                        if(confirm('장바구니에 담겼습니다. 장바구니로 이동하시겠습니까?')) {
                            location.href = '/carts';
                        }
                    },
                    error: function (xhr) {
                        if (xhr.status === 401) {
                            alert('로그인이 필요합니다.');
                            location.href = '/login';
                        } else {
                            alert('오류가 발생했습니다: ' + xhr.responseText);
                        }
                    }
                });
            });

            // 찜하기
            $('#btn-add-like').off('click').on('click', function () {
                const $btn = $(this);
                const bookId = $btn.data('book-id');
                const $icon = $btn.find('i');
                const $wishBadge = $('#wishlist-badge');

                $.ajax({
                    url: '/wishlists/toggle?bookId=' + bookId,
                    method: 'GET',
                    success: function (res) {
                        let alertMsg = '';
                        let currentCount = parseInt($wishBadge.text().trim()) || 0;

                        if ($icon.hasClass('far')) {
                            alertMsg = '찜 목록에 추가되었습니다.';
                            $icon.removeClass('far').addClass('fas');
                            $wishBadge.text(currentCount + 1);
                        } else {
                            alertMsg = '찜 목록에서 삭제되었습니다.';
                            $icon.removeClass('fas').addClass('far');
                            $wishBadge.text(Math.max(0, currentCount - 1));
                        }
                        if (typeof updateWishlistBadge === 'function') updateWishlistBadge();
                        alert(alertMsg);
                    },
                    error: function (xhr) {
                        if (xhr.status === 401) {
                            if(confirm('로그인이 필요한 서비스입니다. 로그인 페이지로 이동하시겠습니까?')) {
                                location.href = '/login';
                            }
                        } else if (xhr.status === 409) {
                            alert('이미 처리된 요청이거나 오류가 발생했습니다.');
                        } else {
                            alert('오류가 발생했습니다.');
                        }
                    }
                });
            });

            // AI 리뷰 요약 타이핑
            function runTypewriter(targetEl, text, options = {}) {
                const speed = options.speed ?? 35;   // ms
                const chunk = options.chunk ?? 1;    // 1 = 한 글자씩
                const cursor = options.cursor ?? true;

                const chars = Array.from(text || '');
                let i = 0;

                let cursorSpan = null;
                if (cursor) {
                    cursorSpan = document.createElement('span');
                    cursorSpan.className = 'tw-cursor';
                    cursorSpan.textContent = '│';
                    targetEl.appendChild(cursorSpan);
                }

                function tick() {
                    if (i >= chars.length) {
                        if (cursorSpan) cursorSpan.remove();
                        return;
                    }

                    const next = chars.slice(i, i + chunk).join('');
                    i += chunk;

                    if (cursorSpan) {
                        cursorSpan.remove();
                        targetEl.appendChild(document.createTextNode(next));
                        targetEl.appendChild(cursorSpan);
                    } else {
                        targetEl.appendChild(document.createTextNode(next));
                    }

                    setTimeout(tick, speed);
                }

                tick();
            }

            // "리뷰" 탭을 열었을 때 1번만 실행
            $('a[data-toggle="tab"][href="#tab-pane-3"]').one('shown.bs.tab', function () {
                const $src = $('#reviewSummaryContent');
                const target = document.querySelector('#reviewSummaryTyping');

                if (!$src.length || !target) return;

                const summary = ($src.val() || '').trim();
                if (!summary) return;

                target.textContent = '';
                runTypewriter(target, summary, { speed: 35, chunk: 1, cursor: true });
            });
            // ===== /리뷰 요약 타이핑 효과 =====
        });

        // [수정됨] 쿠폰 발급 로직: 204(없음), 409(중복) 처리 추가
        function issueCoupon(bookId, btnElement) {
            fetch("/book-coupons", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                    // 필요시 CSRF 토큰 등을 추가해야 할 수 있습니다.
                },
                body:JSON.stringify({ bookId: bookId })
            })
                .then(response => {
                    // 204 No Content는 body가 없으므로 text() 호출 시 에러가 날 수 있음

                    if (response.status === 200) {
                        // [성공]
                        alert("쿠폰이 정상적으로 발급되었습니다.");
                        if (btnElement) {
                            btnElement.innerText = "발급완료";
                            btnElement.style.backgroundColor = "#6c757d";
                            btnElement.style.cursor = "default";
                            btnElement.onclick = null;
                        }
                    } else if (response.status === 204) {
                        // [실패] 쿠폰 없음 (204 No Content)
                        alert("쿠폰이 없거나 이미 쿠폰을 다운받으셨습니다.");
                    } else if (response.status === 409 || response.status === 400) {
                        // [실패] 중복 발급 등
                        alert("이미 발급받으신 쿠폰입니다.");
                        if (btnElement) {
                            btnElement.innerText = "발급완료";
                            btnElement.style.backgroundColor = "#6c757d";
                            btnElement.style.cursor = "default";
                            btnElement.onclick = null;
                        }
                    } else if (response.status === 401) {
                        if(confirm("로그인이 필요한 서비스입니다. 로그인 하시겠습니까?")) {
                            location.href = '/login';
                        }
                    } else {
                        console.error("Error Status:", response.status);
                        alert("문제가 발생했습니다. 잠시 후 다시 시도해주세요.");
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("서버와 통신 중 에러가 발생했습니다.");
                });
        }
    </script>
</th:block>
