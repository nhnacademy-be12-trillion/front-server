<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<head>
    <meta charset="UTF-8">
    <title>Trillion-Shop | 주문서 작성</title>

    <!-- base.html 에서 CSS, 기본 head 요소 포함됨 -->
    <th:block layout:fragment="head">
        <!-- 이 페이지 전용 추가 CSS가 필요하면 여기에 -->
    </th:block>
</head>

<body>
<div layout:fragment="content">

    <!-- 주문서 작성 시작 -->
    <div class="container-fluid">
        <div class="row px-xl-5">

            <!-- ===== 좌측: 배송 정보 입력 ===== -->
            <div class="col-lg-8">
                <h5 class="section-title position-relative text-uppercase mb-3">
                    <span class="bg-secondary pr-3">배송 정보</span>
                </h5>

                <div class="bg-light p-30 mb-5">
                    <form th:action="@{/orders}" method="post" th:object="${orderCreateRequest}">

                        <!-- 주문자 정보 -->
                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label>주문자 이름</label>
                                <input class="form-control" type="text" th:field="*{ordererName}">
                            </div>
                            <div class="col-md-6 form-group">
                                <label>주문자 연락처</label>
                                <input class="form-control" type="text" th:field="*{ordererContact}">
                            </div>
                        </div>

                        <!-- 수령인 정보 -->
                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label>수령인 이름</label>
                                <input class="form-control" type="text" th:field="*{receiverName}">
                            </div>
                            <div class="col-md-6 form-group">
                                <label>수령인 연락처</label>
                                <input class="form-control" type="text" th:field="*{receiverContact}">
                            </div>
                        </div>

                        <!-- 주소 -->
                        <div class="row">
                            <div class="col-md-12 form-group">
                                <label>우편번호</label>
                                <div class="d-flex">
                                    <input class="form-control" type="text" th:field="*{receiverPostCode}">
                                    <button type="button" class="btn btn-outline-primary ml-2">주소 검색</button>
                                </div>
                            </div>
                            <div class="col-md-12 form-group">
                                <label>주소</label>
                                <input class="form-control" type="text" name="address1" placeholder="주소">
                            </div>
                            <div class="col-md-12 form-group">
                                <label>상세주소</label>
                                <input class="form-control" type="text" name="address2" placeholder="상세주소">
                            </div>
                        </div>

                        <!-- 희망 배송일 -->
                        <div class="col-md-12 form-group">
                            <label>희망 배송일</label>
                            <input class="form-control" type="datetime-local" th:field="*{deliveryDate}">
                        </div>

                        <!-- 비회원일 경우만 노출 -->
                        <div class="col-md-12 form-group">
                            <label>비회원 주문 비밀번호</label>
                            <input class="form-control" type="password" th:field="*{nonMemberPassword}" placeholder="비회원 주문 조회 시 필요합니다.">
                        </div>

                        <!-- 포인트 및 쿠폰 -->
                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label>사용 포인트</label>
                                <input class="form-control" type="number" th:field="*{pointUsage}" min="0">
                            </div>
                            <div class="col-md-6 form-group">
                                <label>쿠폰 ID</label>
                                <input class="form-control" type="text" th:field="*{couponId}">
                            </div>
                        </div>

                        <!-- 결제 진행 버튼 -->
                        <button type="submit"
                                class="btn btn-block btn-primary font-weight-bold my-3 py-3">
                            결제하기
                        </button>
                    </form>
                </div>
            </div>

            <!-- ===== 우측: 주문 요약 및 상품 목록 ===== -->
            <div class="col-lg-4">
                <!-- 주문 상품 목록 -->
                <h5 class="section-title position-relative text-uppercase mb-3">
                    <span class="bg-secondary pr-3">주문 상품</span>
                </h5>
                <div class="bg-light p-30 mb-5">
                    <div class="border-bottom pb-2 mb-3">
                        <div th:each="item : ${items}" class="d-flex justify-content-between mb-2">
                            <div class="d-flex">
                                <img th:src="${item.thumbnailUrl()}" alt="" style="width: 40px; height: 40px; object-fit: cover; margin-right: 10px;">
                                <span th:text="${item.title()}" style="max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">상품명</span>
                            </div>
                            <span th:text="${item.quantity()} + '개'">1개</span>
                        </div>
                    </div>
                </div>

                <h5 class="section-title position-relative text-uppercase mb-3">
                    <span class="bg-secondary pr-3">결제 요약</span>
                </h5>

                <div class="bg-light p-30 mb-5">
                    <div class="border-bottom pb-2">

                        <!-- 상품 금액 -->
                        <div class="d-flex justify-content-between mb-3">
                            <h6>상품 금액</h6>
                            <h6 th:text="${#numbers.formatInteger(orderSummary?.subTotal, 0, 'COMMA')} + '원'">
                                72,000원
                            </h6>
                        </div>

                        <!-- 배송비 -->
                        <div class="d-flex justify-content-between">
                            <h6 class="font-weight-medium">배송비</h6>
                            <h6 class="font-weight-medium"
                                th:text="${orderSummary?.shippingFee > 0 ?
                                        #numbers.formatInteger(orderSummary?.shippingFee, 0, 'COMMA') + '원' : '무료'}">
                                3,000원
                            </h6>
                        </div>
                    </div>

                    <!-- 총 금액 -->
                    <div class="pt-2">
                        <div class="d-flex justify-content-between mt-2">
                            <h5>총 결제 금액</h5>
                            <h5 th:text="${#numbers.formatInteger(orderSummary?.totalPrice, 0, 'COMMA')} + '원'">
                                75,000원
                            </h5>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <!-- checkout 페이지 전용 JS 가 필요하면 여기에 -->
    <!-- <script th:src="@{/js/checkout.js}"></script> -->
</th:block>

</body>
</html>
