<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">
<head>
    <meta charset="UTF-8"/>
    <title>Trillion-Shop | 검색 결과</title>

    <th:block layout:fragment="head">
        <style>
            .search-header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0; }
            .search-form { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
            .search-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:14px; }
            .card { border:1px solid #e5e5e5; border-radius:10px; overflow:hidden; background:#fff; }
            .card-img { width:100%; aspect-ratio: 1/1.4; object-fit:cover; background:#f5f5f5; }
            .card-body { padding:10px 12px; }
            .title { font-weight:700; display:block; line-height:1.2; margin-bottom:6px; }
            .meta { font-size:12px; color:#666; margin-bottom:6px; }
            .tags { font-size:12px; color:#444; }
            .pager { display:flex; gap:6px; justify-content:center; margin-top:18px; flex-wrap:wrap; }
            .btn { padding:6px 10px; border:1px solid #ddd; border-radius:8px; background:#fff; text-decoration:none; color:#222; }
            .btn.active { font-weight:700; border-color:#222; }
            .btn.disabled { opacity:.4; pointer-events:none; }
            .brand { font-weight:800; font-size:18px; text-decoration:none; color:inherit; }
            .muted { color:#666; }
            input, select { padding:7px 10px; border:1px solid #ddd; border-radius:8px; }
            button { padding:7px 12px; border:1px solid #222; border-radius:8px; background:#222; color:#fff; }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content" class="container" style="max-width:1100px;">

    <!-- 상단 헤더 -->
    <div class="search-header">
        <a class="brand" th:href="@{/}">Trillion-Shop</a>

        <!-- 검색 폼 -->
        <form class="search-form" th:action="@{/search}" method="get">
            <input type="text" name="query" placeholder="검색어 입력"
                   th:value="${query}" />

            <select name="sort">
                <option value="RELEVANCE" th:selected="${sort == 'RELEVANCE'}">관련도</option>
                <option value="NEW" th:selected="${sort == 'NEW'}">최신</option>
                <option value="POPULARITY" th:selected="${sort == 'POPULARITY'}">인기</option>
                <option value="LOW_PRICE" th:selected="${sort == 'LOW_PRICE'}">낮은 가격</option>
                <option value="HIGH_PRICE" th:selected="${sort == 'HIGH_PRICE'}">높은 가격</option>
                <option value="RATING" th:selected="${sort == 'RATING'}">평점</option>
                <option value="REVIEW_COUNT" th:selected="${sort == 'REVIEW_COUNT'}">리뷰수</option>
            </select>

            <select name="size">
                <option value="10" th:selected="${size == 10}">10개</option>
                <option value="20" th:selected="${size == 20}">20개</option>
                <option value="50" th:selected="${size == 50}">50개</option>
            </select>

            <!-- 현재 검색 모드 유지(BM25/AI) -->
            <input type="hidden" name="mode"
                   th:value="${mode != null ? mode : 'bm25'}"/>

            <input type="hidden" name="page" value="0"/>
            <button type="submit">검색</button>
        </form>
    </div>

    <!-- 검색 요약 -->
    <p class="muted" style="margin: 6px 0 14px;">
        <b th:text="${query}">-</b> 검색 결과:
        <b th:text="${totalCount}">0</b>건

        <!-- 모드 & 시간 표시 -->
        <span th:if="${mode == 'ai'}"
              style="margin-left:8px; font-size:12px; color:#0056b3; font-weight:600;">
          (AI 검색
          <span th:if="${elapsedMs != null and elapsedMs > 0}"
                th:text="' · ' + ${elapsedMs} + 'ms'"> · 0ms</span>
          )
        </span>

        <span th:if="${mode != 'ai'}"
              style="margin-left:8px; font-size:12px; font-size:12px;">
          (일반 검색)
        </span>
    </p>

    <!-- 결과 없음 -->
    <div th:if="${result == null or #lists.isEmpty(result)}" style="padding:40px 0; text-align:center;">
        <h3 style="margin:0 0 8px;">검색 결과가 없습니다.</h3>
        <p class="muted" style="margin:0;">다른 검색어로 다시 시도해 주세요.</p>
    </div>

    <!-- 카드형 결과 -->
    <div class="search-grid" th:if="${result != null and !#lists.isEmpty(result)}">
        <div class="card" th:each="b : ${result}">
            <a th:href="@{/books/{id}(id=${b.id})}">
                <img class="card-img"
                     th:src="${#strings.isEmpty(b.imageUrl) ?
                              '/img/default-book.png' :
                              '/trillion-bucket/' + b.imageUrl}"
                     alt="책 표지"/>

            </a>
            <div class="card-body">
                <a class="title"
                   th:href="@{/books/{id}(id=${b.id})}"
                   th:text="${b.title != null ? b.title : '제목 정보 없음'}">제목</a>

                <div class="meta">
                    <span th:text="${b.author != null ? b.author : '저자 정보 없음'}">저자</span>
                    <span> · </span>
                    <span th:text="${b.publisher != null ? b.publisher : '출판사 정보 없음'}">출판사</span>
                </div>

                <div class="meta" th:if="${b.price != null}">
                    <b th:text="${#numbers.formatInteger(b.price, 0, 'COMMA')} + '원'">0원</b>
                </div>

                <div class="tags" th:if="${b.tags != null and !#lists.isEmpty(b.tags)}">
                  <span th:each="t, it : ${b.tags}">
                    <span th:text="${t}">tag</span><span th:if="${!it.last}"> · </span>
                  </span>
                </div>

                <!-- AI 모드일 때만 추천 정보 (필드 있으면 자동 표시, 없으면 그냥 안 나옴) -->
                <div th:if="${mode == 'ai'}">
                    <div th:if="${b.recommended}"
                         style="display:inline-block; padding:2px 6px; border-radius:999px;
                                background:#eef3ff; color:#1a3cff; font-size:11px; font-weight:600;
                                margin-top:6px; margin-bottom:4px;">
                        AI 추천
                    </div>

                    <div class="meta"
                         th:if="${b.recommendationReason != null}"
                         th:text="${b.recommendationReason}">
                        추천 이유
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 페이징  -->
    <div th:if="${totalPages != null and totalPages > 1 and page != null}" class="pager">
        <a class="btn" th:classappend="${page.first} ? ' disabled' : ''"
           th:href="@{/search(query=${query}, sort=${sort}, size=${size}, mode=${mode}, page=${page.number - 1})}">이전</a>

        <a class="btn"
           th:each="p : ${#numbers.sequence(T(java.lang.Math).max(0, page.number - 2), T(java.lang.Math).min(totalPages - 1, page.number + 2))}"
           th:classappend="${p == page.number} ? ' active' : ''"
           th:href="@{/search(query=${query}, sort=${sort}, size=${size}, mode=${mode}, page=${p})}"
           th:text="${p + 1}">1</a>

        <a class="btn" th:classappend="${page.last} ? ' disabled' : ''"
           th:href="@{/search(query=${query}, sort=${sort}, size=${size}, mode=${mode}, page=${page.number + 1})}">다음</a>
    </div>

</div>
</body>
</html>
