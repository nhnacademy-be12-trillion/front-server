<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Search Result</title>
</head>
<body>
<h1>검색 결과</h1>

<p>
    query: <b th:text="${query}">-</b>
    / total: <b th:text="${totalCount}">0</b>
</p>

<ul th:if="${result != null and !#lists.isEmpty(result)}">
    <li th:each="b : ${result}">
        <span th:text="${b.title}">title</span>
        <small th:text="${b.author}">author</small>
    </li>
</ul>

<p th:if="${result == null or #lists.isEmpty(result)}">검색 결과 없음</p>

</body>
</html>
