<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<head>
    <meta charset="UTF-8">
    <title>Trillion-Shop | 도서 목록</title>

    <th:block layout:fragment="head">
    </th:block>
    <style>
        .book-thumb {
            display: block;
            width: 100%;
            height: 240px;
            object-fit: cover;
            background: #f3f3f3;
        }
        .product-img .book-thumb {
            height: 240px;
        }
        /* 페이지네이션 스타일 */
        .page-item.active .page-link {
            z-index: 1;
            color: #fff;
            background-color: #3D464D;
            border-color: #3D464D;
        }
        .page-link {
            color: #3D464D;
        }

        /* [수정] 품절(SOLD_OUT) 상태일 때 회색 톤 오버레이 스타일 */
        .sold-out-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(50, 50, 50, 0.7); /* 진한 회색 반투명 배경 */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            font-weight: bold;
            color: #ffffff; /* 흰색 글씨 */
            font-size: 1.2rem;
        }
        /* 품절된 상품 흐리게 처리 */
        .sold-out-item .book-thumb {
            opacity: 0.5;
        }
    </style>
</head>

<body>
<div layout:fragment="content">

    <div class="container-fluid">
        <div class="row px-xl-5">

            <div class="col-lg-3 col-md-4">
                <h5 class="section-title position-relative text-uppercase mb-3">
                    <span class="bg-secondary pr-3"
                          th:text="${currentCategoryName == '총류' ? '기타' : (currentCategoryName != null ? currentCategoryName : '도서 메뉴')}">
                        도서 메뉴
                    </span>
                </h5>

                <div class="nav flex-column nav-pills book-menu" role="tablist">

                    <a class="nav-link font-weight-bold"
                       th:classappend="${currentCategoryId == null} ? 'active'"
                       th:href="@{/books}">
                        <i class="fa fa-list mr-1"></i> 전체 도서 목록
                    </a>

                    <th:block th:if="${currentCategoryId != null}">
                        <div class="my-2 border-top"></div>
                        <th:block th:if="${subCategories != null and !#lists.isEmpty(subCategories)}">
                            <div class="px-3 py-2 text-muted small">하위 카테고리 선택</div>
                            <a class="nav-link"
                               th:each="subCat : ${subCategories}"
                               th:href="@{/books(categoryId=${subCat.categoryId})}"
                               th:text="${subCat.categoryName == '총류' ? '기타' : subCat.categoryName}">
                                하위 카테고리명
                            </a>
                        </th:block>

                        <div th:if="${subCategories == null or #lists.isEmpty(subCategories)}"
                             class="alert alert-secondary mt-2 text-center p-3">
                            <p class="mb-2 small text-muted">
                                <i class="fa fa-info-circle"></i> 더 이상 하위 카테고리가 없습니다.
                            </p>
                            <a href="javascript:history.back()" class="btn btn-primary btn-sm btn-block text-white">
                                뒤로 가기
                            </a>
                        </div>
                    </th:block>

                </div>
            </div>

            <div class="col-lg-9 col-md-8">

                <h5 class="section-title position-relative text-uppercase mb-3">
                    <span class="bg-secondary pr-3">도서 목록</span>
                </h5>

                <div class="row">
                    <div class="col-lg-3 col-md-4 col-sm-6 pb-1"
                         th:each="book : ${books}"
                         th:unless="${book.bookState.name() == 'SALE_END'}">

                        <div class="product-item bg-light mb-4" th:classappend="${book.bookState.name() == 'SOLD_OUT'} ? 'sold-out-item' : ''">
                            <div class="product-img position-relative overflow-hidden">

                                <div th:if="${book.bookState.name() == 'SOLD_OUT'}" class="sold-out-overlay">재고 소진</div>

                                <img class="img-fluid w-100 book-thumb"
                                     th:src="${!#strings.isEmpty(book.bookImage) ? '/trillion-bucket/' + book.bookImage : 'https://dummyimage.com/220x330/ced4da/6c757d.jpg&text=No+Image'}"
                                     onerror="this.onerror=null; this.src='https://dummyimage.com/220x330/ced4da/6c757d.jpg&text=No+Image';"
                                     loading="lazy"
                                     alt="도서 이미지">

                                <div class="product-action">
                                    <a class="btn btn-outline-dark btn-square"
                                       href="javascript:void(0);"
                                       th:onclick="${book.bookState.name() == 'SOLD_OUT'} ? 'alert(\'재고가 소진된 도서입니다.\');' : 'addToCart(' + ${book.bookId} + ')'">
                                        <i class="fa fa-shopping-cart"></i>
                                    </a>
                                    <a class="btn btn-outline-dark btn-square"
                                       href="javascript:void(0);"
                                       th:onclick="${book.bookState.name() == 'SOLD_OUT'} ? 'alert(\'재고가 소진된 도서입니다.\');' : 'toggleWishlist(' + ${book.bookId} + ')'">
                                        <i class="far fa-heart"></i>
                                    </a>
                                    <a class="btn btn-outline-dark btn-square"
                                       th:href="${book.bookState.name() == 'SOLD_OUT'} ? 'javascript:void(0)' : @{/books/{id}(id=${book.bookId})}"
                                       th:onclick="${book.bookState.name() == 'SOLD_OUT'} ? 'alert(\'재고가 소진된 도서입니다.\'); return false;' : ''">
                                        <i class="fa fa-search"></i>
                                    </a>
                                </div>
                            </div>

                            <div class="text-center py-4 px-2">
                                <a class="h6 text-decoration-none text-truncate d-block mb-1"
                                   th:href="${book.bookState.name() == 'SOLD_OUT'} ? 'javascript:void(0)' : @{/books/{id}(id=${book.bookId})}"
                                   th:onclick="${book.bookState.name() == 'SOLD_OUT'} ? 'alert(\'재고가 소진된 도서입니다.\'); return false;' : ''"
                                   th:text="${book.bookName}">책 제목</a>

                                <div class="small text-muted mb-2">
                                    <span th:text="${book.bookAuthor == null ? '저자 미상' : (#strings.length(book.bookAuthor) > 10 ? #strings.substring(book.bookAuthor, 0, 10) + '...' : book.bookAuthor)}">저자명</span>
                                </div>

                                <div class="mt-2" style="text-align: center;">
                                    <div th:if="${book.bookSalePrice > 0}">
                                        <h6 class="text-muted mb-1" th:if="${book.bookSalePrice < book.bookRegularPrice}">
                                            <del th:text="${#numbers.formatInteger(book.bookRegularPrice, 0, 'COMMA')} + '원'">15,000원</del>
                                        </h6>
                                        <div class="d-flex align-items-center justify-content-center">
                                            <h5 class="text-primary mb-0" th:text="${#numbers.formatInteger(book.bookSalePrice, 0, 'COMMA')} + '원'">12,000원</h5>
                                            <span class="badge badge-danger ml-2" th:if="${book.bookSalePrice < book.bookRegularPrice}" th:text="${book.discountRate} + '%'">10%</span>
                                        </div>
                                    </div>

                                    <div th:if="${book.bookSalePrice == 0}">
                                        <h5 class="text-primary mb-0" th:text="${#numbers.formatInteger(book.bookRegularPrice, 0, 'COMMA')} + '원'">15,000원</h5>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12"
                         th:if="${books == null or #lists.isEmpty(books)}">
                        <div class="bg-light text-center py-5">
                            <h5 class="text-muted mb-2">등록된 도서가 없습니다.</h5>
                            <a th:href="@{/books}" class="btn btn-primary btn-sm">전체 도서 보기</a>
                        </div>
                    </div>

                    <div class="col-12 mt-3" th:if="${page != null and page.totalPages > 0}">
                        <nav aria-label="Page navigation">
                            <ul class="pagination justify-content-center mb-3"
                                th:with="start=${(page.number / 5) * 5},
                                         end= ${(start + 4) < (page.totalPages - 1) ? (start + 4) : (page.totalPages - 1)}">

                                <li class="page-item" th:if="${start > 0}">
                                    <a class="page-link"
                                       th:href="@{/books(page=${start - 1}, categoryId=${currentCategoryId})}"
                                       aria-label="Previous Group">
                                        <span aria-hidden="true"><i class="fa fa-angle-double-left"></i></span>
                                    </a>
                                </li>

                                <li class="page-item" th:if="${!page.first}">
                                    <a class="page-link"
                                       th:href="@{/books(page=${page.number - 1}, categoryId=${currentCategoryId})}"
                                       aria-label="Previous">
                                        <span aria-hidden="true"><i class="fa fa-angle-left"></i></span>
                                    </a>
                                </li>

                                <li class="page-item"
                                    th:each="i : ${#numbers.sequence(start, end)}"
                                    th:classappend="${i == page.number} ? 'active'">
                                    <a class="page-link"
                                       th:text="${i + 1}"
                                       th:href="@{/books(page=${i}, categoryId=${currentCategoryId})}">1</a>
                                </li>

                                <li class="page-item" th:if="${!page.last}">
                                    <a class="page-link"
                                       th:href="@{/books(page=${page.number + 1}, categoryId=${currentCategoryId})}"
                                       aria-label="Next">
                                        <span aria-hidden="true"><i class="fa fa-angle-right"></i></span>
                                    </a>
                                </li>

                                <li class="page-item" th:if="${end < page.totalPages - 1}">
                                    <a class="page-link"
                                       th:href="@{/books(page=${end + 1}, categoryId=${currentCategoryId})}"
                                       aria-label="Next Group">
                                        <span aria-hidden="true"><i class="fa fa-angle-double-right"></i></span>
                                    </a>
                                </li>

                            </ul>
                        </nav>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script>
        function addToCart(bookId) {
            const data = {
                bookId: bookId,
                cartQuantity: 1
            };

            fetch('/carts/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
                .then(response => {
                    if (response.ok) {
                        if (confirm('장바구니에 담겼습니다. 장바구니로 이동하시겠습니까?')) {
                            location.href = '/carts';
                        }
                    } else if (response.status === 401) {
                        if(confirm('로그인이 필요한 서비스입니다. 로그인 페이지로 이동하시겠습니까?')) {
                            location.href = '/login';
                        }
                    } else {
                        response.text().then(msg => alert('장바구니 담기 실패: ' + msg));
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('오류가 발생했습니다.');
                });
        }

        function toggleWishlist(bookId) {
            fetch('/wishlists/toggle?bookId=' + bookId, {
                method: 'GET'
            })
                .then(response => {
                    if (response.status === 401) {
                        if(confirm('로그인이 필요한 서비스입니다. 로그인 페이지로 이동하시겠습니까?')) {
                            location.href = '/login';
                        }
                        return null;
                    }
                    if (response.ok) {
                        return response.json();
                    } else {
                        throw new Error('서버 오류');
                    }
                })
                .then(data => {
                    if (data) {
                        const msg = data.message || (data.isAdded ? '찜 목록에 추가되었습니다.' : '찜 목록에서 삭제되었습니다.');
                        alert(msg);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    if (error.message !== '서버 오류') {
                        // alert('오류가 발생했습니다.');
                    }
                });
        }
    </script>
</th:block>

</body>
</html>
