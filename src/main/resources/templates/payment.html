<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<head>
    <meta charset="UTF-8">
    <title>Trillion-Shop | 결제하기</title>
    <script src="https://js.tosspayments.com/v1/payment"></script>
    <th:block layout:fragment="head">
        <style>
            /* 결제 수단 라디오 버튼 숨김 (커스텀 라벨 사용) */
            .payment-method-radio {
                display: none;
            }

            /* 카드 결제 옵션 스타일 */
            .card-option-label {
                display: block;
                padding: 15px;
                border: 1px solid #ddd;
                border-radius: 5px;
                cursor: pointer;
                background-color: #fff;
                transition: all 0.2s;
                margin-bottom: 10px;
                font-weight: 500;
            }
            .card-option-label:hover {
                background-color: #f8f9fa;
                border-color: #333;
            }
            /* 카드 선택 시 강조 */
            #methodCard:checked + .card-option-label {
                border-color: #333;
                background-color: #e9ecef;
                font-weight: bold;
            }

            /* 토스페이 전용 버튼 스타일 (공식 UI 느낌) */
            .toss-pay-label {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                padding: 15px;
                background-color: #fff; /* [수정] 배경색 흰색으로 변경 */
                border: 1px solid #ddd;
                border-radius: 8px;
                cursor: pointer;
                transition: 0.2s;
                position: relative;
                margin-top: 10px; /* 구분선 삭제로 인한 간격 조정 */
            }
            .toss-pay-label:hover {
                background-color: #f8f9fa; /* 호버 시 아주 연한 회색 */
                border-color: #b0b8c1;
            }
            /* 토스 선택 시 강조 */
            #methodToss:checked + .toss-pay-label {
                border: 2px solid #0064FF; /* 토스 블루 */
                background-color: #e8f3ff;
            }

            /* 토스 로고 및 텍스트 */
            .toss-logo {
                width: auto;
                height: 24px;
                margin-right: 8px;
            }
            .toss-text {
                font-size: 1.1rem;
                font-weight: bold;
                color: #333;
            }
            .toss-badge {
                position: absolute;
                right: 15px;
                font-size: 0.8rem;
                color: #0064FF;
                border: 1px solid #0064FF;
                padding: 2px 6px;
                border-radius: 4px;
            }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">

    <div class="container-fluid pt-5 pb-3">
        <div class="row px-xl-5">
            <div class="col-lg-8 offset-lg-2">
                <h2 class="section-title position-relative text-uppercase mb-4">
                    <span class="bg-secondary pr-3">결제하기</span>
                </h2>
                <div class="bg-light p-30 mb-5">

                    <h5 class="section-title position-relative text-uppercase mb-3">
                        <span class="bg-secondary pr-3">주문 상품</span>
                    </h5>
                    <div class="table-responsive mb-4">
                        <table class="table table-bordered text-center mb-0">
                            <thead class="bg-secondary text-dark">
                            <tr>
                                <th>상품</th>
                                <th>단가</th>
                                <th>수량</th>
                                <th>합계</th>
                            </tr>
                            </thead>
                            <tbody class="align-middle">
                            <tr th:each="item : ${order.orderItems}">
                                <td class="align-middle text-left">
                                    <img th:src="${!#strings.isEmpty(item.bookImage)} ? @{'/trillion-bucket/' + ${item.bookImage}} : 'https://placehold.co/50x75?text=No+Image'"
                                         onerror="this.src='https://placehold.co/50x75?text=No+Image'"
                                         alt="상품 이미지" style="width: 50px; margin-right: 10px;">
                                    <span th:text="${item.bookName}">책 제목</span>
                                </td>
                                <td class="align-middle" th:text="${#numbers.formatInteger(item.unitPrice, 0, 'COMMA')} + '원'"></td>
                                <td class="align-middle" th:text="${item.quantity}"></td>
                                <td class="align-middle" th:text="${#numbers.formatInteger(item.totalItemSalePrice, 0, 'COMMA')} + '원'"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <h5 class="section-title position-relative text-uppercase mb-3">
                        <span class="bg-secondary pr-3">최종 결제 금액</span>
                    </h5>
                    <div class="border-bottom pb-2 mb-4">
                        <div class="d-flex justify-content-between mb-3">
                            <h6>총 상품 금액</h6>
                            <h6 th:text="${#numbers.formatInteger(order.originPrice, 0, 'COMMA')} + '원'"></h6>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <h6>포장비</h6>
                            <h6 th:text="${#numbers.formatInteger(totalPackagingFee, 0, 'COMMA')} + '원'"></h6>
                        </div>
                        <div class="d-flex justify-content-between text-danger" th:if="${order.pointUsage > 0}">
                            <h6>포인트 사용</h6>
                            <h6 th:text="'-' + ${#numbers.formatInteger(order.pointUsage, 0, 'COMMA')} + '원'"></h6>
                        </div>
                        <div class="d-flex justify-content-between text-danger" th:if="${order.totalCouponDiscount > 0}">
                            <h6>쿠폰 할인</h6>
                            <h6 th:text="'-' + ${#numbers.formatInteger(order.totalCouponDiscount, 0, 'COMMA')} + '원'"></h6>
                        </div>
                        <div class="d-flex justify-content-between">
                            <h6 class="font-weight-medium">배송비</h6>
                            <h6 class="font-weight-medium" th:text="${#numbers.formatInteger(order.deliveryFee, 0, 'COMMA')} + '원'"></h6>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mt-2">
                            <h5>총 결제 예정 금액</h5>
                            <h5 th:text="${#numbers.formatInteger(order.totalPrice, 0, 'COMMA')} + '원'"></h5>
                        </div>
                    </div>

                    <h5 class="section-title position-relative text-uppercase mb-3">
                        <span class="bg-secondary pr-3">결제 수단</span>
                    </h5>
                    <div class="mb-4">
                        <div class="form-group">
                            <input type="radio" id="methodCard" name="paymentMethod" value="카드" class="payment-method-radio" checked>
                            <label for="methodCard" class="card-option-label">
                                <i class="far fa-credit-card mr-2"></i> 일반결제 (신용/체크카드)
                            </label>

                            <input type="radio" id="methodToss" name="paymentMethod" value="토스페이" class="payment-method-radio">
                            <label for="methodToss" class="toss-pay-label">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/3/30/Toss-logo.svg" alt="Toss Logo" class="toss-logo">
                                <span class="toss-text">Toss Pay</span>
                                <span class="toss-badge">간편결제</span>
                            </label>
                        </div>

                        <button type="button" onclick="requestPayment()" class="btn btn-block btn-primary font-weight-bold py-3 mt-4">
                            <span th:text="${#numbers.formatInteger(order.totalPrice, 0, 'COMMA')} + '원'"></span> 결제하기
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script th:inline="javascript">
        const clientKey = [[${tossClientKey}]];
        const tossPayments = TossPayments(clientKey);

        const orderId = [[${order.orderNumber}]];
        const amount = [[${order.totalPrice}]];

        const firstItemName = [[${order.orderItems[0].bookName}]];
        const totalCount = [[${order.orderItems.size()}]];
        const orderName = totalCount > 1 ? firstItemName + ' 외 ' + (totalCount - 1) + '건' : firstItemName;

        const customerName = "구매자";

        function requestPayment() {
            // 1. [검증] 결제 금액 검증
            if (amount < 0) {
                alert("결제 금액은 0원 이상이어야 합니다. 관리자에게 문의하세요.");
                return;
            }

            // 2. 선택된 결제 수단 확인
            const methodElement = document.querySelector('input[name="paymentMethod"]:checked');
            if (!methodElement) {
                alert("결제 수단을 선택해주세요.");
                return;
            }
            const method = methodElement.value; // '카드' or '토스페이'

            const providerInfo = 'TOSS';
            const successUrl = window.location.origin + '/payments/success?provider=' + providerInfo;
            const failUrl = window.location.origin + '/payments/fail';

            // 3. 0원 결제 로직 (바로 성공 처리)
            if (amount === 0) {
                if(confirm("최종 결제 금액이 0원입니다. 결제를 진행하시겠습니까?")) {
                    // 중복 방지용 고유 키 생성
                    const uniquePaymentKey = "ZERO_" + orderId;
                    location.href = successUrl + "&paymentKey=" + uniquePaymentKey + "&orderId=" + orderId + "&amount=0";
                }
                return;
            }

            // 4. 토스페이먼츠 결제 요청
            tossPayments.requestPayment(method, {
                amount: amount,
                orderId: orderId,
                orderName: orderName,
                customerName: customerName,
                successUrl: successUrl,
                failUrl: failUrl,
            })
                .catch(function (error) {
                    if (error.code === 'USER_CANCEL') {
                        // 사용자 취소 시 처리 (조용히 종료)
                    } else {
                        alert(error.message);
                    }
                });
        }
    </script>
</th:block>

</body>
</html>
