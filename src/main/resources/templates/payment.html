<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<head>
    <meta charset="UTF-8">
    <title>Trillion-Shop | 결제하기</title>
    <script src="https://js.tosspayments.com/v1/payment"></script>
    <th:block layout:fragment="head">
    </th:block>
</head>

<body>
<div layout:fragment="content">

    <div class="container-fluid pt-5 pb-3">
        <div class="row px-xl-5">
            <div class="col-lg-8 offset-lg-2">
                <h2 class="section-title position-relative text-uppercase mb-4">
                    <span class="bg-secondary pr-3">결제하기</span>
                </h2>
                <div class="bg-light p-30 mb-5">

                    <h5 class="section-title position-relative text-uppercase mb-3">
                        <span class="bg-secondary pr-3">주문 상품</span>
                    </h5>
                    <div class="table-responsive mb-4">
                        <table class="table table-bordered text-center mb-0">
                            <thead class="bg-secondary text-dark">
                            <tr>
                                <th>상품</th>
                                <th>단가</th>
                                <th>수량</th>
                                <th>합계</th>
                            </tr>
                            </thead>
                            <tbody class="align-middle">
                            <tr th:each="item : ${order.orderItems}">
                                <td class="align-middle text-left">
                                    <img th:src="${item.bookImage != null ? item.bookImage : '/img/product-1.jpg'}" alt="" style="width: 50px;">
                                    <span th:text="${item.bookName}">책 제목</span>
                                </td>
                                <td class="align-middle" th:text="${#numbers.formatInteger(item.unitPrice, 0, 'COMMA')} + '원'"></td>
                                <td class="align-middle" th:text="${item.quantity}"></td>
                                <td class="align-middle" th:text="${#numbers.formatInteger(item.totalItemSalePrice, 0, 'COMMA')} + '원'"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <h5 class="section-title position-relative text-uppercase mb-3">
                        <span class="bg-secondary pr-3">최종 결제 금액</span>
                    </h5>
                    <div class="border-bottom pb-2 mb-4">
                        <div class="d-flex justify-content-between mb-3">
                            <h6>총 상품 금액</h6>
                            <h6 th:text="${#numbers.formatInteger(order.originPrice, 0, 'COMMA')} + '원'"></h6>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <h6>포장비</h6>
                            <h6 th:text="${#numbers.formatInteger(totalPackagingFee, 0, 'COMMA')} + '원'"></h6>
                        </div>
                        <div class="d-flex justify-content-between text-danger" th:if="${order.pointUsage > 0}">
                            <h6>포인트 사용</h6>
                            <h6 th:text="'-' + ${#numbers.formatInteger(order.pointUsage, 0, 'COMMA')} + '원'"></h6>
                        </div>
                        <div class="d-flex justify-content-between text-danger" th:if="${order.totalCouponDiscount > 0}">
                            <h6>쿠폰 할인</h6>
                            <h6 th:text="'-' + ${#numbers.formatInteger(order.totalCouponDiscount, 0, 'COMMA')} + '원'"></h6>
                        </div>
                        <div class="d-flex justify-content-between">
                            <h6 class="font-weight-medium">배송비</h6>
                            <h6 class="font-weight-medium" th:text="${#numbers.formatInteger(order.deliveryFee, 0, 'COMMA')} + '원'"></h6>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mt-2">
                            <h5>총 결제 예정 금액</h5>
                            <h5 th:text="${#numbers.formatInteger(order.totalPrice, 0, 'COMMA')} + '원'"></h5>
                        </div>
                    </div>

                    <h5 class="section-title position-relative text-uppercase mb-3">
                        <span class="bg-secondary pr-3">결제 수단 선택</span>
                    </h5>
                    <div class="mb-4">
                        <div class="form-group">
                            <label for="paymentMethod">결제 방법</label>
                            <select class="custom-select" id="paymentMethod">
                                <option value="카드">일반결제 (카드/계좌)</option>
                                <option value="토스페이">토스페이 앱 결제</option>
                                <option value="가상계좌">가상계좌</option>
                            </select>
                        </div>

                        <button type="button" onclick="requestPayment()" class="btn btn-block btn-primary font-weight-bold py-3">
                            <span th:text="${#numbers.formatInteger(order.totalPrice, 0, 'COMMA')} + '원'"></span> 결제하기
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script th:inline="javascript">
        const clientKey = [[${tossClientKey}]];
        const tossPayments = TossPayments(clientKey);

        // [수정] orderId(PK)가 아닌 orderNumber(주문번호)를 사용
        const orderId = [[${order.orderNumber}]];
        const amount = [[${order.totalPrice}]];

        // 주문명 생성
        const firstItemName = [[${order.orderItems[0].bookName}]];
        const totalCount = [[${order.orderItems.size()}]];
        const orderName = totalCount > 1 ? firstItemName + ' 외 ' + (totalCount - 1) + '건' : firstItemName;

        const customerName = "구매자";

        function requestPayment() {
            const methodSelect = document.getElementById("paymentMethod");
            const method = methodSelect.value;

            // Provider 정보 설정
            const providerInfo = 'TOSS';

            // 리다이렉트 URL 설정 (Provider 포함)
            const successUrl = window.location.origin + '/payments/success?provider=' + providerInfo;
            const failUrl = window.location.origin + '/payments/fail';

            tossPayments.requestPayment(method, {
                amount: amount,
                orderId: orderId, // 여기에는 이제 orderNumber가 들어갑니다.
                orderName: orderName,
                customerName: customerName,
                successUrl: successUrl,
                failUrl: failUrl,
            })
                .catch(function (error) {
                    if (error.code === 'USER_CANCEL') {
                        // 취소 시 처리
                    } else {
                        alert(error.message);
                    }
                });
        }
    </script>
</th:block>

</body>
</html>
