<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<head>
    <meta charset="utf-8">
    <title>Trillion-Shop | 메인</title>

    <th:block layout:fragment="head">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <meta content="Book Store, E-commerce" name="keywords">
        <meta content="Online Book Store" name="description">

        <style>
            /* 섹션 헤더 (제목 + 더보기 버튼) */
            .clean-section-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                margin-bottom: 25px;
                padding-bottom: 10px;
            }
            .clean-section-title {
                font-size: 1.5rem;
                font-weight: 800;
                color: #222;
                margin: 0;
            }
            .clean-more-btn {
                font-size: 0.95rem;
                color: #666;
                text-decoration: none;
                font-weight: 600;
                cursor: pointer;
            }
            .clean-more-btn:hover {
                color: #222;
                text-decoration: none;
            }

            /* 공통 썸네일 크기 고정 */
            .book-thumb {
                display: block;
                width: 100%;
                height: 240px;
                object-fit: cover;
                background: #f3f3f3;
            }
            .product-img .book-thumb { height: 240px; }

            /* 카테고리 선택 버튼 (Pills) 스타일 */
            .category-pill {
                display: inline-block;
                padding: 8px 20px;
                margin: 0 5px 10px 5px;
                border-radius: 50px;
                background-color: #f5f5f5;
                color: #666;
                text-decoration: none;
                font-weight: 600;
                transition: all 0.3s ease;
                border: 1px solid #eee;
            }
            .category-pill:hover {
                background-color: #e9ecef;
                color: #333;
                text-decoration: none;
            }
            .category-pill.active {
                background-color: #FFD333;
                color: #3D464D;
                border-color: #FFD333;
                box-shadow: 0 2px 5px rgba(255, 211, 51, 0.4);
            }

            /* [추가] 넷플릭스 스타일 Carousel 화살표 커스텀 CSS */
            .related-carousel .owl-nav {
                position: absolute;
                top: 50%;
                width: 100%;
                transform: translateY(-50%);
                display: flex;
                justify-content: space-between;
                left: 0;
                pointer-events: none; /* 화살표 사이 빈 공간 클릭 허용 */
                z-index: 10;
            }

            /* 화살표 버튼 스타일 */
            .related-carousel .owl-nav button.owl-prev,
            .related-carousel .owl-nav button.owl-next {
                pointer-events: auto;
                width: 45px;
                height: 45px;
                background-color: rgba(255, 255, 255, 0.9) !important;
                border-radius: 50%;
                color: #333 !important;
                font-size: 20px !important;
                display: flex !important;
                align-items: center;
                justify-content: center;
                box-shadow: 0 4px 6px rgba(0,0,0,0.15);
                transition: all 0.3s ease;
                margin: 0 !important;
                outline: none;
            }

            /* 호버 효과 */
            .related-carousel .owl-nav button.owl-prev:hover,
            .related-carousel .owl-nav button.owl-next:hover {
                background-color: #fff !important;
                transform: scale(1.1);
                box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            }

            /* 화살표 위치 미세 조정 (컨텐츠 밖으로 살짝 빼기) */
            .related-carousel .owl-nav button.owl-prev { margin-left: -20px !important; }
            .related-carousel .owl-nav button.owl-next { margin-right: -20px !important; }

        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">

    <div class="container-fluid mb-3">
        <div class="row px-xl-5">
            <div class="col-lg-8">
                <div id="header-carousel" class="carousel slide carousel-fade mb-30 mb-lg-0" data-ride="carousel">

                    <ol class="carousel-indicators">
                        <li th:each="book, iterStat : ${bestSellers}"
                            data-target="#header-carousel"
                            th:data-slide-to="${iterStat.index}"
                            th:classappend="${iterStat.first} ? 'active'">
                        </li>
                    </ol>

                    <div class="carousel-inner">
                        <div th:each="book, iterStat : ${bestSellers}"
                             class="carousel-item position-relative"
                             th:classappend="${iterStat.first} ? 'active'"
                             style="height: 430px;">

                            <img class="position-absolute w-100 h-100"
                                 th:src="${!#strings.isEmpty(book.bookImage) ? '/trillion-bucket/' + book.bookImage : '/img/default-book.png'}"
                                 style="object-fit: cover;">

                            <div class="carousel-caption d-flex flex-column align-items-center justify-content-center">
                                <div class="p-3" style="max-width: 700px;">
                                    <h1 class="display-4 text-white mb-3 animate__animated animate__fadeInDown"></h1>
                                    <p class="mx-md-5 px-5 animate__animated animate__bounceIn"
                                       th:text="${book.bookName}"
                                       style="font-size: 1.5rem; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.6);">
                                        책 제목
                                    </p>
                                    <a class="btn btn-outline-light py-2 px-4 mt-3 animate__animated animate__fadeInUp"
                                       th:href="@{/books/{id}(id=${book.bookId})}">
                                        지금 보러가기
                                    </a>
                                </div>
                            </div>
                        </div>

                        <div th:if="${#lists.isEmpty(bestSellers)}" class="carousel-item position-relative active" style="height: 430px;">
                            <img class="position-absolute w-100 h-100" th:src="@{/img/carousel-1.jpg}" style="object-fit: cover;">
                            <div class="carousel-caption d-flex flex-column align-items-center justify-content-center">
                                <div class="p-3">
                                    <h1 class="display-4 text-white mb-3 animate__animated animate__fadeInDown">Best Seller</h1>
                                    <p class="mx-md-5 px-5 animate__animated animate__bounceIn">지금 가장 사랑받는 도서를 만나보세요.</p>
                                    <a class="btn btn-outline-light py-2 px-4 mt-3 animate__animated animate__fadeInUp" th:href="@{/books}">도서 전체 보기</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid pt-5">
        <div class="row px-xl-5">
            <div class="col-12">
                <div class="clean-section-header">
                    <h2 class="clean-section-title">🔥 지금 많이 보고 있는 책</h2>
                </div>
            </div>
        </div>

        <div class="row px-xl-5">
            <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(popularBooks)}">
                <p class="text-muted">집계된 인기 도서가 없습니다.</p>
            </div>

            <div class="col-12" th:unless="${#lists.isEmpty(popularBooks)}">
                <div class="owl-carousel related-carousel position-relative">
                    <div class="item" th:each="book : ${popularBooks}">
                        <div class="product-item bg-light mb-4">
                            <div class="product-img position-relative overflow-hidden">
                                <img class="img-fluid w-100 book-thumb"
                                     th:src="${!#strings.isEmpty(book.bookImage) ? '/trillion-bucket/' + book.bookImage : '/img/default-book.png'}"
                                     loading="lazy" alt="책 표지">
                                <div class="product-action">
                                    <a class="btn btn-outline-dark btn-square" href="javascript:void(0);" th:onclick="'addToCart(' + ${book.bookId} + ')'">
                                        <i class="fa fa-shopping-cart"></i>
                                    </a>
                                    <a class="btn btn-outline-dark btn-square"
                                       href="javascript:void(0);"
                                       th:onclick="'toggleWishlist(' + ${book.bookId} + ')'">
                                        <i class="far fa-heart"></i>
                                    </a>
                                    <a class="btn btn-outline-dark btn-square" th:href="@{/books/{book_id}(book_id=${book.bookId})}"><i class="fa fa-search"></i></a>
                                </div>
                            </div>
                            <div class="text-center py-4 px-2">
                                <a class="h6 text-decoration-none text-truncate d-block mb-1"
                                   th:href="@{/books/{book_id}(book_id=${book.bookId})}"
                                   th:text="${book.bookName}">책 제목</a>

                                <div class="small text-muted mb-2">
                                    <span th:text="${book.bookAuthor == null ? '저자 미상' : (#strings.length(book.bookAuthor) > 10 ? #strings.substring(book.bookAuthor, 0, 10) + '...' : book.bookAuthor)}">저자명</span>
                                </div>

                                <div class="d-flex align-items-center justify-content-center mt-1">
                                    <div th:if="${book.bookSalePrice > 0}" class="d-flex align-items-center">
                                        <h5 class="text-primary mb-0" th:text="${#numbers.formatInteger(book.bookSalePrice, 0, 'COMMA')} + '원'">12,000원</h5>
                                        <h6 class="text-muted ml-2 mb-0" th:if="${book.bookSalePrice < book.bookRegularPrice}">
                                            <del th:text="${#numbers.formatInteger(book.bookRegularPrice, 0, 'COMMA')} + '원'">15,000원</del>
                                        </h6><br>
                                        <span class="badge badge-danger ml-2" th:if="${book.bookSalePrice < book.bookRegularPrice}" th:text="${book.discountRate} + '% 할인'">10% 할인</span>
                                    </div>
                                    <div th:if="${book.bookSalePrice == 0}">
                                        <h5 class="text-primary mb-0" th:text="${#numbers.formatInteger(book.bookRegularPrice, 0, 'COMMA')} + '원'">15,000원</h5>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="container-fluid pt-3 pb-5">
        <div class="row px-xl-5">
            <div class="col-12">
                <div class="clean-section-header">
                    <h2 class="clean-section-title">
                        ✨ <span class="text-primary" th:text="${selectedCategoryName}">추천</span> 분야의 도서
                    </h2>
                </div>
            </div>
        </div>

        <div class="row px-xl-5 mb-4">
            <div class="col-12 text-center">
                <a th:href="@{/(categoryId=0)}"
                   class="category-pill"
                   th:classappend="${selectedCategoryId == 0} ? 'active'">
                    전체
                </a>
                <a th:each="cat : ${rootCategories}"
                   th:href="@{/(categoryId=${cat.categoryId})}"
                   class="category-pill"
                   th:classappend="${cat.categoryId == selectedCategoryId} ? 'active'"
                   th:text="${cat.categoryName}">
                    문학
                </a>
            </div>
        </div>

        <div class="row px-xl-5">
            <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(categoryBooks)}">
                <p class="text-muted">해당 카테고리의 추천 도서가 없습니다.</p>
            </div>

            <div class="col-lg-2 col-md-4 col-6" th:each="book : ${categoryBooks}">
                <div class="product-item bg-light mb-4">
                    <div class="product-img position-relative overflow-hidden">
                        <img class="img-fluid w-100 book-thumb"
                             th:src="${!#strings.isEmpty(book.bookImage) ? '/trillion-bucket/' + book.bookImage : '/img/default-book.png'}"
                             loading="lazy" alt="책 표지">
                        <div class="product-action">
                            <a class="btn btn-outline-dark btn-square" href="javascript:void(0);" th:onclick="'addToCart(' + ${book.bookId} + ')'">
                                <i class="fa fa-shopping-cart"></i>
                            </a>
                            <a class="btn btn-outline-dark btn-square"
                               href="javascript:void(0);"
                               th:onclick="'toggleWishlist(' + ${book.bookId} + ')'">
                                <i class="far fa-heart"></i>
                            </a>
                            <a class="btn btn-outline-dark btn-square" th:href="@{/books/{book_id}(book_id=${book.bookId})}"><i class="fa fa-search"></i></a>
                        </div>
                    </div>
                    <div class="text-center py-4 px-2">
                        <a class="h6 text-decoration-none text-truncate d-block mb-1"
                           th:href="@{/books/{book_id}(book_id=${book.bookId})}"
                           th:text="${book.bookName}">책 제목</a>

                        <div class="small text-muted mb-2">
                            <span th:text="${book.bookAuthor == null ? '저자 미상' : (#strings.length(book.bookAuthor) > 10 ? #strings.substring(book.bookAuthor, 0, 10) + '...' : book.bookAuthor)}">저자명</span>
                        </div>

                        <div class="d-flex align-items-center justify-content-center mt-1">
                            <div th:if="${book.bookSalePrice > 0}" class="d-flex align-items-center">
                                <h5 class="text-primary mb-0" th:text="${#numbers.formatInteger(book.bookSalePrice, 0, 'COMMA')} + '원'">12,000원</h5>
                                <h6 class="text-muted ml-2 mb-0" th:if="${book.bookSalePrice < book.bookRegularPrice}">
                                    <del th:text="${#numbers.formatInteger(book.bookRegularPrice, 0, 'COMMA')} + '원'">15,000원</del>
                                </h6>
                                <span class="badge badge-danger ml-2" th:if="${book.bookSalePrice < book.bookRegularPrice}" th:text="${book.discountRate} + '% 할인'">10% 할인</span>
                            </div>
                            <div th:if="${book.bookSalePrice == 0}">
                                <h5 class="text-primary mb-0" th:text="${#numbers.formatInteger(book.bookRegularPrice, 0, 'COMMA')} + '원'">15,000원</h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


</div>

<th:block layout:fragment="script">
    <script>
        // 장바구니 담기 (POST + JSON 방식)
        function addToCart(bookId) {
            const data = {
                bookId: bookId,
                cartQuantity: 1
            };

            fetch('/carts/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
                .then(response => {
                    if (response.ok) {
                        if (confirm('장바구니에 담겼습니다. 장바구니로 이동하시겠습니까?')) {
                            location.href = '/carts';
                        }
                    } else if (response.status === 401) {
                        if(confirm('로그인이 필요한 서비스입니다. 로그인 페이지로 이동하시겠습니까?')) {
                            location.href = '/login';
                        }
                    } else {
                        response.text().then(msg => alert('장바구니 담기 실패: ' + msg));
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('오류가 발생했습니다.');
                });
        }

        // 찜하기 (GET 방식)
        function toggleWishlist(bookId) {
            fetch('/wishlists/toggle?bookId=' + bookId, { method: 'GET' })
                .then(response => {
                    if (response.status === 401) {
                        if(confirm('로그인이 필요한 서비스입니다. 로그인 페이지로 이동하시겠습니까?')) {
                            location.href = '/login';
                        }
                        return null;
                    }
                    if (response.ok) return response.json();
                    else throw new Error('서버 오류');
                })
                .then(data => {
                    if (data) {
                        const msg = data.message || (data.isAdded ? '찜 목록에 추가되었습니다.' : '찜 목록에서 삭제되었습니다.');
                        alert(msg);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }
    </script>
</th:block>

</body>
</html>
