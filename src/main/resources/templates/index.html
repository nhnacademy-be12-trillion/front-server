<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<head>
    <meta charset="utf-8">
    <title>Trillion-Shop | 메인</title>

    <th:block layout:fragment="head">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <meta content="Book Store, E-commerce" name="keywords">
        <meta content="Online Book Store" name="description">

        <style>
            /* 섹션 헤더 스타일 */
            .clean-section-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                margin-bottom: 25px;
                padding-bottom: 10px;
            }
            .clean-section-title {
                font-size: 1.5rem;
                font-weight: 800;
                color: #222;
                margin: 0;
            }

            /* 썸네일 크기 고정 */
            .book-thumb {
                display: block;
                width: 100%;
                height: 240px;
                object-fit: cover;
                background: #f3f3f3;
            }

            /* 카테고리 버튼 스타일 */
            .category-pill {
                display: inline-block;
                padding: 8px 20px;
                margin: 0 5px 10px 5px;
                border-radius: 50px;
                background-color: #f5f5f5;
                color: #666;
                text-decoration: none;
                font-weight: 600;
                transition: all 0.3s ease;
                border: 1px solid #eee;
            }
            .category-pill:hover {
                background-color: #e9ecef;
                color: #333;
                text-decoration: none;
            }
            .category-pill.active {
                background-color: #FFD333;
                color: #3D464D;
                border-color: #FFD333;
            }

            /* [중요] 화살표 버튼 스타일 (강제 적용) */
            .custom-carousel .owl-nav {
                position: absolute;
                top: 35%; /* 이미지 중앙 쯤에 위치 */
                width: 100%;
                display: flex;
                justify-content: space-between;
                pointer-events: none; /* 화살표 사이 빈 공간 클릭 허용 */
                z-index: 10;
                left: 0;
            }
            .custom-carousel .owl-nav button.owl-prev,
            .custom-carousel .owl-nav button.owl-next {
                pointer-events: auto;
                width: 40px;
                height: 40px;
                background: rgba(255, 255, 255, 0.9) !important;
                border-radius: 50%;
                color: #000 !important;
                font-size: 24px !important;
                display: flex !important;
                align-items: center;
                justify-content: center;
                box-shadow: 0 2px 5px rgba(0,0,0,0.2);
                margin: 0 -20px !important; /* 컨텐츠 밖으로 살짝 빼기 */
                outline: none;
            }
            .custom-carousel .owl-nav button.owl-prev:hover,
            .custom-carousel .owl-nav button.owl-next:hover {
                background: #fff !important;
                transform: scale(1.1);
            }

            /* 슬라이더 아이템 간격 확보 */
            .custom-carousel .item {
                padding: 5px;
            }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">

    <div class="container-fluid mb-3">
        <div class="row px-xl-5">
            <div class="col-lg-8">
                <div id="header-carousel" class="carousel slide carousel-fade mb-30 mb-lg-0" data-ride="carousel">
                    <ol class="carousel-indicators">
                        <li th:each="book, iterStat : ${bestSellers}"
                            data-target="#header-carousel"
                            th:data-slide-to="${iterStat.index}"
                            th:classappend="${iterStat.first} ? 'active'">
                        </li>
                    </ol>
                    <div class="carousel-inner">
                        <div th:each="book, iterStat : ${bestSellers}"
                             class="carousel-item position-relative"
                             th:classappend="${iterStat.first} ? 'active'"
                             style="height: 430px;">
                            <img class="position-absolute w-100 h-100"
                                 th:src="${!#strings.isEmpty(book.bookImage) ? '/trillion-bucket/' + book.bookImage : '/img/default-book.png'}"
                                 style="object-fit: cover;">
                            <div class="carousel-caption d-flex flex-column align-items-center justify-content-center">
                                <div class="p-3" style="max-width: 700px;">
                                    <h1 class="display-4 text-white mb-3" th:text="${book.bookName}">책 제목</h1>
                                    <a class="btn btn-outline-light py-2 px-4 mt-3"
                                       th:href="@{/books/{id}(id=${book.bookId})}">지금 보러가기</a>
                                </div>
                            </div>
                        </div>
                        <div th:if="${#lists.isEmpty(bestSellers)}" class="carousel-item position-relative active" style="height: 430px;">
                            <img class="position-absolute w-100 h-100" th:src="@{/img/carousel-1.jpg}" style="object-fit: cover;">
                            <div class="carousel-caption d-flex flex-column align-items-center justify-content-center">
                                <h1 class="display-4 text-white mb-3">Best Seller</h1>
                                <a class="btn btn-outline-light py-2 px-4 mt-3" th:href="@{/books}">전체 보기</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid pt-5">
        <div class="row px-xl-5">
            <div class="col-12">
                <div class="clean-section-header">
                    <h2 class="clean-section-title">🔥 지금 많이 보고 있는 책</h2>
                </div>
            </div>
        </div>

        <div class="row px-xl-5">
            <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(popularBooks)}">
                <p class="text-muted">집계된 인기 도서가 없습니다.</p>
            </div>

            <div class="col-12" th:unless="${#lists.isEmpty(popularBooks)}">
                <div class="owl-carousel custom-carousel">
                    <div class="item" th:each="book : ${popularBooks}">
                        <div class="product-item bg-light mb-4">
                            <div class="product-img position-relative overflow-hidden">
                                <img class="img-fluid w-100 book-thumb"
                                     th:src="${!#strings.isEmpty(book.bookImage) ? '/trillion-bucket/' + book.bookImage : '/img/default-book.png'}"
                                     loading="lazy" alt="책 표지">
                                <div class="product-action">
                                    <a class="btn btn-outline-dark btn-square" href="javascript:void(0);" th:onclick="'addToCart(' + ${book.bookId} + ')'"><i class="fa fa-shopping-cart"></i></a>
                                    <a class="btn btn-outline-dark btn-square" href="javascript:void(0);" th:onclick="'toggleWishlist(' + ${book.bookId} + ')'"><i class="far fa-heart"></i></a>
                                    <a class="btn btn-outline-dark btn-square" th:href="@{/books/{book_id}(book_id=${book.bookId})}"><i class="fa fa-search"></i></a>
                                </div>
                            </div>
                            <div class="text-center py-4 px-2">
                                <a class="h6 text-decoration-none text-truncate d-block mb-1"
                                   th:href="@{/books/{book_id}(book_id=${book.bookId})}"
                                   th:text="${book.bookName}">책 제목</a>
                                <div class="d-flex align-items-center justify-content-center mt-1">
                                    <h5 class="text-primary mb-0" th:text="${#numbers.formatInteger(book.bookSalePrice > 0 ? book.bookSalePrice : book.bookRegularPrice, 0, 'COMMA')} + '원'">12,000원</h5>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="container-fluid pt-3 pb-5">
        <div class="row px-xl-5">
            <div class="col-12">
                <div class="clean-section-header">
                    <h2 class="clean-section-title">
                        ✨ <span class="text-primary" th:text="${selectedCategoryName}">추천</span> 분야의 도서
                    </h2>
                </div>
            </div>
        </div>
        <div class="row px-xl-5 mb-4">
            <div class="col-12 text-center">
                <a th:href="@{/(categoryId=0)}" class="category-pill" th:classappend="${selectedCategoryId == 0} ? 'active'">전체</a>
                <a th:each="cat : ${rootCategories}" th:href="@{/(categoryId=${cat.categoryId})}" class="category-pill" th:classappend="${cat.categoryId == selectedCategoryId} ? 'active'" th:text="${cat.categoryName}">문학</a>
            </div>
        </div>

        <div class="row px-xl-5">
            <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(categoryBooks)}">
                <p class="text-muted">해당 카테고리의 추천 도서가 없습니다.</p>
            </div>

            <div class="col-lg-2 col-md-4 col-6" th:each="book : ${categoryBooks}">
                <div class="product-item bg-light mb-4">
                    <div class="product-img position-relative overflow-hidden">
                        <img class="img-fluid w-100 book-thumb"
                             th:src="${!#strings.isEmpty(book.bookImage) ? '/trillion-bucket/' + book.bookImage : '/img/default-book.png'}"
                             loading="lazy" alt="책 표지">
                        <div class="product-action">
                            <a class="btn btn-outline-dark btn-square" href="javascript:void(0);" th:onclick="'addToCart(' + ${book.bookId} + ')'"><i class="fa fa-shopping-cart"></i></a>
                            <a class="btn btn-outline-dark btn-square" href="javascript:void(0);" th:onclick="'toggleWishlist(' + ${book.bookId} + ')'"><i class="far fa-heart"></i></a>
                            <a class="btn btn-outline-dark btn-square" th:href="@{/books/{book_id}(book_id=${book.bookId})}"><i class="fa fa-search"></i></a>
                        </div>
                    </div>
                    <div class="text-center py-4 px-2">
                        <a class="h6 text-decoration-none text-truncate d-block mb-1" th:href="@{/books/{book_id}(book_id=${book.bookId})}" th:text="${book.bookName}">책 제목</a>
                        <div class="d-flex align-items-center justify-content-center mt-1">
                            <h5 class="text-primary mb-0" th:text="${#numbers.formatInteger(book.bookSalePrice > 0 ? book.bookSalePrice : book.bookRegularPrice, 0, 'COMMA')} + '원'">12,000원</h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script>
        // 1. [중요] 슬라이더 강제 초기화 스크립트
        $(document).ready(function() {
            $(".custom-carousel").owlCarousel({
                loop: false,         // 10개만 있고 끝이 있으면 false
                margin: 20,          // 아이템 간격
                nav: true,           // 화살표 켜기
                navText: [
                    '<i class="fa fa-angle-left" aria-hidden="true"></i>',
                    '<i class="fa fa-angle-right" aria-hidden="true"></i>'
                ],
                autoplay: false,     // 자동 넘김 끄기 (넷플릭스처럼 직접 넘기기)
                smartSpeed: 1000,
                slideBy: 1,          // 하나씩 이동
                dots: false,         // 하단 점 끄기
                responsive: {
                    0:{ items: 2 },
                    576:{ items: 3 },
                    768:{ items: 4 },
                    992:{ items: 5 }, // PC에서 5개 보이기
                    1200:{ items: 5 }
                }
            });
        });

        // 2. 장바구니 기능
        function addToCart(bookId) {
            fetch('/carts/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bookId: bookId, cartQuantity: 1 })
            }).then(res => {
                if (res.ok) {
                    if (confirm('장바구니에 담겼습니다. 이동하시겠습니까?')) location.href = '/carts';
                } else if (res.status === 401) {
                    if(confirm('로그인 하시겠습니까?')) location.href = '/login';
                } else {
                    res.text().then(msg => alert('실패: ' + msg));
                }
            });
        }

        // 3. 찜하기 기능
        function toggleWishlist(bookId) {
            fetch('/wishlists/toggle?bookId=' + bookId)
                .then(res => {
                    if (res.status === 401) {
                        if(confirm('로그인 하시겠습니까?')) location.href = '/login';
                        return;
                    }
                    return res.json();
                })
                .then(data => {
                    if(data) alert(data.message || '처리되었습니다.');
                });
        }
    </script>
</th:block>

</body>
</html>
