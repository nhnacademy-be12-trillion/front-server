<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<head>
    <meta charset="utf-8">
    <title>Trillion-Shop | 메인</title>

    <th:block layout:fragment="head">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <meta content="Book Store, E-commerce" name="keywords">
        <meta content="Online Book Store" name="description">

        <style>
            /* 섹션 헤더 (제목 + 더보기 버튼) */
            .clean-section-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                margin-bottom: 25px;
                padding-bottom: 10px;
            }
            .clean-section-title {
                font-size: 1.5rem;
                font-weight: 800;
                color: #222;
                margin: 0;
            }
            .clean-more-btn {
                font-size: 0.95rem;
                color: #666;
                text-decoration: none;
                font-weight: 600;
                cursor: pointer;
            }
            .clean-more-btn:hover {
                color: #222;
                text-decoration: none;
            }

            /* 공통 썸네일 크기 고정 (높이 240px) */
            .book-thumb {
                display: block;
                width: 100%;
                height: 240px;
                object-fit: cover;
                background: #f3f3f3;
            }
            .product-img .book-thumb { height: 240px; }

            /* 카테고리 선택 버튼 (Pills) 스타일 */
            .category-pill {
                display: inline-block;
                padding: 8px 20px;
                margin: 0 5px 10px 5px;
                border-radius: 50px;
                background-color: #f5f5f5;
                color: #666;
                text-decoration: none;
                font-weight: 600;
                transition: all 0.3s ease;
                border: 1px solid #eee;
            }
            .category-pill:hover {
                background-color: #e9ecef;
                color: #333;
                text-decoration: none;
            }
            /* 활성화된 버튼 스타일 */
            .category-pill.active {
                background-color: #FFD333; /* 포인트 컬러 */
                color: #3D464D;
                border-color: #FFD333;
                box-shadow: 0 2px 5px rgba(255, 211, 51, 0.4);
            }

            /* --- 슬라이더 관련 스타일 --- */
            .slider-wrapper {
                position: relative;
                padding: 0;
            }

            .popular-slider-track {
                display: flex;
                gap: 20px;
                overflow-x: auto;
                scroll-behavior: smooth;
                padding-bottom: 10px;
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            .popular-slider-track::-webkit-scrollbar {
                display: none;
            }

            .slider-item {
                flex: 0 0 220px;
                max-width: 220px;
            }

            /* 슬라이더 버튼 스타일 */
            .slider-btn {
                position: absolute;
                top: 100px; /* 표지 중앙 높이 쯤 */
                background: none;
                border: none;
                box-shadow: none;
                padding: 0;
                cursor: pointer;
                z-index: 10;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 40px;
                height: 40px;
                outline: none !important; /* 클릭 시 네모 박스(포커스) 제거 */
            }

            /* [수정] 화살표 두께를 1px -> 2px로 변경하여 약간 더 두껍게 */
            .custom-thin-arrow {
                display: inline-block;
                width: 25px;
                height: 25px;
                border-top: 2px solid #555;  /* 여기를 2px로 수정 */
                border-right: 2px solid #555; /* 여기를 2px로 수정 */
                transition: all 0.2s ease;
            }

            /* 버튼 위치 및 화살표 회전 */
            .prev-btn { left: -45px; }
            .prev-btn .custom-thin-arrow {
                transform: rotate(-135deg); /* 왼쪽 화살표 */
            }

            .next-btn { right: -45px; }
            .next-btn .custom-thin-arrow {
                transform: rotate(45deg); /* 오른쪽 화살표 */
            }

            /* 호버 효과 */
            .slider-btn:hover .custom-thin-arrow {
                border-color: #00C4FF; /* 하늘색 */
                transform: scale(1.1) rotate(45deg); /* 오른쪽 기준 */
            }
            .prev-btn:hover .custom-thin-arrow {
                transform: scale(1.1) rotate(-135deg); /* 왼쪽 기준 회전 유지하며 확대 */
            }

            /* --- 슬라이더 관련 스타일 끝 --- */

        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">

    <div class="container-fluid mb-3">
        <div class="row px-xl-5">
            <div class="col-lg-8">
                <div id="header-carousel" class="carousel slide carousel-fade mb-30 mb-lg-0" data-ride="carousel">

                    <ol class="carousel-indicators">
                        <li th:each="book, iterStat : ${bestSellers}"
                            data-target="#header-carousel"
                            th:data-slide-to="${iterStat.index}"
                            th:classappend="${iterStat.first} ? 'active'">
                        </li>
                    </ol>

                    <div class="carousel-inner">
                        <div th:each="book, iterStat : ${bestSellers}"
                             class="carousel-item position-relative"
                             th:classappend="${iterStat.first} ? 'active'"
                             style="height: 430px;">

                            <img class="position-absolute w-100 h-100"
                                 th:src="${!#strings.isEmpty(book.bookImage) ? '/trillion-bucket/' + book.bookImage : '/img/default-book.png'}"
                                 style="object-fit: cover;">

                            <div class="carousel-caption d-flex flex-column align-items-center justify-content-center">
                                <div class="p-3" style="max-width: 700px;">
                                    <h1 class="display-4 text-white mb-3 animate__animated animate__fadeInDown">
                                    </h1>

                                    <p class="mx-md-5 px-5 animate__animated animate__bounceIn"
                                       th:text="${book.bookName}"
                                       style="font-size: 1.5rem; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.6);">
                                        책 제목
                                    </p>

                                    <a class="btn btn-outline-light py-2 px-4 mt-3 animate__animated animate__fadeInUp"
                                       th:href="@{/books/{id}(id=${book.bookId})}">
                                        지금 보러가기
                                    </a>
                                </div>
                            </div>
                        </div>

                        <div th:if="${#lists.isEmpty(bestSellers)}" class="carousel-item position-relative active" style="height: 430px;">
                            <img class="position-absolute w-100 h-100" th:src="@{/img/carousel-1.jpg}" style="object-fit: cover;">
                            <div class="carousel-caption d-flex flex-column align-items-center justify-content-center">
                                <div class="p-3">
                                    <h1 class="display-4 text-white mb-3 animate__animated animate__fadeInDown">Best Seller</h1>
                                    <p class="mx-md-5 px-5 animate__animated animate__bounceIn">지금 가장 사랑받는 도서를 만나보세요.</p>
                                    <a class="btn btn-outline-light py-2 px-4 mt-3 animate__animated animate__fadeInUp" th:href="@{/books}">도서 전체 보기</a>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="container-fluid pt-5">
        <div class="row px-xl-5">
            <div class="col-12">
                <div class="clean-section-header">
                    <h2 class="clean-section-title">🔥 지금 많이 보고 있는 책</h2>
                </div>
            </div>
        </div>

        <div class="row px-xl-5">
            <div class="col-12" th:if="${#lists.isEmpty(popularBooks)}">
                <div class="text-center py-5">
                    <p class="text-muted">집계된 인기 도서가 없습니다.</p>
                </div>
            </div>

            <div class="col-12 position-relative slider-wrapper" th:unless="${#lists.isEmpty(popularBooks)}">
                <button class="slider-btn prev-btn" onclick="slidePopular('left')">
                    <span class="custom-thin-arrow"></span>
                </button>

                <div class="popular-slider-track" id="popularBooksTrack">
                    <div class="slider-item" th:each="book : ${popularBooks}">
                        <div class="product-item bg-light mb-4">
                            <div class="product-img position-relative overflow-hidden">
                                <img class="img-fluid w-100 book-thumb"
                                     th:src="${!#strings.isEmpty(book.bookImage) ? '/trillion-bucket/' + book.bookImage : '/img/default-book.png'}"
                                     loading="lazy" alt="책 표지">
                                <div class="product-action">
                                    <a class="btn btn-outline-dark btn-square" href="javascript:void(0);" th:onclick="'addToCart(' + ${book.bookId} + ')'">
                                        <i class="fa fa-shopping-cart"></i>
                                    </a>
                                    <a class="btn btn-outline-dark btn-square"
                                       href="javascript:void(0);"
                                       th:onclick="'toggleWishlist(' + ${book.bookId} + ')'">
                                        <i class="far fa-heart"></i>
                                    </a>
                                    <a class="btn btn-outline-dark btn-square" th:href="@{/books/{book_id}(book_id=${book.bookId})}"><i class="fa fa-search"></i></a>
                                </div>
                            </div>
                            <div class="text-center py-4 px-2">
                                <a class="h6 text-decoration-none text-truncate d-block mb-1"
                                   th:href="@{/books/{book_id}(book_id=${book.bookId})}"
                                   th:text="${book.bookName}">책 제목</a>

                                <div class="small text-muted mb-2">
                                    <span th:text="${book.bookAuthor == null ? '저자 미상' : (#strings.length(book.bookAuthor) > 10 ? #strings.substring(book.bookAuthor, 0, 10) + '...' : book.bookAuthor)}">저자명</span>
                                </div>

                                <div class="d-flex align-items-center justify-content-center mt-1">
                                    <div th:if="${book.bookSalePrice > 0}" class="d-flex align-items-center">
                                        <h5 class="text-primary mb-0" th:text="${#numbers.formatInteger(book.bookSalePrice, 0, 'COMMA')} + '원'">12,000원</h5>
                                        <h6 class="text-muted ml-2 mb-0" th:if="${book.bookSalePrice < book.bookRegularPrice}">
                                            <del th:text="${#numbers.formatInteger(book.bookRegularPrice, 0, 'COMMA')} + '원'">15,000원</del>
                                        </h6>
                                        <span class="badge badge-danger ml-2" th:if="${book.bookSalePrice < book.bookRegularPrice}" th:text="${book.discountRate} + '%'">10%</span>
                                    </div>
                                    <div th:if="${book.bookSalePrice == 0}">
                                        <h5 class="text-primary mb-0" th:text="${#numbers.formatInteger(book.bookRegularPrice, 0, 'COMMA')} + '원'">15,000원</h5>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <button class="slider-btn next-btn" onclick="slidePopular('right')">
                    <span class="custom-thin-arrow"></span>
                </button>
            </div>
        </div>
    </div>


    <div class="container-fluid pt-3 pb-5">

        <div class="row px-xl-5">
            <div class="col-12">
                <div class="clean-section-header">
                    <h2 class="clean-section-title">
                        ✨
                        <span class="text-primary"
                              th:text="${selectedCategoryId == 0 ? '전체' : selectedCategoryName}">
                        추천
                    </span>
                        <span th:text="${selectedCategoryId == 0 ? '도서' : '분야의 신간 도서'}">도서</span>
                    </h2>
                </div>
            </div>
        </div>

        <div class="row px-xl-5 mb-4">
            <div class="col-12 text-center">
                <a th:href="@{/(categoryId=0)}"
                   class="category-pill"
                   th:classappend="${selectedCategoryId == 0} ? 'active'">
                    전체
                </a>

                <th:block th:each="cat : ${rootCategories}">
                    <a th:if="${cat.categoryName != '총류'}"
                       th:href="@{/(categoryId=${cat.categoryId})}"
                       class="category-pill"
                       th:classappend="${cat.categoryId == selectedCategoryId} ? 'active'"
                       th:text="${cat.categoryName}">
                        문학
                    </a>
                </th:block>
            </div>
        </div>

        <div class="row px-xl-5">
            <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(categoryBooks)}">
                <p class="text-muted" th:text="${selectedCategoryId == 0 ? '등록된 신간 도서가 없습니다.' : '해당 카테고리의 추천 도서가 없습니다.'}">
                    도서가 없습니다.
                </p>
            </div>

            <div class="col-lg-2 col-md-4 col-6" th:each="book : ${categoryBooks}">
                <div class="product-item bg-light mb-4">
                    <div class="product-img position-relative overflow-hidden">
                        <img class="img-fluid w-100 book-thumb"
                             th:src="${!#strings.isEmpty(book.bookImage) ? '/trillion-bucket/' + book.bookImage : '/img/default-book.png'}"
                             loading="lazy" alt="책 표지">
                        <div class="product-action">
                            <a class="btn btn-outline-dark btn-square" href="javascript:void(0);" th:onclick="'addToCart(' + ${book.bookId} + ')'">
                                <i class="fa fa-shopping-cart"></i>
                            </a>
                            <a class="btn btn-outline-dark btn-square"
                               href="javascript:void(0);"
                               th:onclick="'toggleWishlist(' + ${book.bookId} + ')'">
                                <i class="far fa-heart"></i>
                            </a>
                            <a class="btn btn-outline-dark btn-square" th:href="@{/books/{book_id}(book_id=${book.bookId})}"><i class="fa fa-search"></i></a>
                        </div>
                    </div>
                    <div class="text-center py-4 px-2">
                        <a class="h6 text-decoration-none text-truncate d-block mb-1"
                           th:href="@{/books/{book_id}(book_id=${book.bookId})}"
                           th:text="${book.bookName}">책 제목</a>

                        <div class="small text-muted mb-2">
                            <span th:text="${book.bookAuthor == null ? '저자 미상' : (#strings.length(book.bookAuthor) > 10 ? #strings.substring(book.bookAuthor, 0, 10) + '...' : book.bookAuthor)}">저자명</span>
                        </div>

                        <div class="d-flex align-items-center justify-content-center mt-1">
                            <div th:if="${book.bookSalePrice > 0}" class="d-flex align-items-center">
                                <h5 class="text-primary mb-0" th:text="${#numbers.formatInteger(book.bookSalePrice, 0, 'COMMA')} + '원'">12,000원</h5>
                                <h6 class="text-muted ml-2 mb-0" th:if="${book.bookSalePrice < book.bookRegularPrice}">
                                    <del th:text="${#numbers.formatInteger(book.bookRegularPrice, 0, 'COMMA')} + '원'">15,000원</del>
                                </h6>
                                <span class="badge badge-danger ml-2" th:if="${book.bookSalePrice < book.bookRegularPrice}" th:text="${book.discountRate} + '% 할인'">10% 할인</span>
                            </div>
                            <div th:if="${book.bookSalePrice == 0}">
                                <h5 class="text-primary mb-0" th:text="${#numbers.formatInteger(book.bookRegularPrice, 0, 'COMMA')} + '원'">15,000원</h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


</div>

<th:block layout:fragment="script">
    <script>
        // --- 슬라이더 스크립트 ---
        function slidePopular(direction) {
            const track = document.getElementById('popularBooksTrack');
            // 한번 클릭 시 이동할 너비
            const scrollAmount = 240;

            if (direction === 'left') {
                track.scrollLeft -= scrollAmount;
            } else {
                track.scrollLeft += scrollAmount;
            }
        }
        // ------------------------

        // 장바구니 담기
        function addToCart(bookId) {
            const data = {
                bookId: bookId,
                cartQuantity: 1
            };

            fetch('/carts/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
                .then(response => {
                    if (response.ok) {
                        if (confirm('장바구니에 담겼습니다. 장바구니로 이동하시겠습니까?')) {
                            location.href = '/carts';
                        }
                    } else if (response.status === 401) {
                        if(confirm('로그인이 필요한 서비스입니다. 로그인 페이지로 이동하시겠습니까?')) {
                            location.href = '/login';
                        }
                    } else {
                        response.text().then(msg => alert('장바구니 담기 실패: ' + msg));
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('오류가 발생했습니다.');
                });
        }

        // 찜하기
        function toggleWishlist(bookId) {
            fetch('/wishlists/toggle?bookId=' + bookId, {
                method: 'GET'
            })
                .then(response => {
                    if (response.status === 401) {
                        if(confirm('로그인이 필요한 서비스입니다. 로그인 페이지로 이동하시겠습니까?')) {
                            location.href = '/login';
                        }
                        return null;
                    }

                    if (response.ok) {
                        return response.json();
                    } else {
                        throw new Error('서버 오류');
                    }
                })
                .then(data => {
                    if (data) {
                        const msg = data.message || (data.isAdded ? '찜 목록에 추가되었습니다.' : '찜 목록에서 삭제되었습니다.');
                        alert(msg);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    if (error.message !== '서버 오류') {
                        // alert('오류가 발생했습니다.');
                    }
                });
        }
    </script>
</th:block>

</body>
</html>
