<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<head>
    <meta charset="UTF-8">
    <title>주문 상세 내역</title>
</head>

<body>
<div layout:fragment="content">
    <div class="container">
        <div class="row px-xl-5">
            <div class="col-12">
                <nav class="breadcrumb bg-light mb-30">
                    <a class="breadcrumb-item text-dark" th:href="@{/}">홈</a>
                    <a class="breadcrumb-item text-dark" th:href="@{/orders/non-members-order-form}">비회원 주문 조회</a>
                    <span class="breadcrumb-item active">주문 상세 정보</span>
                </nav>
            </div>
        </div>
    </div>

    <div class="container pb-5 px-xl-5">
        <div class="row">
            <!-- 왼쪽: 상품 정보 및 결제 정보 (col-lg-8) -->
            <div class="col-lg-8 col-md-8">
                <div class="card mb-4">
                    <div class="card-header bg-light">
                        <h5 class="m-0">주문 상품 목록</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered text-center mb-0">
                                <thead class="bg-secondary text-dark">
                                <tr>
                                    <th>상품 정보</th>
                                    <th style="width: 15%;">단가</th>
                                    <th style="width: 10%;">수량</th>
                                    <th style="width: 15%;">포장비</th>
                                    <th style="width: 15%;">합계</th>
                                    <th style="width: 15%;">상태</th>
                                </tr>
                                </thead>
                                <tbody class="align-middle">
                                <tr th:each="item : ${order.orderItems}"
                                    th:classappend="${#lists.contains({'CANCELED','RETURNED'}, item.orderItemStatus.name())} ? 'table-secondary' : ''">
                                    <td class="align-middle text-left">
                                        <div class="d-flex align-items-center">
                                            <img th:src="${!#strings.isEmpty(item.bookImage) ? '/trillion-bucket/' + item.bookImage : '/img/default-book.png'}"
                                                 alt="Book" style="width: 50px; aspect-ratio: 1/1.4; object-fit: cover; margin-right: 15px;">
                                            <span th:text="${item.bookName}">책 제목</span>
                                        </div>
                                    </td>
                                    <td th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')} + '원'"></td>
                                    <td th:text="${item.quantity}"></td>
                                    <td th:text="${item.packagingPrice > 0 ? #numbers.formatDecimal(item.packagingPrice, 0, 'COMMA', 0, 'POINT') + '원' : '-'}"></td>
                                    <td th:text="${#numbers.formatDecimal((item.unitPrice * item.quantity) + item.packagingPrice, 0, 'COMMA', 0, 'POINT') + '원'}"></td>
                                    <td class="align-middle">
                                        <span th:if="${item.orderItemStatus.name() == 'CANCELING'}" class="badge badge-warning px-2 py-1">
                                            <i class="fas fa-spinner fa-spin mr-1"></i>취소 중
                                        </span>
                                        <span th:unless="${item.orderItemStatus.name() == 'CANCELING'}" 
                                              class="badge badge-pill px-2 py-1"
                                              th:classappend="${#lists.contains({'CANCELED','FAILED'}, item.orderItemStatus.name()) ? 'badge-danger' : 'badge-primary'}"
                                              th:text="${item.orderItemStatus.title}">상태</span>
                                        
                                        <!-- 비회원 반품 신청 버튼 -->
                                        <div th:if="${item.orderItemStatus.name() == 'DELIVERED'}" class="mt-2">
                                            <button type="button" class="btn btn-sm btn-outline-danger"
                                                    th:onclick="openReturnModal([[${order.orderId}]], [[${item.orderItemId}]])">
                                                반품신청
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header bg-light">
                        <h5 class="m-0">최종 결제 정보</h5>
                    </div>
                    <div class="card-body">
                        <div class="border-bottom pt-3 pb-2">
                            <div class="d-flex justify-content-between mb-3">
                                <h6 class="text-dark">상품 금액</h6>
                                <h6 th:text="${#numbers.formatDecimal(order.originPrice,0,'COMMA',0,'POINT')} + '원'"></h6>
                            </div>
                            <div class="d-flex justify-content-between mb-3 text-danger" th:if="${order.totalCouponDiscount > 0}">
                                <h6 class="font-weight-medium">쿠폰 할인</h6>
                                <h6 class="font-weight-medium" th:text="'-' + ${#numbers.formatDecimal(order.totalCouponDiscount,0,'COMMA',0,'POINT')} + '원'"></h6>
                            </div>
                            <div class="d-flex justify-content-between">
                                <h6 class="font-weight-medium text-dark">배송비</h6>
                                <h6 th:text="${#numbers.formatDecimal(order.deliveryFee,0,'COMMA',0,'POINT')} + '원'"></h6>
                            </div>
                        </div>
                        <div class="pt-2">
                            <div class="d-flex justify-content-between mt-2">
                                <h5>총 결제 금액</h5>
                                <h5 th:text="${#numbers.formatDecimal(order.totalPrice,0,'COMMA',0,'POINT')} + '원'"></h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div> <!-- col-lg-8 닫힘 -->

            <!-- 오른쪽: 주문 요약 및 정보 (col-lg-4) -->
            <div class="col-lg-4 col-md-4">
                <div class="card mb-4">
                    <div class="card-header bg-light">
                        <h5 class="m-0">주문 요약 정보</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-4">
                            <h6 class="mb-3">주문 정보</h6>
                            <table class="table table-bordered table-sm text-dark small">
                                <tbody>
                                    <tr><th class="bg-light w-25">주문번호</th><td th:text="${order.orderNumber}"></td></tr>
                                    <tr><th class="bg-light w-25">주문일시</th><td th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}"></td></tr>
                                    <tr><th class="bg-light w-25">주문상태</th><td th:text="${order.orderStatus.title}"></td></tr>
                                </tbody>
                            </table>
                        </div>
                        <hr>
                        <div class="mb-4">
                            <h6 class="mb-3">주문자 정보</h6>
                            <table class="table table-bordered table-sm text-dark small">
                                <tbody>
                                    <tr><th class="bg-light w-25">이름</th><td th:text="${order.ordererInfo.ordererName}"></td></tr>
                                    <tr><th class="bg-light w-25">연락처</th><td th:text="${order.ordererInfo.ordererContact}"></td></tr>
                                </tbody>
                            </table>
                        </div>
                        <hr>
                        <div>
                            <h6 class="mb-3">배송지 정보</h6>
                            <table class="table table-bordered table-sm text-dark small">
                                <tbody>
                                    <tr><th class="bg-light w-25">이름</th><td th:text="${order.receiverInfo.receiverName}"></td></tr>
                                    <tr><th class="bg-light w-25">연락처</th><td th:text="${order.receiverInfo.receiverContact}"></td></tr>
                                    <tr><th class="bg-light w-25">주소</th><td th:text="${order.receiverInfo.receiverAddress}"></td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div th:if="${order.orderStatus.name() == 'COMPLETED' and #lists.size(order.orderItems.?[orderItemStatus.name() != 'PREPARING']) == 0}" class="mb-3">
                    <form th:action="@{/orders/non-members/{orderId}/cancel(orderId=${order.orderId})}" method="post" onsubmit="return confirm('정말 주문 전체를 취소하시겠습니까?');">
                        <input type="hidden" name="password" th:value="${nonMemberPassword}">
                        <button type="submit" class="btn btn-danger btn-block py-3 font-weight-bold">주문 전체 취소</button>
                    </form>
                </div>

                <a th:href="@{/orders/non-members-order-form}" class="btn btn-primary btn-block py-3 font-weight-bold">목록으로</a>
            </div> <!-- col-lg-4 닫힘 -->
        </div> <!-- row 닫힘 -->
    </div> <!-- container 닫힘 -->
    
    <!-- 비회원 반품 모달 -->
    <div class="modal fade" id="returnModal" tabindex="-1" role="dialog" aria-labelledby="returnModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-light">
                    <h5 class="modal-title font-weight-bold" id="returnModalLabel">
                        <i class="fas fa-undo mr-2 text-danger"></i>반품 신청
                    </h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <form id="returnForm" method="post">
                    <div class="modal-body p-4">
                        <p class="font-weight-bold mb-2">반품 사유를 선택해주세요.</p>

                        <!-- 비회원 인증 정보 (Hidden) -->
                        <input type="hidden" name="password" th:value="${nonMemberPassword}">
                        <input type="hidden" name="orderNumber" th:value="${order.orderNumber}">

                        <div class="form-group mb-4">
                            <select class="form-control form-control-lg" name="reason" id="returnReasonSelect" required onchange="updatePolicyInfo()">
                                <option value="CHANGE_OF_MIND">단순 변심</option>
                                <option value="DAMAGED">상품 파손 / 오배송</option>
                            </select>
                        </div>

                        <!-- 사유별 상세 정책 안내 -->
                        <div id="policyInfoBox" class="p-3 bg-light rounded border">
                            <div id="policy-CHANGE_OF_MIND">
                                <h6 class="font-weight-bold text-dark mb-1"><i class="fas fa-user-tag mr-2"></i>단순 변심</h6>
                                <p class="text-muted small mb-0">반품 배송비는 <strong>구매자 부담</strong>입니다.<br>환불 금액에서 배송비가 차감됩니다.</p>
                            </div>
                            <div id="policy-DAMAGED" style="display: none;">
                                <h6 class="font-weight-bold text-success mb-1"><i class="fas fa-check-circle mr-2"></i>상품 파손 / 오배송</h6>
                                <p class="text-muted small mb-0">반품 배송비는 <strong>판매자 부담</strong>입니다.<br>전액 환불됩니다.</p>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-secondary px-4" data-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-danger px-4 font-weight-bold">반품 신청하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script>
        function updatePolicyInfo() {
            var reason = document.getElementById('returnReasonSelect').value;
            document.getElementById('policy-CHANGE_OF_MIND').style.display = (reason === 'CHANGE_OF_MIND' ? 'block' : 'none');
            document.getElementById('policy-DAMAGED').style.display = (reason === 'DAMAGED' ? 'block' : 'none');
        }

        function openReturnModal(orderId, itemId) {
            var form = document.getElementById('returnForm');
            // 비회원 반품 URL로 동적 변경
            form.action = '/orders/non-members/' + orderId + '/items/' + itemId + '/return';
            
            // 정책 정보 초기화 및 모달 오픈
            document.getElementById('returnReasonSelect').value = 'CHANGE_OF_MIND';
            updatePolicyInfo();
            $('#returnModal').modal('show');
        }
    </script>
</th:block>

</body>
</html>
